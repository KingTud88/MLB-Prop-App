name: Freeze Hits Outs Execution V19

on:
  push:
    paths:
      - '.github/workflows/freeze-hits-outs-execution-v19.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pytest
      - name: Apply frozen execution history
        run: python .github/scripts/freeze_hits_outs_execution_v19.py
      - name: Compile changed Python
        run: python -m compileall -q pages engine training tests
      - name: Targeted frozen execution tests
        run: pytest -q tests/test_frozen_execution_history.py tests/test_projection_history_learning_dashboard.py tests/test_daily_run_contract.py
      - name: Full regression suite
        run: pytest -q
      - name: Commit verified execution history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add engine/execution_history.py training/projection_storage.py pages/5_Daily_Projection_Run.py pages/4_Projection_History.py tests/test_frozen_execution_history.py
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No product changes to commit."
            exit 0
          fi
          git commit -m "Freeze Hits and Outs execution decisions"
          git restore .
          git clean -fd
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
