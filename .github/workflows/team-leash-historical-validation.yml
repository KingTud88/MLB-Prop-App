name: Team Leash Historical Validation

on:
  push:
    branches:
      - research/team-leash-historical-validation

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run chronological team leash validation
        run: python -m training.team_leash_historical_validation
      - name: Commit validation outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/team_leash_historical_detail.csv data/team_leash_historical_summary.csv data/team_leash_historical_decisions.csv
          if git diff --cached --quiet; then
            echo "No validation changes to commit"
          else
            git commit -m "Refresh historical team leash validation"
            git push
          fi
