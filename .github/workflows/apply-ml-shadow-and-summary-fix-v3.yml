name: Apply ML shadow and Projection Summary fix v3

on:
  push:
    paths:
      - ".github/workflows/apply-ml-shadow-and-summary-fix-v3.yml"

permissions:
  contents: write

jobs:
  patch-verify-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
      - name: Apply guarded production wiring and contract refresh
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"Target missing in {path}: {old[:120]!r}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "training/ml_shadow_report.py",
              '    "market",\n    "line",\n    "projection",',
              '    "market",\n    "projection",',
          )
          replace_once(
              "automation/daily_projection_runner.py",
              '        "projection": result.ensemble_mean, "k_sd": result.ensemble_sd,\n',
              '        "projection": result.ensemble_mean, "k_sd": result.ensemble_sd,\n        "sim_mean_k": result.simulation_mean, "math_mean_k": result.mathematical_mean,\n        "sim_sd_k": result.simulation_sd, "math_sd_k": result.mathematical_sd,\n',
          )
          replace_once(
              "streamlit_app.py",
              'from engine.team_leash import build_team_leash_context, candidate_workload_fields\n',
              'from engine.team_leash import build_team_leash_context, candidate_workload_fields\nfrom engine.ml_shadow_ui import render_ml_shadow_dashboard\n',
          )
          replace_once(
              "streamlit_app.py",
              '    if no_line:\n        cls="reco-neutral"\n        side_text="PROJECTION ONLY"\n        line_text="NO ACTIVE LINE"\n        meta=f"Projection {projection_text} · add line on Daily Projection Run"\n        line_class="reco-line"',
              '    if no_line:\n        cls="reco-neutral"\n        side_text=f"{projection_text} PROJ"\n        line_text="NO ACTIVE LINE"\n        meta="Bet lean waits for a Daily Projection Run sportsbook line"\n        line_class="reco-line"',
          )
          replace_once(
              "streamlit_app.py",
              '/* PROJECTION_WEATHER_SUMMARY_V10 · compact Hits pair + game delay-risk command card */',
              '/* PROJECTION_SUMMARY_NO_LINE_V14 · compact no-market state; approved emblem geometry untouched */\n.reco-card.reco-neutral .reco-side{\n    font-size:1.82rem!important;\n    line-height:1.04!important;\n    letter-spacing:-.02em!important;\n    white-space:nowrap!important;\n}\n.reco-card.reco-neutral .reco-line{margin-top:.36rem!important}\n.reco-card.reco-neutral .reco-meta{max-width:100%!important;line-height:1.35!important}\n@media (max-width:900px){.reco-card.reco-neutral .reco-side{font-size:1.65rem!important}}\n\n/* PROJECTION_WEATHER_SUMMARY_V10 · compact Hits pair + game delay-risk command card */',
          )
          replace_once(
              "streamlit_app.py",
              'st.dataframe(model_view,use_container_width=True,hide_index=True); st.markdown("### Calibration diagnostics"); render_calibration_dashboard(); st.dataframe(calibration_summary(load_projection_history()),use_container_width=True,hide_index=True); st.stop()',
              'st.dataframe(model_view,use_container_width=True,hide_index=True); st.markdown("### Calibration diagnostics"); render_calibration_dashboard(); st.dataframe(calibration_summary(load_projection_history()),use_container_width=True,hide_index=True); render_ml_shadow_dashboard(game); st.stop()',
          )

          for test_path in ("tests/test_bet_add_buttons_contract.py", "tests/test_manual_market_controls.py"):
              replace_once(
                  test_path,
                  '    assert "PROJECTION ONLY" in source',
                  '    assert \'side_text=f"{projection_text} PROJ"\' in source',
              )
          PY
      - name: Compile
        run: python -m compileall -q streamlit_app.py navigation.py engine automation training tests
      - name: Full regression suite
        run: pytest -q
      - name: Generate initial report-only ML evidence
        run: python -m training.ml_shadow_report
      - name: Commit verified changes and reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add streamlit_app.py automation/daily_projection_runner.py engine/ml_shadow_ui.py training/ml_shadow_report.py tests data/ml_shadow_detail.csv data/ml_shadow_summary.csv data/ml_shadow_live_candidates.csv data/ml_shadow_feature_manifest.csv
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add report-only ML shadow and repair Projection Summary no-line cards"
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
