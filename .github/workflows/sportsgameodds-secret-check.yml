name: SportsGameOdds Secret Check

on:
  push:
    branches:
      - sportsgameodds-secret-check
    paths:
      - .github/workflows/sportsgameodds-secret-check.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/sportsgameodds-secret-check.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SPORTSGAMEODDS_API_KEY: ${{ secrets.SPORTSGAMEODDS_API_KEY }}
    steps:
      - name: Verify secret is present
        shell: bash
        run: |
          if [ -z "$SPORTSGAMEODDS_API_KEY" ]; then
            echo "SPORTSGAMEODDS_API_KEY is not available to this workflow."
            exit 2
          fi
          echo "SPORTSGAMEODDS_API_KEY is present."

      - name: Verify SportsGameOdds authentication
        shell: bash
        run: |
          set -euo pipefail
          status=$(curl -sS -o usage.json -w "%{http_code}" \
            -H "x-api-key: ${SPORTSGAMEODDS_API_KEY}" \
            "https://api.sportsgameodds.com/v2/account/usage")
          echo "SportsGameOdds usage endpoint HTTP status: ${status}"
          if [ "$status" != "200" ]; then
            python - <<'PY'
          import json
          from pathlib import Path
          try:
              payload = json.loads(Path('usage.json').read_text())
              print('API error:', payload.get('error', 'unknown error'))
          except Exception:
              print('API returned a non-JSON error response.')
          PY
            exit 3
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('usage.json').read_text())
          assert payload.get('success') is True, payload.get('error', 'SportsGameOdds returned success=false')
          data = payload.get('data') or {}
          tier = data.get('tier', 'unknown')
          active = data.get('isActive', 'unknown')
          limits = data.get('rateLimits') or {}
          month = limits.get('per-month') or {}
          max_objects = month.get('max-entities', month.get('maxEntitiesPerInterval', 'unknown'))
          used_objects = month.get('current-entities', month.get('currentIntervalEntities', 'unknown'))
          print(f'Authentication OK. tier={tier} active={active} monthly_objects_used={used_objects} monthly_objects_max={max_objects}')
          PY

      - name: Verify MLB events access
        shell: bash
        run: |
          set -euo pipefail
          status=$(curl -sS -o events.json -w "%{http_code}" \
            -H "x-api-key: ${SPORTSGAMEODDS_API_KEY}" \
            "https://api.sportsgameodds.com/v2/events?leagueID=MLB&oddsAvailable=true&limit=1")
          echo "SportsGameOdds MLB events endpoint HTTP status: ${status}"
          test "$status" = "200"
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('events.json').read_text())
          assert payload.get('success') is True, payload.get('error', 'SportsGameOdds returned success=false')
          events = payload.get('data') or []
          print(f'MLB events access OK. returned_events={len(events)}')
          if payload.get('notice'):
              print('Provider notice:', payload['notice'])
          PY
