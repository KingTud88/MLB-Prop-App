name: Apply total outs UI patch

on:
  push:
    branches: [main]
    paths:
      - scripts/patch_outs_ui.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply outs UI patch
        run: python scripts/patch_outs_ui.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add streamlit_app.py pages/4_Projection_History.py pages/5_Daily_Projection_Run.py pages/6_Top_Plays.py
          if git diff --cached --quiet; then
            echo "No changes needed."
          else
            git commit -m "Wire calibrated total outs through app UI"
            for attempt in 1 2 3; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then exit 0; fi
              sleep $((attempt * 2))
            done
            exit 1
          fi
