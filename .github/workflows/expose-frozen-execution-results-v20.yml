name: Expose Frozen Execution Results V20

on:
  push:
    paths:
      - '.github/workflows/expose-frozen-execution-results-v20.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pytest
      - name: Apply Projection History display fix
        run: python .github/scripts/expose_frozen_execution_results_v20.py
      - name: Compile changed Python
        run: python -m compileall -q pages tests
      - name: Targeted execution-history tests
        run: pytest -q tests/test_frozen_execution_history.py tests/test_projection_history_learning_dashboard.py
      - name: Full regression suite
        run: pytest -q
      - name: Commit verified display fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages/4_Projection_History.py tests/test_frozen_execution_history.py
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No product changes to commit."
            exit 0
          fi
          git commit -m "Show frozen Hits and Outs execution results"
          git restore .
          git clean -fd
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
