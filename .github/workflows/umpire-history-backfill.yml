name: Umpire History Backfill

on:
  workflow_dispatch:
  push:
    branches:
      - umpire-history-backfill
    paths:
      - automation/backfill_umpire_history.py
      - .github/workflows/umpire-history-backfill.yml

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt pytest
      - name: Umpire leakage contracts
        run: PYTHONPATH=. pytest -q tests/test_umpire_context.py
      - name: Backfill 2026 regular-season umpire observations
        run: PYTHONPATH=. python automation/backfill_umpire_history.py --start-date 2026-03-25 --end-date 2026-08-13
      - name: Commit backfill evidence to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/umpire_observation_log.csv
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Backfill 2026 umpire observations"
          git push origin HEAD:umpire-history-backfill
