name: Expand sidebar brand

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Expand mascot and wordmark
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('navigation.py')
          s = p.read_text()
          changes = [
              ('height:126px;', 'height:174px;'),
              ('margin:-.08rem 0 .2rem;', 'margin:-.2rem 0 -.12rem;'),
              ('width:122px;', 'width:172px;'),
              ('height:122px;', 'height:172px;'),
              ('font-size:1.19rem;', 'font-size:1.52rem;'),
              ('line-height:1;', 'line-height:.92;'),
              ('.sk-nav-title span { color:#ff3655; }', '.sk-nav-title span { color:#ff3655; font-size:1.68rem; letter-spacing:.035em; }'),
              ('font-size:.66rem;', 'font-size:.61rem;'),
              ('margin:.48rem 0 .05rem;', 'margin:.52rem .2rem .05rem;'),
          ]
          changed = False
          for old, new in changes:
              if old in s:
                  s = s.replace(old, new, 1)
                  changed = True
          if changed:
              p.write_text(s)
          PY
      - name: Commit patch
        run: |
          if git diff --quiet -- navigation.py; then
            echo "No navigation changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add navigation.py
          git commit -m "Expand sidebar mascot and wordmark"
          git push
