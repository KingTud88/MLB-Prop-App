name: Expand sidebar brand

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Force mascot visual scale
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('navigation.py')
          s = p.read_text()

          base = 'https://raw.githubusercontent.com/KingTud88/MLB-Prop-App/main/assets/strikeout_king_9000_sidebar.png'
          s = re.sub(re.escape(base) + r'(?:\?v=\d+)?', base + '?v=8', s, count=1)

          # Keep the approved sidebar/wordmark dimensions exactly as-is.
          # Only enlarge the mascot visually inside its existing clipped slot.
          s = re.sub(
              r'(\.sk-nav-mascot img \{[\s\S]*?transform:)[^;]+;',
              r'\g<1>scale(1.90) !important;',
              s,
              count=1,
          )
          s = re.sub(
              r'(<img src="\{MASCOT_URL\}" alt="StrikeOut King 9000 mascot" style=")[^"]*(" onerror=)',
              r'\g<1>width:236px !important;height:236px !important;min-width:236px !important;max-width:236px !important;object-fit:contain !important;display:block !important;transform:scale(1.90) !important;transform-origin:50% 50% !important;\g<2>',
              s,
              count=1,
          )

          if 'transform:scale(1.90) !important' not in s:
              raise SystemExit('Mascot scale patch did not apply')

          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          if git diff --quiet -- navigation.py; then
            echo "No mascot scale changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add navigation.py
          git commit -m "Scale sidebar mascot up visibly"
          git push
