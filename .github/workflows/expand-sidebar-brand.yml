name: Projection Persistence + History UI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Keep manual line highlight applied
        run: python tools/highlight_manual_lines.py

      - name: Keep Projection History command UI applied
        run: python tools/patch_projection_history_command.py

      - name: Add restart-safe projection persistence
        run: python tools/patch_projection_persistence.py

      - name: Validate Python syntax
        run: python -m py_compile training/projection_storage.py pages/4_Projection_History.py pages/5_Daily_Projection_Run.py pages/6_Top_Plays.py

      - name: Commit safely
        run: |
          if git diff --quiet -- pages/4_Projection_History.py pages/5_Daily_Projection_Run.py pages/6_Top_Plays.py; then
            echo "Projection persistence patch already present"
            exit 0
          fi
          git config user.name "KingTud88"
          git config user.email "jaxson0603@gmail.com"
          git add pages/4_Projection_History.py pages/5_Daily_Projection_Run.py pages/6_Top_Plays.py
          git commit -m "Persist manual projection lines across app restarts"
          for attempt in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main || { git rebase --abort || true; sleep 2; continue; }
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          echo "Could not push projection persistence patch after retries"
          exit 1
