name: Expand sidebar brand

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scale visible mascot artwork
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('navigation.py')
          s = p.read_text()
          changes = [
              ('width: 276px !important;', 'width: 252px !important;'),
              ('min-width: 276px !important;', 'min-width: 252px !important;'),
              ('[data-testid="stSidebar"] > div:first-child { width:276px !important; }', '[data-testid="stSidebar"] > div:first-child { width:252px !important; }'),
              ('height:248px;', 'height:226px;'),
              ('margin:-.45rem 0 -.42rem;', 'margin:-.52rem 0 -.55rem;'),
              ('filter: drop-shadow(0 9px 18px rgba(0,0,0,.3));', 'filter: drop-shadow(0 9px 18px rgba(0,0,0,.3));\n            transform:scale(1.42);\n            transform-origin:50% 50%;'),
          ]
          changed = False
          for old, new in changes:
              if old in s:
                  s = s.replace(old, new, 1)
                  changed = True
          if 'height:226px;' in s and 'overflow:hidden;' not in s[s.find('.sk-nav-mascot {'):s.find('.sk-nav-mascot img {')]:
              s = s.replace('            position: relative;\n        }\n        .sk-nav-mascot img {', '            position: relative;\n            overflow:hidden;\n        }\n        .sk-nav-mascot img {', 1)
              changed = True
          if not changed:
              raise SystemExit('Expected sidebar mascot values were not found')
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          if git diff --quiet -- navigation.py; then
            echo "No navigation changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add navigation.py
          git commit -m "Scale mascot artwork inside sidebar"
          git push
