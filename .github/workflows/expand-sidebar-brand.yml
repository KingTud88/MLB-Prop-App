name: Expand sidebar brand

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply final mascot and wordmark lockup
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('navigation.py')
          s = p.read_text()
          changes = [
              ('height:216px;', 'height:248px;'),
              ('margin:-.28rem 0 -.18rem;', 'margin:-.45rem 0 -.42rem;'),
              ('width:214px;', 'width:246px;'),
              ('height:214px;', 'height:246px;'),
              ('font-size:1.82rem;', 'font-size:2.05rem;'),
              ('line-height:.9;', 'line-height:.86;'),
              ('.sk-nav-title span { color:#ff3655; font-size:2rem; letter-spacing:.04em; }', '.sk-nav-title span { color:#ff3655; font-size:2.28rem; letter-spacing:.045em; white-space:nowrap; }'),
              ('font-size:.68rem;', 'font-size:.72rem;'),
              ('margin:.58rem .45rem .08rem;', 'margin:.42rem .35rem .02rem;'),
              ('margin:.9rem .95rem .38rem;', 'margin:.58rem .95rem .38rem;'),
              ('color:#7790aa;', 'color:#d72b43;'),
              ('font-size:.61rem;', 'font-size:.67rem;'),
              ('st.markdown(\'<div class="sk-nav-title">StrikeOut <span>King 9000</span></div>\', unsafe_allow_html=True)', 'st.markdown(\'<div class="sk-nav-title">STRIKEOUT<br><span>KING 9000</span></div>\', unsafe_allow_html=True)'),
          ]
          changed = False
          for old, new in changes:
              if old in s:
                  s = s.replace(old, new, 1)
                  changed = True
          if not changed:
              raise SystemExit('Expected sidebar brand values were not found')
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          if git diff --quiet -- navigation.py; then
            echo "No navigation changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add navigation.py
          git commit -m "Finalize sidebar mascot and wordmark lockup"
          git push
