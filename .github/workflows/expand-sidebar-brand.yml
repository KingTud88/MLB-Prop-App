name: Expand sidebar brand

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build cropped sidebar mascot and wire it in
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps

          src = Path('assets/strikeout_king_9000_clean.png')
          out = Path('assets/strikeout_king_9000_sidebar.png')
          im = Image.open(src).convert('RGBA')
          alpha = im.getchannel('A')
          bbox = alpha.getbbox()
          if not bbox:
              raise SystemExit('Mascot asset has no visible pixels')
          cropped = im.crop(bbox)
          pad = max(4, round(max(cropped.size) * 0.035))
          cropped = ImageOps.expand(cropped, border=pad, fill=(0, 0, 0, 0))
          cropped.save(out, optimize=True)

          p = Path('navigation.py')
          s = p.read_text()
          s = s.replace(
              'assets/strikeout_king_9000_clean.png',
              'assets/strikeout_king_9000_sidebar.png',
              1,
          )
          s = s.replace('height:232px;', 'height:224px;', 1)
          s = s.replace('margin:-.72rem 0 -.95rem;', 'margin:-.42rem 0 -.52rem;', 1)
          s = s.replace('width:246px;', 'width:220px;', 1)
          s = s.replace('height:246px;', 'height:220px;', 1)
          s = s.replace('transform:scale(2.15) translateY(1%);', 'transform:none;', 1)
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          if git diff --quiet -- navigation.py assets/strikeout_king_9000_sidebar.png; then
            echo "No mascot changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add navigation.py assets/strikeout_king_9000_sidebar.png
          git commit -m "Use tightly cropped sidebar mascot"
          git push
