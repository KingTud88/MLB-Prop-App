name: Projection Weather Card Hero

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  projection-weather-card-hero:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install repo test dependencies
        run: pip install -r requirements.txt pytest

      - name: Validate patch script
        run: python -m py_compile .github/scripts/weather_card_hero_v13.py

      - name: Apply Projection weather card hero
        run: python .github/scripts/weather_card_hero_v13.py

      - name: Validate app syntax
        run: python -m py_compile streamlit_app.py

      - name: Validate weather card UI contracts
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path("streamlit_app.py").read_text(encoding="utf-8")
          required = [
              'WEATHER_CARD_HERO_V13',
              'grid-template-columns:minmax(0,1fr) 100px',
              '.weather-high .game-weather-icon',
              '.weather-elevated .game-weather-icon',
              '.weather-low .game-weather-icon',
              '.weather-none .game-weather-icon',
              'width:92px;',
              'height:92px;',
              '"☀️" if str(weather_risk.level or "").upper()=="NONE"',
          ]
          missing = [token for token in required if token not in source]
          if missing:
              raise SystemExit(f"Missing weather card hero contracts: {missing}")
          print("Projection weather card hero contracts present")
          PY
          python -m pytest -q tests/test_projection_weather_batter_contract.py tests/test_weather_risk.py

      - name: Commit weather card hero safely
        run: |
          if git diff --quiet -- streamlit_app.py; then
            echo "Projection weather card hero already applied"
            exit 0
          fi
          git config user.name "KingTud88"
          git config user.email "jaxson0603@gmail.com"
          git add streamlit_app.py
          git commit -m "Enlarge Projection weather card symbol"
          for attempt in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main || { git rebase --abort || true; sleep 2; continue; }
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          echo "Could not push Projection weather card hero after retries"
          exit 1
