name: Expand sidebar brand

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Crop mascot to bright visible artwork
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageChops, ImageFilter

          src = Path('assets/strikeout_king_9000_clean.png')
          out = Path('assets/strikeout_king_9000_sidebar.png')
          im = Image.open(src).convert('RGBA')
          rgb = im.convert('RGB')
          alpha = im.getchannel('A')

          # The source contains dark canvas pixels that visually disappear into the sidebar.
          # Detect the actual red/white/gray mascot by brightness/color instead of alpha.
          r, g, b = rgb.split()
          max_rgb = ImageChops.lighter(ImageChops.lighter(r, g), b)
          min_rgb = ImageChops.darker(ImageChops.darker(r, g), b)
          chroma = ImageChops.subtract(max_rgb, min_rgb)
          bright = max_rgb.point(lambda p: 255 if p >= 48 else 0)
          colored = chroma.point(lambda p: 255 if p >= 24 else 0)
          white_gray = max_rgb.point(lambda p: 255 if p >= 92 else 0)
          mask = ImageChops.lighter(ImageChops.multiply(bright, colored), white_gray)
          mask = ImageChops.multiply(mask, alpha.point(lambda p: 255 if p > 20 else 0))
          mask = mask.filter(ImageFilter.MaxFilter(7))
          bbox = mask.getbbox()
          if not bbox:
              raise SystemExit('Could not detect mascot artwork')

          x0, y0, x1, y1 = bbox
          pad = max(5, round(max(x1 - x0, y1 - y0) * 0.07))
          bbox = (max(0, x0 - pad), max(0, y0 - pad), min(im.width, x1 + pad), min(im.height, y1 + pad))
          cropped = im.crop(bbox)
          cropped.save(out, optimize=True)
          print(f'source={im.size} bright_artwork_bbox={bbox} output={cropped.size}')

          p = Path('navigation.py')
          s = p.read_text()
          base = 'https://raw.githubusercontent.com/KingTud88/MLB-Prop-App/main/assets/strikeout_king_9000_sidebar.png'
          # Remove any previous cache-buster before applying the new one.
          import re
          s = re.sub(re.escape(base) + r'(?:\?v=\d+)?', base + '?v=4', s, count=1)
          # Keep every approved sidebar treatment untouched; only the mascot box changes.
          s = s.replace('height:236px;', 'height:238px;', 1)
          s = s.replace('width:232px;', 'width:234px;', 1)
          s = s.replace('height:232px;', 'height:234px;', 1)
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          if git diff --quiet -- navigation.py assets/strikeout_king_9000_sidebar.png; then
            echo "No mascot changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add navigation.py assets/strikeout_king_9000_sidebar.png
          git commit -m "Crop mascot to visible artwork"
          git push
