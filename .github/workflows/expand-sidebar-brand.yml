name: Projection Summary Emblem Crispness

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  crisp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Switch Summary emblems to high-resolution master sheet
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('streamlit_app.py')
          text = p.read_text(encoding='utf-8')
          marker = 'PROJECTION_EMBLEM_MASTER_V9'
          if marker in text:
              print('Projection emblem master V9 already active')
              raise SystemExit(0)

          anchor = '/* PROJECTION_SUMMARY_LAYOUT_V8 · title top, value left, large emblem right */'
          start = text.find(anchor)
          if start < 0:
              raise SystemExit('Projection Summary V8 anchor not found; refusing to change unrelated code')
          end = text.find('</style>', start)
          if end < 0:
              raise SystemExit('Projection style close not found; refusing to patch')

          override = '''
          /* PROJECTION_EMBLEM_MASTER_V9 · 128px master tiles rendered down for sharper edges */
          .cc-card-icon.cc-emblem{
              background-image:url("https://raw.githubusercontent.com/KingTud88/MLB-Prop-App/main/assets/projection_summary_emblems_v2.webp?v=9")!important;
              background-size:600% 100%!important;
              background-repeat:no-repeat!important;
              filter:drop-shadow(0 2px 2px rgba(0,0,0,.28)) drop-shadow(0 0 2px rgba(236,22,56,.12))!important;
              image-rendering:auto!important;
          }
          .metric-card .cc-emblem.whiff{background-position:0% 50%!important}
          .reco-card .cc-emblem.whiff{background-position:20% 50%!important}
          .metric-card .cc-emblem.glove{background-position:40% 50%!important}
          .reco-card .cc-emblem.glove{background-position:60% 50%!important}
          .metric-card .cc-emblem.contact{background-position:80% 50%!important}
          .reco-card .cc-emblem.contact{background-position:100% 50%!important}
          '''

          text = text[:end] + override + text[end:]
          p.write_text(text, encoding='utf-8')
          print('Applied higher-resolution Projection Summary master artwork')
          PY

      - name: Validate Python syntax
        run: python -m py_compile streamlit_app.py

      - name: Commit emblem crispness safely
        run: |
          if git diff --quiet -- streamlit_app.py; then
            echo "Projection emblem crispness already applied"
            exit 0
          fi
          git config user.name "KingTud88"
          git config user.email "jaxson0603@gmail.com"
          git add streamlit_app.py
          git commit -m "Sharpen Projection Summary emblems"
          for attempt in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main || { git rebase --abort || true; sleep 2; continue; }
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          echo "Could not push emblem crispness after retries"
          exit 1
