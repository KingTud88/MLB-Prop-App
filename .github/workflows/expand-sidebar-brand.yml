name: Market Line Integrity Fix

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply market-line integrity patch
        run: python tools/patch_market_line_integrity.py

      - name: Validate Python syntax
        run: python -m py_compile engine/model_top_plays.py engine/bet_tracker.py pages/2_Bet_Tracker.py pages/5_Daily_Projection_Run.py pages/6_Top_Plays.py

      - name: Commit safely
        run: |
          if git diff --quiet -- engine/model_top_plays.py engine/bet_tracker.py pages/2_Bet_Tracker.py pages/5_Daily_Projection_Run.py pages/6_Top_Plays.py; then
            echo "No market-line integrity changes to commit"
            exit 0
          fi
          git config user.name "KingTud88"
          git config user.email "jaxson0603@gmail.com"
          git add engine/model_top_plays.py engine/bet_tracker.py pages/2_Bet_Tracker.py pages/5_Daily_Projection_Run.py pages/6_Top_Plays.py
          git commit -m "Use verified market lines for Top Plays"
          for attempt in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main || { git rebase --abort || true; sleep 2; continue; }
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          echo "Could not push market-line integrity patch after retries"
          exit 1
