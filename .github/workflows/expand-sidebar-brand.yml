name: Expand sidebar brand

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Isolate mascot artwork component
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from collections import deque
          from pathlib import Path
          from PIL import Image, ImageChops, ImageFilter
          import re

          src = Path('assets/strikeout_king_9000_clean.png')
          out = Path('assets/strikeout_king_9000_sidebar.png')
          im = Image.open(src).convert('RGBA')
          rgb = im.convert('RGB')
          alpha = im.getchannel('A')
          r, g, b = rgb.split()
          max_rgb = ImageChops.lighter(ImageChops.lighter(r, g), b)
          min_rgb = ImageChops.darker(ImageChops.darker(r, g), b)
          chroma = ImageChops.subtract(max_rgb, min_rgb)

          bright = max_rgb.point(lambda p: 255 if p >= 52 else 0)
          colored = chroma.point(lambda p: 255 if p >= 28 else 0)
          light_neutral = max_rgb.point(lambda p: 255 if p >= 105 else 0)
          mask = ImageChops.lighter(ImageChops.multiply(bright, colored), light_neutral)
          mask = ImageChops.multiply(mask, alpha.point(lambda p: 255 if p > 24 else 0))
          mask = mask.filter(ImageFilter.MaxFilter(5))

          w, h = mask.size
          pix = mask.load()
          seen = bytearray(w * h)
          components = []
          for y in range(h):
              for x in range(w):
                  idx = y * w + x
                  if seen[idx] or pix[x, y] == 0:
                      continue
                  q = deque([(x, y)])
                  seen[idx] = 1
                  area = 0
                  x0 = x1 = x
                  y0 = y1 = y
                  while q:
                      cx, cy = q.popleft()
                      area += 1
                      x0, x1 = min(x0, cx), max(x1, cx)
                      y0, y1 = min(y0, cy), max(y1, cy)
                      for ny in range(max(0, cy-1), min(h, cy+2)):
                          for nx in range(max(0, cx-1), min(w, cx+2)):
                              ni = ny * w + nx
                              if not seen[ni] and pix[nx, ny] != 0:
                                  seen[ni] = 1
                                  q.append((nx, ny))
                  components.append((area, (x0, y0, x1 + 1, y1 + 1)))

          if not components:
              raise SystemExit('No mascot component detected')
          components.sort(reverse=True)
          area, bbox = components[0]
          x0, y0, x1, y1 = bbox
          pad = max(7, round(max(x1 - x0, y1 - y0) * 0.11))
          bbox = (max(0, x0-pad), max(0, y0-pad), min(w, x1+pad), min(h, y1+pad))
          cropped = im.crop(bbox)
          cropped.save(out, optimize=True)
          print(f'source={im.size} components_top5={components[:5]} selected={bbox} output={cropped.size}')

          p = Path('navigation.py')
          s = p.read_text()
          base = 'https://raw.githubusercontent.com/KingTud88/MLB-Prop-App/main/assets/strikeout_king_9000_sidebar.png'
          s = re.sub(re.escape(base) + r'(?:\?v=\d+)?', base + '?v=5', s, count=1)
          # Only mascot dimensions; all approved sidebar styling stays untouched.
          s = re.sub(r'(\.sk-nav-mascot \{[\s\S]*?height:)\d+px;', r'\g<1>238px;', s, count=1)
          s = re.sub(r'(\.sk-nav-mascot img \{[\s\S]*?width:)\d+px;', r'\g<1>236px;', s, count=1)
          s = re.sub(r'(\.sk-nav-mascot img \{[\s\S]*?height:)\d+px;', r'\g<1>236px;', s, count=1)
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          if git diff --quiet -- navigation.py assets/strikeout_king_9000_sidebar.png; then
            echo "No mascot changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add navigation.py assets/strikeout_king_9000_sidebar.png
          git commit -m "Isolate mascot artwork for sidebar"
          git push
