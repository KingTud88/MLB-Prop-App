name: Expand sidebar brand

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Force mascot render size inline
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('navigation.py')
          s = p.read_text()
          base = 'https://raw.githubusercontent.com/KingTud88/MLB-Prop-App/main/assets/strikeout_king_9000_sidebar.png'
          s = re.sub(re.escape(base) + r'(?:\?v=\d+)?', base + '?v=7', s, count=1)

          # Make the CSS itself non-overridable.
          s = re.sub(r'(\.sk-nav-mascot img \{[\s\S]*?width:)\d+px;', r'\g<1>236px !important;', s, count=1)
          s = re.sub(r'(\.sk-nav-mascot img \{[\s\S]*?height:)\d+px;', r'\g<1>236px !important;', s, count=1)

          old = 'f\'<div class="sk-nav-mascot"><img src="{MASCOT_URL}" alt="StrikeOut King 9000 mascot" onerror="this.style.display=\\\'none\\\';this.parentElement.classList.add(\\\'sk-logo-fallback\\\')"></div>\''
          # Patch the literal HTML directly instead of relying on stylesheet precedence.
          target = 'f\'<div class="sk-nav-mascot"><img src="{MASCOT_URL}" alt="StrikeOut King 9000 mascot" onerror="this.style.display=\\\'none\\\';this.parentElement.classList.add(\\\'sk-logo-fallback\\\')"></div>\''
          replacement = 'f\'<div class="sk-nav-mascot"><img src="{MASCOT_URL}" alt="StrikeOut King 9000 mascot" style="width:236px !important;height:236px !important;min-width:236px !important;max-width:236px !important;object-fit:contain !important;display:block !important;" onerror="this.style.display=\\\'none\\\';this.parentElement.classList.add(\\\'sk-logo-fallback\\\')"></div>\''
          if target not in s:
              raise SystemExit('Mascot HTML target not found')
          s = s.replace(target, replacement, 1)
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          if git diff --quiet -- navigation.py; then
            echo "No mascot render changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add navigation.py
          git commit -m "Force mascot render size inline"
          git push
