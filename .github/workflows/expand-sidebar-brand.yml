name: Starter Slate + Weather Fix

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Keep market-line integrity patch applied
        run: |
          python tools/fix_market_line_patch_anchor.py
          python tools/patch_market_line_integrity.py
          git restore tools/patch_market_line_integrity.py

      - name: Add starter slate lines and repair weather coordinates
        run: python tools/patch_starter_slate_weather.py

      - name: Validate Python syntax
        run: python -m py_compile automation/daily_projection_runner.py pages/5_Daily_Projection_Run.py engine/model_top_plays.py engine/bet_tracker.py pages/2_Bet_Tracker.py pages/6_Top_Plays.py

      - name: Commit safely
        run: |
          if git diff --quiet -- automation/daily_projection_runner.py pages/5_Daily_Projection_Run.py engine/model_top_plays.py engine/bet_tracker.py pages/2_Bet_Tracker.py pages/6_Top_Plays.py; then
            echo "No starter-slate/weather changes to commit"
            exit 0
          fi
          git config user.name "KingTud88"
          git config user.email "jaxson0603@gmail.com"
          git add automation/daily_projection_runner.py pages/5_Daily_Projection_Run.py engine/model_top_plays.py engine/bet_tracker.py pages/2_Bet_Tracker.py pages/6_Top_Plays.py
          git commit -m "Show active lines in starter slate and repair weather"
          for attempt in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main || { git rebase --abort || true; sleep 2; continue; }
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          echo "Could not push starter-slate/weather patch after retries"
          exit 1
