name: Expand sidebar brand

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Increase mascot visual zoom
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('navigation.py')
          s = p.read_text()

          # Only change the mascot visual zoom. Sidebar, wordmark, subtitle and nav stay untouched.
          s = s.replace('transform:scale(1.90) !important;', 'transform:scale(3.60) !important;')
          s = s.replace('transform:scale(1.90) !important;transform-origin:50% 50% !important;', 'transform:scale(3.60) !important;transform-origin:50% 50% !important;')
          s = re.sub(r'(strikeout_king_9000_sidebar\.png\?v=)\d+', r'\g<1>9', s, count=1)

          if 'transform:scale(3.60) !important;' not in s:
              raise SystemExit('Mascot scale patch did not land')

          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          if git diff --quiet -- navigation.py; then
            echo "No mascot scale changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add navigation.py
          git commit -m "Increase mascot visual zoom"
          git push
