name: Projection Weather Summary Layout

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  weather-layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install repo test dependencies
        run: pip install -r requirements.txt pytest

      - name: Validate patch script
        run: python -m py_compile .github/scripts/projection_weather_layout_v10.py

      - name: Apply weather summary layout
        run: python .github/scripts/projection_weather_layout_v10.py

      - name: Validate app syntax
        run: python -m py_compile streamlit_app.py engine/ui_command_center.py

      - name: Run weather and UI contract tests
        run: python -m pytest -q tests/test_weather_risk.py tests/test_projection_weather_batter_contract.py tests/test_matchup_weather_integrity.py tests/test_ui_command_center_contract.py tests/test_hits_allowed_ui_contract.py

      - name: Commit weather layout safely
        run: |
          if git diff --quiet -- streamlit_app.py engine/ui_command_center.py; then
            echo "Weather Summary layout already applied"
            exit 0
          fi
          git config user.name "KingTud88"
          git config user.email "jaxson0603@gmail.com"
          git add streamlit_app.py engine/ui_command_center.py
          git commit -m "Add Projection Summary weather warning card"
          for attempt in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main || { git rebase --abort || true; sleep 2; continue; }
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          echo "Could not push weather layout after retries"
          exit 1
