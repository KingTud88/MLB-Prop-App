name: Daily Projection Run status

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add Daily Run status strip
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('pages/5_Daily_Projection_Run.py')
          s = p.read_text()

          if '.daily-run-status{' not in s:
              anchor = '    @media (max-width:900px) { .daily-hero { padding:.78rem .85rem; } .daily-kicker { margin-top:1rem; } }'
              rules = [
                  '    .daily-run-status{display:flex;align-items:center;justify-content:space-between;gap:1rem;margin:.1rem 0 .75rem;padding:.72rem .85rem;border-radius:12px;background:rgba(7,28,49,.86);border:1px solid rgba(69,102,132,.68)}',
                  '    .daily-run-status.ok{border-color:rgba(50,229,141,.55)}',
                  '    .daily-run-status.error{border-color:rgba(255,71,98,.60)}',
                  '    .daily-run-status .main{color:#f5f8fb;font:900 .92rem/1.2 system-ui,-apple-system,"Segoe UI",Arial,sans-serif}',
                  '    .daily-run-status .meta{color:#aebfd0;font:700 .76rem/1.25 system-ui,-apple-system,"Segoe UI",Arial,sans-serif;text-align:right}',
              ]
              if anchor not in s:
                  raise SystemExit('Daily responsive CSS anchor not found')
              s = s.replace(anchor, '\n'.join(rules) + '\n' + anchor, 1)

          state_line = '    st.session_state["daily_errors"] = errors\n'
          if 'daily_run_at' not in s:
              if state_line not in s:
                  raise SystemExit('Daily session state target not found')
              s = s.replace(state_line, state_line + '    st.session_state["daily_run_at"] = datetime.now(EASTERN).strftime("%b %d, %Y · %I:%M:%S %p ET")\n', 1)

          load_line = '    errors = list(st.session_state.get("daily_errors", []))\n'
          if 'DAILY_RUN_STATUS_V1' not in s:
              if load_line not in s:
                  raise SystemExit('Daily output target not found')
              insert = (
                  '    errors = list(st.session_state.get("daily_errors", []))\n'
                  '    # DAILY_RUN_STATUS_V1\n'
                  '    run_at = str(st.session_state.get("daily_run_at", "Run timestamp unavailable"))\n'
                  '    status_class = "error" if errors else "ok"\n'
                  '    status_text = "Completed with capture errors" if errors else "Slate capture complete"\n'
                  '    st.markdown(\n'
                  '        f\'<div class="daily-run-status {status_class}"><div class="main">{status_text}</div><div class="meta">{slate_date:%b %d, %Y} · {run_at}</div></div>\',\n'
                  '        unsafe_allow_html=True,\n'
                  '    )\n'
              )
              s = s.replace(load_line, insert, 1)

          p.write_text(s)
          PY
      - name: Commit Daily Run status
        run: |
          if git diff --quiet -- pages/5_Daily_Projection_Run.py; then
            echo "No Daily Run status changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages/5_Daily_Projection_Run.py
          git commit -m "Add Daily Projection run status"
          git push