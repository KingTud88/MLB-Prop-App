name: Projection Persistence + History UI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add restart-safe projection persistence
        run: python tools/patch_projection_persistence.py

      - name: Fix manual line prefill missing values
        run: python tools/fix_manual_prefill_na.py

      - name: Add manual lines to Main Projection
        run: python tools/patch_main_projection_manual_lines.py

      - name: Replace Projection icons and emblems only
        run: python tools/patch_projection_emblems.py

      - name: Correct Projection icon placement and vector emblems
        run: python tools/fix_projection_emblems_v2.py

      - name: Polish Projection Summary emblems to match mockup
        run: python tools/polish_projection_summary_emblems.py

      - name: Split Projection artwork into individual badges
        run: python tools/fix_projection_artwork_individual.py

      - name: Validate Python syntax
        run: python -m py_compile training/projection_storage.py pages/4_Projection_History.py pages/5_Daily_Projection_Run.py pages/6_Top_Plays.py streamlit_app.py

      - name: Commit safely
        run: |
          if git diff --quiet -- pages/4_Projection_History.py pages/5_Daily_Projection_Run.py pages/6_Top_Plays.py streamlit_app.py assets/projection_k.webp assets/projection_k_plus.webp assets/projection_outs.webp assets/projection_outs_plus.webp assets/projection_hits.webp assets/projection_hits_plus.webp; then
            echo "Projection persistence / emblem patches already present"
            exit 0
          fi
          git config user.name "KingTud88"
          git config user.email "jaxson0603@gmail.com"
          git add pages/4_Projection_History.py pages/5_Daily_Projection_Run.py pages/6_Top_Plays.py streamlit_app.py assets/projection_k.webp assets/projection_k_plus.webp assets/projection_outs.webp assets/projection_outs_plus.webp assets/projection_hits.webp assets/projection_hits_plus.webp
          git commit -m "Render Projection artwork as individual badges"
          for attempt in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main || { git rebase --abort || true; sleep 2; continue; }
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          echo "Could not push projection persistence patch after retries"
          exit 1
