name: Projection Persistence + History UI

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add restart-safe projection persistence
        run: python tools/patch_projection_persistence.py

      - name: Fix manual line prefill missing values
        run: python tools/fix_manual_prefill_na.py

      - name: Add manual lines to Main Projection
        run: python tools/patch_main_projection_manual_lines.py

      - name: Validate Python syntax
        run: python -m py_compile training/projection_storage.py pages/4_Projection_History.py pages/5_Daily_Projection_Run.py pages/6_Top_Plays.py streamlit_app.py

      - name: Commit safely
        run: |
          if git diff --quiet -- pages/4_Projection_History.py pages/5_Daily_Projection_Run.py pages/6_Top_Plays.py streamlit_app.py; then
            echo "Projection persistence patches already present"
            exit 0
          fi
          git config user.name "KingTud88"
          git config user.email "jaxson0603@gmail.com"
          git add pages/4_Projection_History.py pages/5_Daily_Projection_Run.py pages/6_Top_Plays.py streamlit_app.py
          git commit -m "Maintain projection persistence"
          git push origin HEAD:main
