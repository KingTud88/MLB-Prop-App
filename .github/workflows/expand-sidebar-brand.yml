name: Expand sidebar brand

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Expand mascot and brand header
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('navigation.py')
          text = path.read_text()

          old_css = '''        .sk-nav-brand {
            margin: .1rem .15rem .75rem;
            padding: .72rem .5rem .75rem;
            border: 1px solid rgba(70,103,139,.44);
            border-radius: 16px;
            background: linear-gradient(145deg, rgba(14,35,64,.78), rgba(7,20,38,.72));
            box-shadow: 0 13px 32px rgba(0,0,0,.2), inset 0 1px 0 rgba(255,255,255,.025);
        }
        .sk-nav-brand:empty {
            display:none !important;
            margin:0 !important;
            padding:0 !important;
            border:0 !important;
            background:none !important;
            box-shadow:none !important;
        }
        .sk-nav-mascot {
            display:flex;
            justify-content:center;
            align-items:center;
            height:126px;
            margin:-.08rem 0 .2rem;
            position: relative;
        }
        .sk-nav-mascot img {
            width:122px;
            height:122px;
            object-fit:contain;
            display:block;
            filter: drop-shadow(0 9px 18px rgba(0,0,0,.3));
        }'''

          new_css = '''        .sk-nav-brand {
            width: calc(100% - .16rem);
            margin: .04rem .08rem .72rem;
            padding: .48rem .22rem .78rem;
            box-sizing: border-box;
            border: 1px solid rgba(70,103,139,.48);
            border-radius: 18px;
            background:
                radial-gradient(circle at 50% 18%, rgba(227,25,55,.18), transparent 8.5rem),
                linear-gradient(145deg, rgba(14,35,64,.88), rgba(7,20,38,.8));
            box-shadow: 0 13px 32px rgba(0,0,0,.22), inset 0 1px 0 rgba(255,255,255,.035);
            overflow:hidden;
        }
        .sk-nav-mascot {
            display:flex;
            justify-content:center;
            align-items:center;
            height:174px;
            margin:-.18rem 0 -.08rem;
            position: relative;
        }
        .sk-nav-mascot img {
            width:172px;
            height:172px;
            object-fit:contain;
            display:block;
            filter: drop-shadow(0 11px 22px rgba(0,0,0,.38));
        }'''

          old_title = '''        .sk-nav-title {
            text-align:center;
            font-family:Impact,"Arial Narrow",sans-serif;
            font-size:1.19rem;
            line-height:1;
            color:#fff;
            letter-spacing:.015em;
        }
        .sk-nav-title span { color:#ff3655; }
        .sk-nav-sub {
            text-align:center;
            color:#9eb1c6;
            font-size:.66rem;
            font-weight:650;
            line-height:1.38;
            letter-spacing:.02em;
            margin:.48rem 0 .05rem;
        }'''

          new_title = '''        .sk-nav-title {
            text-align:center;
            font-family:Impact,"Arial Narrow",sans-serif;
            font-size:1.52rem;
            line-height:.92;
            color:#fff;
            letter-spacing:.025em;
            text-transform:uppercase;
            text-shadow:2px 3px 0 rgba(0,0,0,.34);
        }
        .sk-nav-title span {
            color:#ff3655;
            font-size:1.68rem;
            letter-spacing:.035em;
        }
        .sk-nav-sub {
            text-align:center;
            color:#a9bbcc;
            font-size:.61rem;
            font-weight:800;
            line-height:1.3;
            letter-spacing:.045em;
            margin:.52rem .2rem 0;
        }'''

          old_markup = '''    with st.sidebar:
        st.markdown('<div class="sk-nav-brand">', unsafe_allow_html=True)
        st.markdown(
            f'<div class="sk-nav-mascot"><img src="{MASCOT_URL}" alt="StrikeOut King 9000 mascot" onerror="this.style.display=\\'none\\';this.parentElement.classList.add(\\'sk-logo-fallback\\')"></div>',
            unsafe_allow_html=True,
        )
        st.markdown('<div class="sk-nav-title">StrikeOut <span>King 9000</span></div>', unsafe_allow_html=True)
        st.markdown('<div class="sk-nav-sub">CLEVELAND NIGHT MODE · MLB STARTER INTELLIGENCE</div>', unsafe_allow_html=True)
        st.markdown('</div>', unsafe_allow_html=True)
        st.markdown('<div class="sk-nav-section">Command Center</div>', unsafe_allow_html=True)'''

          new_markup = '''    with st.sidebar:
        st.markdown(
            f'''<div class="sk-nav-brand">
                <div class="sk-nav-mascot"><img src="{MASCOT_URL}" alt="StrikeOut King 9000 mascot" onerror="this.style.display='none';this.parentElement.classList.add('sk-logo-fallback')"></div>
                <div class="sk-nav-title">StrikeOut<br><span>King 9000</span></div>
                <div class="sk-nav-sub">CLEVELAND NIGHT MODE · MLB STARTER INTELLIGENCE</div>
            </div>''',
            unsafe_allow_html=True,
        )
        st.markdown('<div class="sk-nav-section">Command Center</div>', unsafe_allow_html=True)'''

          changed = False
          for old, new, label in [
              (old_css, new_css, 'brand css'),
              (old_title, new_title, 'title css'),
              (old_markup, new_markup, 'brand markup'),
          ]:
              if old in text:
                  text = text.replace(old, new, 1)
                  changed = True
              elif new in text:
                  print(label, 'already applied')
              else:
                  raise SystemExit(f'Expected {label} block not found')

          if changed:
              path.write_text(text)
              print('Expanded sidebar brand applied')
          else:
              print('No changes needed')
          PY
      - name: Commit patch
        run: |
          if git diff --quiet -- navigation.py; then
            echo "No navigation changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add navigation.py
          git commit -m "Expand sidebar mascot and brand"
          git push
