name: Starter Slate Manual Line Highlight

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Highlight manual sportsbook lines
        run: python tools/highlight_manual_lines.py

      - name: Validate Python syntax
        run: python -m py_compile pages/5_Daily_Projection_Run.py

      - name: Commit safely
        run: |
          if git diff --quiet -- pages/5_Daily_Projection_Run.py; then
            echo "Manual-line highlight already present"
            exit 0
          fi
          git config user.name "KingTud88"
          git config user.email "jaxson0603@gmail.com"
          git add pages/5_Daily_Projection_Run.py
          git commit -m "Highlight manual sportsbook lines in starter slate"
          for attempt in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main || { git rebase --abort || true; sleep 2; continue; }
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          echo "Could not push manual-line highlight after retries"
          exit 1
