name: Research Context Readiness

on:
  workflow_run:
    workflows: ["Daily Projection Capture and Resolver"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: research-context-readiness
  cancel-in-progress: false

jobs:
  refresh:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main' &&
        !startsWith(github.event.workflow_run.head_commit.message, 'Automate projection capture and game resolution')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Sync to current main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Validate report-only context contracts
        run: >-
          PYTHONPATH=. pytest -q
          tests/test_handedness_matchup_lineage_guard.py
          tests/test_handedness_matchup_audit.py
          tests/test_pitch_arsenal_capture.py
          tests/test_batter_pitch_whiff_capture.py
          tests/test_pitch_mix_readiness_audit.py

      - name: Build effective handedness context
        run: PYTHONPATH=. python -m training.handedness_matchup_lineage_guard

      - name: Refresh handedness matchup audit from effective context
        run: >-
          PYTHONPATH=. python -m training.handedness_matchup_audit
          --context-log data/handedness_matchup_effective_context.csv

      - name: Capture frozen pregame pitcher arsenal context
        run: PYTHONPATH=. python -m training.pitch_arsenal_capture

      - name: Capture frozen batter Whiff% by pitch type
        run: PYTHONPATH=. python -m training.batter_pitch_whiff_capture

      - name: Refresh pitch-mix capture readiness audit
        run: PYTHONPATH=. python -m training.pitch_mix_readiness_audit

      - name: Commit report-only readiness evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/handedness_matchup_effective_context.csv \
            data/handedness_matchup_lineage_gate.csv \
            data/handedness_matchup_audit_detail.csv \
            data/handedness_matchup_audit_segments.csv \
            data/handedness_matchup_audit_gate.csv \
            data/pitch_arsenal_context_log.csv \
            data/batter_pitch_whiff_context_log.csv \
            data/pitch_mix_readiness_fields.csv \
            data/pitch_mix_readiness_summary.csv
          if git diff --cached --quiet; then
            echo "No research context readiness changes to commit."
            exit 0
          fi
          git commit -m "Automate projection capture and game resolution: refresh research context readiness"

          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main; then
              if git push origin HEAD:main; then
                exit 0
              fi
            else
              git rebase --abort || true
              echo "Rebase conflict while refreshing research context readiness; refusing to overwrite main."
              exit 1
            fi
            echo "Push race on attempt ${attempt}; retrying against latest main."
            sleep $((attempt * 2))
          done

          echo "Research context readiness push failed after 3 attempts."
          exit 1
