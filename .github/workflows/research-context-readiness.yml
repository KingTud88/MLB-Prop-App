name: Research Context Readiness

on:
  schedule:
    # Fallback self-heal windows run one hour after each resolver cron. The
    # resolver has a 20-minute timeout, so these avoid normal overlap while
    # guaranteeing research evidence can refresh if the direct resolver job is missed.
    - cron: "15 14 * * *"
    - cron: "15 17 * * *"
    - cron: "15 19 * * *"
    - cron: "15 21 * * *"
    - cron: "15 23 * * *"
    - cron: "15 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: research-context-readiness
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Sync to current main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Refresh and persist report-only research context
        run: bash automation/research_context_readiness.sh
