name: Research Context Readiness

on:
  schedule:
    # Fallback self-heal windows run one hour after each resolver cron. The
    # resolver has a 20-minute timeout, so these avoid normal overlap while
    # guaranteeing research evidence can refresh if the direct resolver job is missed.
    - cron: "15 14 * * *"
    - cron: "15 17 * * *"
    - cron: "15 19 * * *"
    - cron: "15 21 * * *"
    - cron: "15 23 * * *"
    - cron: "15 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: research-context-readiness
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Sync to current main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Check whether primary resolver already refreshed research context
        id: primary-refresh
        run: |
          if git log origin/main --since="90 minutes ago" --format="%s" --grep="^Automate projection capture and game resolution: refresh research context readiness$" -1 | grep -q .; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Recent primary resolver research refresh found; skipping redundant fallback push."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.primary-refresh.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: steps.primary-refresh.outputs.skip != 'true'
        run: pip install -r requirements.txt pytest

      - name: Refresh and persist report-only research context
        if: steps.primary-refresh.outputs.skip != 'true'
        run: bash automation/research_context_readiness.sh
