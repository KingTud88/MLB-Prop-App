name: quality

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
      - run: python -m compileall -q runtime_http.py streamlit_app.py navigation.py engine automation tests
      - run: pytest -q tests/test_runtime_http.py tests/test_source_health_operator.py
      - run: pytest -q
