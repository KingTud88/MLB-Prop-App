name: quality

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
      - name: Apply surgical warning fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str, count: int = 1) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              found = text.count(old)
              if found != count:
                  raise SystemExit(f"{path}: expected {count} occurrences, found {found}: {old!r}")
              file.write_text(text.replace(old, new), encoding="utf-8")

          capture_old = '''    if additions:\n        existing = pd.concat([existing, pd.DataFrame(additions)], ignore_index=True)'''
          capture_new = '''    if additions:\n        added = pd.DataFrame(additions)\n        existing = added if existing.empty else pd.concat([existing, added], ignore_index=True)'''
          for path in (
              "training/batter_pitch_whiff_capture.py",
              "training/handedness_matchup_capture.py",
              "training/pitch_arsenal_capture.py",
          ):
              replace(path, capture_old, capture_new)

          replace(
              "engine/team_leash.py",
              '    combined = pd.concat([projected, observed], ignore_index=True)',
              '''    if projected.empty:\n        combined = observed.copy()\n    elif observed.empty:\n        combined = projected.copy()\n    else:\n        combined = pd.concat([projected, observed], ignore_index=True)''',
          )

          replacements = {
              "tests/test_calibration_common_mode_v2.py": [
                  ('pd.Timedelta(days=i)', 'pd.Timedelta(i, unit="D")'),
              ],
              "tests/test_lineup_k_walkforward.py": [
                  ('pd.Timedelta(days=day)', 'pd.Timedelta(day, unit="D")'),
                  ('pd.Timedelta(hours=capture_offset_hours)', 'pd.Timedelta(capture_offset_hours, unit="h")'),
                  ('pd.Timedelta(hours=resolved_offset_hours)', 'pd.Timedelta(resolved_offset_hours, unit="h")'),
              ],
              "tests/test_ml_shadow_report.py": [
                  ('pd.Timedelta(days=i)', 'pd.Timedelta(i, unit="D")'),
              ],
              "tests/test_opponent_matchup_boost_stress.py": [
                  ('pd.Timedelta(days=day)', 'pd.Timedelta(day, unit="D")'),
                  ('pd.Timedelta(hours=5)', 'pd.Timedelta(5, unit="h")'),
                  ('pd.Timedelta(hours=4)', 'pd.Timedelta(4, unit="h")'),
              ],
              "tests/test_opponent_matchup_validation.py": [
                  ('pd.Timedelta(days=day)', 'pd.Timedelta(day, unit="D")'),
                  ('pd.Timedelta(hours=capture_offset_hours)', 'pd.Timedelta(capture_offset_hours, unit="h")'),
                  ('pd.Timedelta(hours=resolved_offset_hours)', 'pd.Timedelta(resolved_offset_hours, unit="h")'),
              ],
              "tests/test_team_leash.py": [
                  ('pd.Timedelta(days=i)', 'pd.Timedelta(i, unit="D")'),
                  ('pd.Timedelta(days=MIN_TEAM_STARTS)', 'pd.Timedelta(MIN_TEAM_STARTS, unit="D")'),
              ],
              "tests/test_team_leash_historical_validation.py": [
                  ('pd.Timedelta(days=i)', 'pd.Timedelta(i, unit="D")'),
              ],
              "tests/test_umpire_k_live_validation.py": [
                  ('pd.Timedelta(days=day)', 'pd.Timedelta(day, unit="D")'),
                  ('pd.Timedelta(hours=capture_offset_hours)', 'pd.Timedelta(capture_offset_hours, unit="h")'),
                  ('pd.Timedelta(hours=resolved_offset_hours)', 'pd.Timedelta(resolved_offset_hours, unit="h")'),
              ],
              "tests/test_starter_role.py": [
                  ('pd.Timedelta(days=5)', 'pd.Timedelta(5, unit="D")'),
              ],
              "tests/test_workload_context.py": [
                  ('pd.Timedelta(days=4)', 'pd.Timedelta(4, unit="D")'),
                  ('pd.Timedelta(days=6)', 'pd.Timedelta(6, unit="D")'),
              ],
          }
          for path, pairs in replacements.items():
              for old, new in pairs:
                  replace(path, old, new)

          replace(
              "tests/test_starter_observations.py",
              '''    frame.loc[0, "actual_pitches"] = 91\n    frame.loc[0, "resolved_at_utc"] = "2026-08-13T03:00:00+00:00"''',
              '''    frame.loc[0, "actual_pitches"] = 91\n    frame["resolved_at_utc"] = frame["resolved_at_utc"].astype(object)\n    frame.loc[0, "resolved_at_utc"] = "2026-08-13T03:00:00+00:00"''',
          )
          PY
      - name: Compile affected Python
        run: python -m compileall -q engine training tests
      - name: Affected tests with deprecations as errors
        run: >-
          pytest -q
          -W error::DeprecationWarning
          -W error::FutureWarning
          tests/test_batter_pitch_whiff_capture.py
          tests/test_handedness_matchup_capture.py
          tests/test_pitch_arsenal_capture.py
          tests/test_team_leash.py
          tests/test_team_leash_historical_validation.py
          tests/test_calibration_common_mode_v2.py
          tests/test_lineup_k_walkforward.py
          tests/test_ml_shadow_report.py
          tests/test_opponent_matchup_boost_stress.py
          tests/test_opponent_matchup_validation.py
          tests/test_umpire_k_live_validation.py
          tests/test_starter_role.py
          tests/test_workload_context.py
          tests/test_starter_observations.py
      - name: Full suite after cleanup
        run: pytest -q
      - name: Persist fixes and restore standard quality workflow
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/cleanup/python-warning-causes'
        run: |
          cat > .github/workflows/quality.yml <<'YAML'
          name: quality

          on:
            push:
            pull_request:

          jobs:
            test:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-python@v5
                  with:
                    python-version: "3.12"
                - run: pip install -r requirements.txt pytest
                - run: python -m compileall -q streamlit_app.py navigation.py engine automation tests
                - run: pytest -q
          YAML
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            .github/workflows/quality.yml \
            engine/team_leash.py \
            training/batter_pitch_whiff_capture.py \
            training/handedness_matchup_capture.py \
            training/pitch_arsenal_capture.py \
            tests/test_batter_pitch_whiff_capture.py \
            tests/test_handedness_matchup_capture.py \
            tests/test_pitch_arsenal_capture.py \
            tests/test_team_leash.py \
            tests/test_team_leash_historical_validation.py \
            tests/test_calibration_common_mode_v2.py \
            tests/test_lineup_k_walkforward.py \
            tests/test_ml_shadow_report.py \
            tests/test_opponent_matchup_boost_stress.py \
            tests/test_opponent_matchup_validation.py \
            tests/test_umpire_k_live_validation.py \
            tests/test_starter_role.py \
            tests/test_workload_context.py \
            tests/test_starter_observations.py
          git diff --cached --check
          git commit -m "Eliminate Python deprecation warning causes"
          git push origin HEAD:cleanup/python-warning-causes
