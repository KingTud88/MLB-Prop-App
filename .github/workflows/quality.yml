name: quality

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: research/governance-v2-freshness-stage
          fetch-depth: 0
      - name: Apply governance freshness patch once
        run: |
          if grep -q 'research-pipeline-freshness-v4-governance-v2-report-only' training/research_pipeline_freshness_audit.py; then
            echo 'governance freshness patch already applied'
          else
            python automation/_patch_governance_freshness.py
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add training/research_pipeline_freshness_audit.py tests/test_research_pipeline_freshness_audit.py
            git commit -m 'Add Governance v2 to research freshness audit'
            git push origin HEAD:research/governance-v2-freshness-stage
          fi
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
      - run: python -m compileall -q streamlit_app.py navigation.py engine automation tests
      - run: pytest -q --durations=20