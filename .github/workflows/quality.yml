name: quality

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
      - run: python -m compileall -q streamlit_app.py navigation.py engine automation tests
      - run: pytest -q tests/test_projection_history_underperformer_ui.py tests/test_projection_crushers.py tests/test_projection_history_learning_dashboard.py
      - run: pytest -q --durations=20
