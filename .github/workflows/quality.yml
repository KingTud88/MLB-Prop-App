name: quality

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
      - run: python -m compileall -q streamlit_app.py navigation.py engine automation tests
      - run: pytest -q
      - name: Trace pitch-mix forward lineage exclusions
        run: PYTHONPATH=. python training/_temp_pitch_mix_forward_lineage_proof.py
