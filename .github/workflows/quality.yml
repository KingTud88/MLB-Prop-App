name: quality

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
      - name: Build effective handedness context
        run: PYTHONPATH=. python -m training.handedness_matchup_lineage_guard
      - name: Refresh handedness matchup audit
        run: PYTHONPATH=. python -m training.handedness_matchup_audit --context-log data/handedness_matchup_effective_context.csv
      - name: Capture pitcher arsenal
        run: PYTHONPATH=. python -m training.pitch_arsenal_capture
      - name: Capture batter pitch-type whiff
        run: PYTHONPATH=. python -m training.batter_pitch_whiff_capture
      - name: Refresh pitch-mix readiness
        run: PYTHONPATH=. python -m training.pitch_mix_readiness_audit
      - name: Capture pitch-mix whiff score
        run: PYTHONPATH=. python -m training.pitch_mix_whiff_score_capture
      - name: Refresh pitch-mix forward evaluation
        run: PYTHONPATH=. python -m training.pitch_mix_whiff_forward_evaluation
      - name: Refresh catcher prior maturity
        run: PYTHONPATH=. python -m training.catcher_prior_maturity
      - name: Refresh research command center
        run: PYTHONPATH=. python -m training.research_evidence_command_center
      - name: Append research history
        run: PYTHONPATH=. python -m training.research_evidence_history --observed-at-utc "2026-08-18T17:45:00+00:00"
      - name: Build transition digest
        run: PYTHONPATH=. python -m training.research_evidence_transition_digest --refresh-at-utc "2026-08-18T17:45:00+00:00"
      - name: Build manual review packet
        run: PYTHONPATH=. python -m training.research_manual_review_packet --refresh-at-utc "2026-08-18T17:45:00+00:00"
      - name: Append manual review queue
        run: PYTHONPATH=. python -m training.research_manual_review_queue --queued-at-utc "2026-08-18T17:45:00+00:00"
      - name: Audit research dependency freshness
        run: PYTHONPATH=. python -m training.research_pipeline_freshness_audit
