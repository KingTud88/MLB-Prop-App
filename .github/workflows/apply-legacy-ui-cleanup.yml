name: Apply legacy UI cleanup

on:
  push:
    branches: [main]
    paths:
      - "scripts/cleanup_legacy_ui.py"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply cleanup
        run: python scripts/cleanup_legacy_ui.py

      - name: Commit cleanup and remove one-time tooling
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add streamlit_app.py scripts/cleanup_legacy_ui.py .github/workflows/apply-legacy-ui-cleanup.yml
          git rm scripts/cleanup_legacy_ui.py .github/workflows/apply-legacy-ui-cleanup.yml
          git diff --cached --quiet && exit 0
          git commit -m "Clean up legacy StrikeOut King UI"
          git push origin main
