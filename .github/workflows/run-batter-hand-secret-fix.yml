name: Run batter hand and secret fix

on:
  push:
    paths:
      - scripts/patch_batter_hand_and_odds_secret.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pytest
      - run: python scripts/patch_batter_hand_and_odds_secret.py
      - name: Verify live MLB person schema
        run: |
          python - <<'PY'
          import requests
          data=requests.get('https://statsapi.mlb.com/api/v1/people/669358', timeout=20).json()
          person=(data.get('people') or [{}])[0]
          assert person.get('pitchHand',{}).get('code') == 'R', person
          print('Shane Baz pitchHand:', person.get('pitchHand'))
          PY
      - name: Verify live MIN batter split retrieval
        run: |
          python - <<'PY'
          from engine.opposing_batters import get_opposing_batters
          df=get_opposing_batters('MIN','R',2026)
          print(df[['Batter','Hand','K% vs Pitcher','PA']].head(10).to_string(index=False))
          assert not df.empty
          assert df['PA'].sum() > 0
          PY
      - run: python -m compileall -q streamlit_app.py engine automation tests
      - run: pytest -q
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add streamlit_app.py automation/daily_projection_runner.py engine/opposing_batters.py tests/test_batter_hand_and_odds_secret.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Fix pitcher hand lookup and sanitize Odds API errors"
          git pull --rebase origin main
          git push origin HEAD:main
