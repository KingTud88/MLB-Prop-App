name: Starter Role Promotion Gate

on:
  workflow_dispatch:
  push:
    paths:
      - training/starter_role_promotion_gate.py
      - tests/test_starter_role_promotion_gate.py
      - data/starter_role_candidate_summary.csv
      - .github/workflows/starter-role-promotion-gate.yml

permissions:
  contents: write

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pytest
      - name: Promotion gate contracts
        run: pytest -q tests/test_starter_role_promotion_gate.py tests/test_starter_role_candidate.py tests/test_starter_role.py
      - name: Evaluate predeclared promotion guardrails
        run: python -m training.starter_role_promotion_gate
      - name: Commit promotion gate report
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/starter_role_promotion_gate.csv
          if git diff --cached --quiet; then
            echo "No promotion gate report changes"
            exit 0
          fi
          git commit -m "Refresh starter role promotion gate"
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
