name: Apply Main Projection v2 UI

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/apply-main-projection-v2-ui.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui-main-projection-v2
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Wire reusable hero and matchup components
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('streamlit_app.py')
          source = path.read_text(encoding='utf-8')

          old_import = 'from engine.ui_command_center import apply_command_center_theme'
          new_import = '''from engine.ui_command_center import (\n    apply_command_center_theme,\n    render_command_center_hero,\n    render_matchup_strip,\n)'''
          if old_import not in source:
              raise SystemExit('command-center import anchor missing')
          source = source.replace(old_import, new_import, 1)

          old = '''st.markdown('<div class="king-title">STRIKEOUT<br><span class="king-red">KING 9000</span></div><div class="subline">★ MLB PITCHER PROJECTION ENGINE ★ TWO-PATH ANALYTICS ★</div>',unsafe_allow_html=True)\nweather_marker=f" {weather_risk.icon}" if weather_risk.icon else ""\nst.markdown(f'<div class="pitcher-card"><h2>{game.pitcher_name.upper()}{weather_marker}</h2><b>{game.team} vs {game.opponent}</b><br><span class="search-note">{game.venue} · {game.side} · {game.status}</span></div>',unsafe_allow_html=True)'''
          new = '''weather_marker=f" {weather_risk.icon}" if weather_risk.icon else ""\nrender_command_center_hero(\n    confidence=proj.confidence,\n    quality=proj.quality,\n    locked=locked,\n    app_version=APP_VERSION,\n)\nrender_matchup_strip(\n    pitcher_name=game.pitcher_name,\n    team=game.team,\n    opponent=game.opponent,\n    venue=game.venue,\n    side=game.side,\n    status=game.status,\n    game_time=game.game_time,\n    locked=locked,\n    weather_icon=weather_risk.icon or "",\n)'''
          if old not in source:
              raise SystemExit('legacy hero/matchup anchor missing')
          source = source.replace(old, new, 1)
          path.write_text(source, encoding='utf-8')
          PY
      - name: Verify compile and UI anchors
        run: |
          python -m py_compile streamlit_app.py engine/ui_command_center.py
          grep -q 'render_command_center_hero' streamlit_app.py
          grep -q 'render_matchup_strip' streamlit_app.py
          grep -q 'cc-hero' engine/ui_command_center.py
          grep -q 'cc-matchup-strip' engine/ui_command_center.py
      - name: Commit generated wiring and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-main-projection-v2-ui.yml
          git add streamlit_app.py engine/ui_command_center.py
          git commit -m "Wire Main Projection v2 command center"
          git push origin HEAD:ui-main-projection-v2
