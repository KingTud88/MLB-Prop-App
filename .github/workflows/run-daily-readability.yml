name: Run Daily table readability

on:
  push:
    paths:
      - scripts/patch_daily_readability.py
      - .github/workflows/run-daily-readability.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pytest
      - name: Apply readability patch
        run: python scripts/patch_daily_readability.py
      - name: Compile
        run: python -m compileall -q streamlit_app.py navigation.py pages engine automation tests
      - name: Test
        run: pytest -q
      - name: Commit readability pass
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages/5_Daily_Projection_Run.py tests/test_daily_readability.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Make Daily projection table easier to read"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort || true
            sleep $((attempt * 2))
          done
          exit 1
