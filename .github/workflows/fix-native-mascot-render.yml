name: Fix Native Mascot Render

on:
  workflow_dispatch:
  push:
    branches:
      - ui-native-mascot-render
    paths:
      - .github/workflows/fix-native-mascot-render.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui-native-mascot-render
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pytest
      - name: Switch hero mascot to native Streamlit image rendering
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('engine/ui_command_center.py')
          s = p.read_text(encoding='utf-8')
          s = s.replace('from datetime import datetime\nimport base64\nfrom pathlib import Path\n', 'from datetime import datetime\nfrom pathlib import Path\n')
          s = s.replace('COMMAND_CENTER_UI_VERSION = "cle-command-center-v3"', 'COMMAND_CENTER_UI_VERSION = "cle-command-center-v4"')

          old_helper = '''def _mascot_src() -> str:\n    """Embed the checked-in mascot so the hero never depends on remote image loading."""\n    try:\n        payload = base64.b64encode(MASCOT_PATH.read_bytes()).decode("ascii")\n        return f"data:image/png;base64,{payload}"\n    except Exception:\n        return ""\n\n\n'''
          if old_helper not in s:
              raise SystemExit('mascot helper anchor not found')
          s = s.replace(old_helper, '')

          s = s.replace('''        .cc-hero {\n            position:relative;\n            display:grid;\n            grid-template-columns:minmax(150px,220px) minmax(360px,1fr) minmax(190px,250px);\n            gap:1.25rem;\n            align-items:center;\n            min-height:245px;\n            padding:1.25rem 1.4rem;\n            margin:.15rem 0 1.1rem;\n            overflow:hidden;\n            border:1px solid rgba(82,108,134,.74);\n            border-radius:18px;\n            background:\n                linear-gradient(90deg,rgba(4,19,36,.96),rgba(6,29,53,.94) 52%,rgba(4,17,32,.97)),\n                radial-gradient(circle at 30% 0%,rgba(236,22,56,.13),transparent 22rem);\n            box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 20px 52px rgba(0,0,0,.34);\n        }\n        .cc-hero::before {''', '''        .st-key-cc_hero_shell {\n            position:relative;\n            min-height:245px;\n            padding:1.25rem 1.4rem!important;\n            margin:.15rem 0 1.1rem;\n            overflow:hidden;\n            border:1px solid rgba(82,108,134,.74)!important;\n            border-radius:18px!important;\n            background:\n                linear-gradient(90deg,rgba(4,19,36,.96),rgba(6,29,53,.94) 52%,rgba(4,17,32,.97)),\n                radial-gradient(circle at 30% 0%,rgba(236,22,56,.13),transparent 22rem)!important;\n            box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 20px 52px rgba(0,0,0,.34);\n        }\n        .st-key-cc_hero_shell::before {''')
          s = s.replace('.cc-hero::after {', '.st-key-cc_hero_shell::after {')
          old_mascot_css = '''        .cc-hero-mascot { position:relative;z-index:1;display:flex;align-items:center;justify-content:center; }\n        .cc-hero-mascot img {\n            display:block;\n            width:min(205px,100%);\n            max-height:218px;\n            object-fit:contain;\n            filter:drop-shadow(0 14px 18px rgba(0,0,0,.42)) drop-shadow(0 0 18px rgba(236,22,56,.12));\n        }\n'''
          new_mascot_css = '''        .st-key-cc_hero_shell [data-testid="stImage"] { display:flex;align-items:center;justify-content:center; }\n        .st-key-cc_hero_shell [data-testid="stImage"] img {\n            display:block;\n            max-height:218px;\n            object-fit:contain;\n            filter:drop-shadow(0 14px 18px rgba(0,0,0,.42)) drop-shadow(0 0 18px rgba(236,22,56,.12));\n        }\n'''
          if old_mascot_css not in s:
              raise SystemExit('mascot css anchor not found')
          s = s.replace(old_mascot_css, new_mascot_css)
          s = s.replace('''            .cc-hero { grid-template-columns:150px minmax(320px,1fr); }\n            .cc-hero-status { grid-column:1 / -1;grid-template-columns:repeat(3,1fr); }''', '''            .st-key-cc_hero_shell [data-testid="stHorizontalBlock"] { flex-wrap:wrap; }\n            .cc-hero-status { grid-template-columns:repeat(3,1fr); }''')
          s = s.replace('''            .cc-hero { grid-template-columns:110px 1fr;min-height:0;padding:1rem; }\n            .cc-hero-mascot img { max-height:135px; }''', '''            .st-key-cc_hero_shell { min-height:0;padding:1rem!important; }\n            .st-key-cc_hero_shell [data-testid="stImage"] img { max-height:135px; }''')
          s = s.replace('''            .cc-hero { grid-template-columns:1fr;text-align:center; }\n            .cc-hero-mascot img { width:150px; }''', '''            .st-key-cc_hero_shell { text-align:center; }\n            .st-key-cc_hero_shell [data-testid="stImage"] img { width:150px; }''')

          start = s.index('def render_command_center_hero(')
          end = s.index('\n\ndef render_matchup_strip(', start)
          new_fn = '''def render_command_center_hero(*, confidence: str, quality: int, locked: bool, app_version: str) -> None:\n    """Render the branded top-of-page hero/status board for Main Projection."""\n    safe_confidence = _safe(confidence or "Unknown")\n    safe_version = _safe(app_version)\n    quality_value = max(0, min(100, int(quality or 0)))\n    lock_text = "Projection locked" if locked else "Ready to lock"\n    lock_meta = "Frozen pitcher snapshot" if locked else "Use the left rail to freeze outputs"\n\n    with st.container(border=False, key="cc_hero_shell"):\n        mascot_col, copy_col, status_col = st.columns([1.15, 3.25, 1.45], gap="medium", vertical_alignment="center")\n        with mascot_col:\n            if MASCOT_PATH.exists():\n                st.image(str(MASCOT_PATH), width=205)\n            else:\n                st.markdown('<div class="cc-team-mark" aria-label="StrikeOut King 9000">SK9K</div>', unsafe_allow_html=True)\n        with copy_col:\n            st.markdown(\n                """\n                <div class="cc-hero-copy">\n                  <div class="cc-hero-kicker">Built for CLE baseball · two-path starter intelligence</div>\n                  <div class="cc-hero-title">StrikeOut <span>King 9000</span></div>\n                  <div class="cc-hero-sub">★ MLB Pitcher Projection Engine ★ Two-Path Analytics ★</div>\n                </div>\n                """,\n                unsafe_allow_html=True,\n            )\n        with status_col:\n            st.markdown(\n                f"""\n                <div class="cc-hero-status">\n                  <div class="cc-status-card">\n                    <div class="cc-status-label">Data Status</div>\n                    <div class="cc-status-value live">● Live</div>\n                    <div class="cc-status-meta">{safe_confidence} confidence · model quality {quality_value}/100</div>\n                    <div class="cc-quality-track"><div class="cc-quality-fill" style="width:{quality_value}%"></div></div>\n                  </div>\n                  <div class="cc-status-card">\n                    <div class="cc-status-label">Pitcher State</div>\n                    <div class="cc-status-value">{_safe(lock_text)}</div>\n                    <div class="cc-status-meta">{_safe(lock_meta)}</div>\n                  </div>\n                  <div class="cc-status-card">\n                    <div class="cc-status-label">Engine</div>\n                    <div class="cc-status-value">v{safe_version}</div>\n                    <div class="cc-status-meta">Model first · market second</div>\n                  </div>\n                </div>\n                """,\n                unsafe_allow_html=True,\n            )\n'''
          s = s[:start] + new_fn + s[end:]
          p.write_text(s, encoding='utf-8')

          test = Path('tests/test_ui_command_center_contract.py')
          t = test.read_text(encoding='utf-8')
          t = t.replace('test_command_center_v3_exposes_reusable_hero_and_matchup_components', 'test_command_center_v4_exposes_reusable_hero_and_matchup_components')
          t = t.replace('COMMAND_CENTER_UI_VERSION = "cle-command-center-v3"', 'COMMAND_CENTER_UI_VERSION = "cle-command-center-v4"')
          t = t.replace('assert "cc-hero-mascot" in source\n', 'assert "st.image(str(MASCOT_PATH), width=205)" in source\n    assert "key=\\"cc_hero_shell\\"" in source\n')
          t = t.replace('assert "data:image/png;base64" in source\n', 'assert "data:image/png;base64" not in source\n    assert "MASCOT_PATH.exists()" in source\n')
          t = t.replace('test_main_projection_uses_v3_components_without_removing_model_flow', 'test_main_projection_uses_v4_components_without_removing_model_flow')
          test.write_text(t, encoding='utf-8')
          PY
      - name: Verify native mascot fix
        run: |
          python -m compileall -q streamlit_app.py navigation.py engine automation tests
          pytest -q
      - name: Commit fix and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add engine/ui_command_center.py tests/test_ui_command_center_contract.py
          git rm .github/workflows/fix-native-mascot-render.yml
          git commit -m "Render command center mascot with native Streamlit image"
          git push origin HEAD:ui-native-mascot-render
