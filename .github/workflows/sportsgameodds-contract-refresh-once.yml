name: One-shot SportsGameOdds contract refresh

on:
  push:
    branches:
      - agent/sportsgameodds-ui-cleanup
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout cleanup branch
        uses: actions/checkout@v6
        with:
          ref: agent/sportsgameodds-ui-cleanup
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Apply contract refresh
        run: python automation/sportsgameodds_contract_refresh_once.py

      - name: Compile changed app surfaces and tests
        run: |
          python -m compileall -q streamlit_app.py pages/4_Projection_History.py pages/5_Daily_Projection_Run.py pages/6_Top_Plays.py engine tests

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Run affected contracts
        run: |
          pytest -q \
            tests/test_app_contract.py \
            tests/test_bet_add_buttons_contract.py \
            tests/test_daily_run_automated_lines_ui.py \
            tests/test_explainability_ui.py \
            tests/test_frozen_execution_history.py \
            tests/test_manual_market_controls.py \
            tests/test_odds_credit_saver.py \
            tests/test_sidebar_metric_explainability_v2.py \
            tests/test_ui_command_center_contract.py \
            tests/test_sportsgameodds_ui_cleanup.py

      - name: Commit refreshed contracts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No contract changes to commit.'
            exit 1
          fi
          git commit -m 'Refresh UI contracts for automated sportsbook lines'
          git push origin HEAD:agent/sportsgameodds-ui-cleanup
