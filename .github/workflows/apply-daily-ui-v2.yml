name: Apply Daily Run UI v2 Polish

on:
  push:
    branches:
      - ui-daily-run-cleanup-v2
    paths:
      - .github/workflows/apply-daily-ui-v2.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply presentation-only Daily Run hierarchy
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('pages/5_Daily_Projection_Run.py')
          text = path.read_text(encoding='utf-8')
          old_css = '''    <style>\n    .block-container { padding-top: 3.25rem !important; }\n    </style>'''
          new_css = '''    <style>\n    .block-container { padding-top: 3.25rem !important; }\n    /* daily-control-deck-v2: presentation only. */\n    .daily-hero { margin:.25rem 0 1.15rem; padding:.9rem 1rem; border:1px solid rgba(73,111,151,.48); border-left:3px solid #ff3655; border-radius:16px; background:linear-gradient(120deg,rgba(227,25,55,.08),rgba(10,29,54,.76) 42%,rgba(6,18,35,.78)); box-shadow:0 14px 34px rgba(0,0,0,.16); }\n    .daily-hero strong { color:#f8fbff; font-size:1rem; }\n    .daily-hero span { display:block; color:#9db0c5; font-size:.84rem; margin-top:.2rem; }\n    .daily-kicker { margin:1.35rem 0 .42rem; color:#aebfd2; font-size:.72rem; font-weight:900; letter-spacing:.13em; text-transform:uppercase; }\n    .daily-kicker::before { content:''; display:inline-block; width:22px; height:2px; margin-right:.5rem; vertical-align:middle; background:#ff3655; box-shadow:0 0 11px rgba(227,25,55,.42); }\n    .daily-paid-note { margin:.35rem 0 .8rem; padding:.72rem .85rem; border-radius:13px; border:1px solid rgba(250,204,21,.32); background:rgba(120,79,8,.08); color:#c9d7e5; font-size:.86rem; }\n    @media (max-width:900px) { .daily-hero { padding:.78rem .85rem; } .daily-kicker { margin-top:1rem; } }\n    </style>'''
          if old_css not in text:
              raise SystemExit('Daily base CSS anchor not found')
          text = text.replace(old_css, new_css, 1)
          caption_end = '''    "Each pitcher is captured as an immutable pregame strikeout + total-outs + hits-allowed snapshot for calibration."\n)'''
          hero = caption_end + '''\nst.markdown(\n    '<div class="daily-hero"><strong>Daily Control Deck · frozen pregame capture</strong>'\n    '<span>Run the slate first. Paid strikeout lines are a separate manual data pull and never drive the baseball projection.</span></div>',\n    unsafe_allow_html=True,\n)'''
          if caption_end not in text:
              raise SystemExit('Daily caption anchor not found')
          text = text.replace(caption_end, hero, 1)
          paid_anchor = 'st.markdown("### 💳 Paid strikeout lines")'
          paid_insert = '''st.markdown('<div class="daily-kicker">Manual paid data</div>', unsafe_allow_html=True)\nst.markdown('<div class="daily-paid-note">Optional market-data pull · manual only · strikeout lines only · saved snapshot is reused elsewhere without another paid request.</div>', unsafe_allow_html=True)\n''' + paid_anchor
          if paid_anchor not in text:
              raise SystemExit('Paid odds anchor not found')
          text = text.replace(paid_anchor, paid_insert, 1)
          run_anchor = 'if st.button("⚾ RUN ALL TODAY\'S PITCHERS", type="primary", use_container_width=True):'
          run_insert = '''st.markdown('<div class="daily-kicker">Projection capture</div>', unsafe_allow_html=True)\n''' + run_anchor
          if run_anchor not in text:
              raise SystemExit('Daily run button anchor not found')
          text = text.replace(run_anchor, run_insert, 1)
          slate_anchor = 'slate = st.session_state.get("daily_slate")'
          slate_insert = '''st.markdown('<div class="daily-kicker">Slate output</div>', unsafe_allow_html=True)\n''' + slate_anchor
          if slate_anchor not in text:
              raise SystemExit('Slate output anchor not found')
          text = text.replace(slate_anchor, slate_insert, 1)
          path.write_text(text, encoding='utf-8')
          compile(text, str(path), 'exec')
          PY
      - name: Commit generated polish and remove temporary workflow
        run: |
          rm .github/workflows/apply-daily-ui-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Polish Daily Projection Run hierarchy"
          git push origin HEAD:ui-daily-run-cleanup-v2
