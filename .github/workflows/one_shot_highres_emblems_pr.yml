name: one-shot-highres-emblems-pr

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build-assets:
    if: github.head_ref == 'ui/highres-projection-emblems-v14'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/highres-projection-emblems-v14
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow and pytest
        run: pip install pillow pytest
      - name: Build clean 256px approved emblem assets
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageFilter

          assets = Path('assets')
          names = [
              'projection_k.webp', 'projection_k_plus.webp',
              'projection_outs.webp', 'projection_outs_plus.webp',
              'projection_hits.webp', 'projection_hits_plus.webp',
          ]

          for name in names:
              path = assets / name
              source = Image.open(path).convert('RGBA')
              original_size = source.size

              alpha = source.getchannel('A').resize((256, 256), Image.Resampling.LANCZOS)
              rgb = source.convert('RGB').resize((256, 256), Image.Resampling.LANCZOS)
              rgb = rgb.filter(ImageFilter.UnsharpMask(radius=0.85, percent=135, threshold=2))
              output = rgb.convert('RGBA')
              output.putalpha(alpha)
              output.save(path, format='WEBP', lossless=True, method=6)

              check = Image.open(path)
              assert check.size == (256, 256), (name, check.size)
              print(name, original_size, '->', check.size, path.stat().st_size)

          app = Path('streamlit_app.py')
          text = app.read_text(encoding='utf-8')
          for name in names:
              text = text.replace(f'{name}?v=13', f'{name}?v=14')
          app.write_text(text, encoding='utf-8')

          polish = Path('tests/test_info_emblem_polish.py')
          polish.write_text(polish.read_text(encoding='utf-8').replace('?v=13', '?v=14'), encoding='utf-8')

          Path('tests/test_projection_emblem_assets.py').write_text(
              'from pathlib import Path\n\nfrom PIL import Image\n\nNAMES = [\n    "projection_k.webp", "projection_k_plus.webp",\n    "projection_outs.webp", "projection_outs_plus.webp",\n    "projection_hits.webp", "projection_hits_plus.webp",\n]\n\ndef test_projection_emblems_are_high_resolution_assets():\n    for name in NAMES:\n        assert Image.open(Path("assets") / name).size == (256, 256)\n\ndef test_projection_page_uses_v14_highres_asset_cache_key():\n    source = Path("streamlit_app.py").read_text(encoding="utf-8")\n    for name in NAMES:\n        assert f"{name}?v=14" in source\n',
              encoding='utf-8',
          )
          PY
      - name: Focused checks
        run: |
          python -m compileall -q streamlit_app.py engine tests
          pytest -q tests/test_info_emblem_polish.py tests/test_projection_emblem_assets.py
      - name: Commit generated assets and delete temporary workflow
        run: |
          rm -f .github/workflows/one_shot_highres_emblems_pr.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/projection_k.webp assets/projection_k_plus.webp assets/projection_outs.webp assets/projection_outs_plus.webp assets/projection_hits.webp assets/projection_hits_plus.webp streamlit_app.py tests/test_info_emblem_polish.py tests/test_projection_emblem_assets.py .github/workflows
          git commit -m "Replace Projection emblems with clean 256px assets"
          git push origin HEAD:ui/highres-projection-emblems-v14
