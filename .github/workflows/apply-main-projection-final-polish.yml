name: Apply Main Projection Final Polish

on:
  push:
    branches:
      - ui-main-projection-final-polish
    paths:
      - .github/workflows/apply-main-projection-final-polish.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui-main-projection-final-polish
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply visual polish
        run: |
          python - <<'PY'
          from pathlib import Path

          ui_path = Path('engine/ui_command_center.py')
          app_path = Path('streamlit_app.py')
          contract_path = Path('tests/test_ui_command_center_contract.py')
          readability_path = Path('tests/test_command_center_readability.py')

          ui = ui_path.read_text(encoding='utf-8')
          app = app_path.read_text(encoding='utf-8')
          contract = contract_path.read_text(encoding='utf-8')
          readability = readability_path.read_text(encoding='utf-8')

          if 'cle-command-center-v8' in ui:
              print('v8 polish already applied')
              raise SystemExit(0)

          assert 'COMMAND_CENTER_UI_VERSION = "cle-command-center-v7"' in ui
          ui = ui.replace('COMMAND_CENTER_UI_VERSION = "cle-command-center-v7"', 'COMMAND_CENTER_UI_VERSION = "cle-command-center-v8"', 1)

          old_hero = '''                <div class="cc-hero-copy">\n                  <div class="cc-hero-kicker">Built for CLE baseball · two-path starter intelligence</div>\n                  <div class="cc-hero-title">StrikeOut <span>King 9000</span></div>\n                  <div class="cc-hero-sub">★ MLB Pitcher Projection Engine ★ Two-Path Analytics ★</div>\n                </div>'''
          new_hero = '''                <div class="cc-hero-copy">\n                  <div class="cc-hero-kicker">Built for CLE baseball · two-path starter intelligence</div>\n                  <div class="cc-hero-title"><span class="cc-word-top">STRIKEOUT</span><span class="cc-word-bottom">KING 9000</span></div>\n                  <div class="cc-hero-ribbon">★ MLB PITCHER PROJECTION ENGINE ★</div>\n                </div>'''
          assert old_hero in ui
          ui = ui.replace(old_hero, new_hero, 1)

          assert 'st.columns([1.15, 3.25, 1.45]' in ui
          ui = ui.replace('st.columns([1.15, 3.25, 1.45]', 'st.columns([1.35, 3.35, 1.45]', 1)
          assert 'st.image(str(MASCOT_PATH), width=190)' in ui
          ui = ui.replace('st.image(str(MASCOT_PATH), width=190)', 'st.image(str(MASCOT_PATH), width=235)', 1)

          polish_css = r'''

        /* v8 final Main Projection polish: readability + approved CLE hero. */
        .st-key-cc_hero_shell { min-height:270px; }
        .st-key-cc_hero_shell [data-testid="stImage"] img {
            max-height:248px!important;
            width:auto!important;
            filter:drop-shadow(0 16px 20px rgba(0,0,0,.46)) drop-shadow(0 0 20px rgba(236,22,56,.16));
        }
        .cc-hero-title {
            display:flex!important;
            flex-direction:column;
            align-items:flex-start;
            gap:.02em;
            font-family:Impact,"Arial Black","Arial Narrow",sans-serif!important;
            font-size:clamp(3.45rem,6.5vw,6.95rem)!important;
            line-height:.76!important;
            letter-spacing:.012em!important;
            white-space:nowrap!important;
            text-transform:uppercase;
        }
        .cc-hero-title .cc-word-top {
            display:block!important;
            color:#f5f1e9!important;
            -webkit-text-stroke:1px rgba(255,255,255,.82);
            text-shadow:3px 3px 0 #07182b,5px 5px 0 rgba(0,0,0,.42),0 0 22px rgba(255,255,255,.05)!important;
        }
        .cc-hero-title .cc-word-bottom {
            display:block!important;
            color:var(--cc-red)!important;
            -webkit-text-stroke:1.4px #f1eee7;
            paint-order:stroke fill;
            text-shadow:2px 2px 0 #07182b,4px 4px 0 #790b1d,0 0 22px rgba(236,22,56,.14)!important;
        }
        .cc-hero-ribbon {
            display:inline-flex;
            align-items:center;
            justify-content:center;
            width:max-content;
            max-width:100%;
            margin-top:.72rem;
            padding:.44rem 1.15rem;
            color:#f7f3ec;
            border-top:2px solid var(--cc-red);
            border-bottom:2px solid var(--cc-red);
            background:linear-gradient(90deg,transparent,rgba(236,22,56,.13) 14%,rgba(7,24,43,.92) 50%,rgba(236,22,56,.13) 86%,transparent);
            font-family:var(--cc-ui-font)!important;
            font-size:.86rem;
            font-weight:900;
            line-height:1.2;
            letter-spacing:.075em;
            text-transform:uppercase;
            text-shadow:none!important;
        }
        .cc-hero-kicker { font-size:.82rem!important;letter-spacing:.115em!important;line-height:1.35!important; }

        .section-head {
            font-family:var(--cc-ui-font)!important;
            font-size:.96rem!important;
            font-weight:900!important;
            line-height:1.15!important;
            letter-spacing:.025em!important;
            text-shadow:none!important;
            -webkit-font-smoothing:antialiased!important;
            text-rendering:geometricPrecision!important;
            min-height:2.35rem;
            display:flex!important;
            align-items:center;
            justify-content:center;
        }
        [data-testid="stCaptionContainer"],.reco-meta,.search-note,.cc-status-meta,.cc-matchup-meta,.cc-matchup-status-meta {
            font-size:.88rem!important;
            letter-spacing:0!important;
            text-shadow:none!important;
        }

        .reco-card.reco-good { border-color:rgba(50,229,141,.72)!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.04),0 0 0 1px rgba(50,229,141,.08),0 14px 30px rgba(0,0,0,.28)!important; }
        .reco-card.reco-under { border-color:rgba(255,71,98,.78)!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.04),0 0 0 1px rgba(236,22,56,.10),0 14px 30px rgba(0,0,0,.28)!important; }
        .reco-card.reco-warn { border-color:rgba(255,209,102,.72)!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.04),0 0 0 1px rgba(255,209,102,.08),0 14px 30px rgba(0,0,0,.28)!important; }
        .reco-side {
            display:inline-flex!important;
            align-items:center;
            justify-content:center;
            margin:.12rem 0 .38rem!important;
            padding:.18rem .68rem!important;
            border-radius:10px;
            font-family:var(--cc-ui-font)!important;
            font-size:2.15rem!important;
            font-weight:950!important;
            line-height:1.08!important;
            letter-spacing:.025em!important;
            text-shadow:none!important;
        }
        .reco-side.reco-good { color:#50f2aa!important;background:rgba(12,91,61,.34)!important;border:1px solid rgba(50,229,141,.52)!important; }
        .reco-side.reco-under { color:#ff6379!important;background:rgba(125,13,36,.36)!important;border:1px solid rgba(255,71,98,.56)!important; }
        .reco-side.reco-warn { color:#ffe08a!important;background:rgba(111,82,15,.30)!important;border:1px solid rgba(255,209,102,.52)!important; }

        @media (max-width:900px) {
            .st-key-cc_hero_shell [data-testid="stImage"] img { max-height:165px!important; }
            .cc-hero-title { font-size:3.25rem!important;white-space:normal!important;align-items:center; }
            .cc-hero-ribbon { margin-left:auto;margin-right:auto;font-size:.76rem; }
        }
        @media (max-width:620px) {
            .cc-hero-title { font-size:2.75rem!important; }
            .section-head { font-size:.88rem!important;min-width:180px!important; }
            .reco-side { font-size:1.8rem!important; }
        }
'''
          marker = '        </style>\n        """,\n        unsafe_allow_html=True,\n    )'
          assert marker in ui
          ui = ui.replace(marker, polish_css + '\n' + marker, 1)

          old_card = '<div class="reco-card"><div class="cc-card-top">'
          new_card = '<div class="reco-card {cls}"><div class="cc-card-top">'
          assert old_card in app
          app = app.replace(old_card, new_card, 1)

          contract = contract.replace('test_command_center_v7_exposes_reusable_brand_components', 'test_command_center_v8_exposes_reusable_brand_components')
          contract = contract.replace('cle-command-center-v7', 'cle-command-center-v8')
          contract = contract.replace('st.image(str(MASCOT_PATH), width=190)', 'st.image(str(MASCOT_PATH), width=235)')
          contract += '''\n\ndef test_v8_final_polish_locks_approved_header_tabs_and_lean_highlights():\n    source = Path("engine/ui_command_center.py").read_text(encoding="utf-8")\n    app = Path("streamlit_app.py").read_text(encoding="utf-8")\n    assert 'cc-word-top">STRIKEOUT' in source\n    assert 'cc-word-bottom">KING 9000' in source\n    assert 'cc-hero-ribbon' in source\n    assert 'font-family:var(--cc-ui-font)!important;' in source\n    assert '.reco-side.reco-good' in source\n    assert '.reco-side.reco-under' in source\n    assert '.reco-side.reco-warn' in source\n    assert '<div class="reco-card {cls}">' in app\n'''

          readability = readability.replace('cle-command-center-v7', 'cle-command-center-v8')
          readability = readability.replace('st.image(str(MASCOT_PATH), width=190)', 'st.image(str(MASCOT_PATH), width=235)')

          ui_path.write_text(ui, encoding='utf-8')
          app_path.write_text(app, encoding='utf-8')
          contract_path.write_text(contract, encoding='utf-8')
          readability_path.write_text(readability, encoding='utf-8')
          PY
      - name: Compile and focused UI tests
        run: |
          pip install -r requirements.txt pytest
          python -m compileall -q streamlit_app.py engine tests
          pytest -q tests/test_ui_command_center_contract.py tests/test_command_center_readability.py
      - name: Commit polish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add engine/ui_command_center.py streamlit_app.py tests/test_ui_command_center_contract.py tests/test_command_center_readability.py
          if git diff --cached --quiet; then
            echo "No polish changes"
            exit 0
          fi
          git commit -m "Polish Main Projection hero and lean states"
          git push origin HEAD:ui-main-projection-final-polish
