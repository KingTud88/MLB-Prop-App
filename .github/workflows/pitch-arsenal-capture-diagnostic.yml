name: Pitch Arsenal Capture Diagnostic

on:
  push:
    branches: [agent/pitch-arsenal-pregame-capture]

permissions:
  contents: write

jobs:
  diagnose:
    if: github.event.head_commit.message != 'Record pitcher arsenal capture diagnostic'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pytest
      - name: Validate and capture live pitcher arsenal context
        run: |
          PYTHONPATH=. pytest -q tests/test_pitch_arsenal_capture.py tests/test_pitch_mix_readiness_audit.py
          PYTHONPATH=. python -m training.pitch_arsenal_capture
          PYTHONPATH=. python -m training.pitch_mix_readiness_audit
          python - <<'PY'
          import pandas as pd
          from pathlib import Path

          arsenal = pd.read_csv('data/pitch_arsenal_context_log.csv') if Path('data/pitch_arsenal_context_log.csv').exists() else pd.DataFrame()
          readiness = pd.read_csv('data/pitch_mix_readiness_summary.csv') if Path('data/pitch_mix_readiness_summary.csv').exists() else pd.DataFrame()
          eligible = 0
          if not arsenal.empty and 'audit_eligible' in arsenal.columns:
              eligible = int(arsenal['audit_eligible'].astype(str).str.lower().isin({'true','1','yes','y'}).sum())
          lines = [
              'diagnostic=success',
              f'arsenal_rows={len(arsenal)}',
              f'eligible_rows={eligible}',
          ]
          if not readiness.empty:
              row = readiness.iloc[0]
              lines.extend([
                  f"readiness_status={row.get('Status','')}",
                  f"satisfied_requirements={row.get('Satisfied_Requirements','')}",
                  f"missing_requirements={row.get('Missing_Requirements','')}",
              ])
          Path('data/pitch_arsenal_capture_diagnostic.txt').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
      - name: Commit diagnostic evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/pitch_arsenal_context_log.csv data/pitch_mix_readiness_fields.csv data/pitch_mix_readiness_summary.csv data/pitch_arsenal_capture_diagnostic.txt
          git commit -m "Record pitcher arsenal capture diagnostic"
          git push origin HEAD:agent/pitch-arsenal-pregame-capture
