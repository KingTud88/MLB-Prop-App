name: Integrate Role Workload Shadow

on:
  workflow_dispatch:
  push:
    paths:
      - scripts/integrate_role_workload_shadow.py
      - data/starter_role_runtime_state.csv
      - engine/role_workload_gate.py
      - tests/test_role_workload_gate.py
      - .github/workflows/integrate-role-workload-shadow.yml

# Runtime-state commits are produced by GITHUB_TOKEN and therefore do not
# recursively trigger this workflow. This file change intentionally retriggers
# the integration from a head that already contains the validated state.
permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pytest
      - name: Require validated runtime state
        run: test -s data/starter_role_runtime_state.csv
      - name: Apply shadow integration
        run: python scripts/integrate_role_workload_shadow.py
      - name: Compile and regression test
        run: |
          python -m py_compile streamlit_app.py engine/role_workload_gate.py
          pytest -q tests/test_role_workload_gate.py tests/test_starter_role.py tests/test_starter_role_candidate.py tests/test_starter_role_promotion_gate.py
      - name: Commit shadow integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add streamlit_app.py
          if git diff --cached --quiet; then
            echo "Role workload shadow already integrated"
            exit 0
          fi
          git commit -m "Integrate starter role workload in shadow mode"
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
