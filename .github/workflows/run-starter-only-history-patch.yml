name: Run starter-only history patch

on:
  push:
    paths:
      - scripts/apply_starter_only_history.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pytest
      - run: python scripts/apply_starter_only_history.py
      - run: python -m compileall -q streamlit_app.py pages/5_Daily_Projection_Run.py pages/6_Top_Plays.py automation engine tests
      - run: pytest -q
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add streamlit_app.py automation/daily_projection_runner.py pages/5_Daily_Projection_Run.py pages/6_Top_Plays.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Use starter-only history in pitcher projections"
          git pull --rebase origin main
          git push origin HEAD:main
