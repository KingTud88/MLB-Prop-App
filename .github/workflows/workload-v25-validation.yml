name: Workload v2.5 Metric-Gated Validation

on:
  workflow_dispatch:
  push:
    branches:
      - workload-v25-metric-gate
    paths:
      - training/workload_v25_metric_gate_backtest.py
      - tests/test_workload_v25_metric_gate_backtest.py
      - .github/workflows/workload-v25-validation.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt pytest
      - name: Existing workload safety contracts
        run: pytest -q tests/test_workload_backtest.py tests/test_workload_leash_backtest.py tests/test_workload_tight_backtest.py tests/test_workload_context.py tests/test_workload_v25_metric_gate_backtest.py
      - name: Three-season chronological replay
        run: python -m training.workload_v25_metric_gate_backtest --seasons 2024 2025 2026
      - name: Commit report-only evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/workload_v25_summary.csv data/workload_v25_segments.csv
          if git diff --cached --quiet; then
            echo "No v2.5 evidence changes"
            exit 0
          fi
          git commit -m "Refresh workload v2.5 metric-gate evidence"
          git push origin HEAD:workload-v25-metric-gate
