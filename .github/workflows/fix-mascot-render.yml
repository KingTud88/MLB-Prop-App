name: Fix mascot rendering

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, 'Add one-time workflow') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch mascot renderer
        shell: python
        run: |
          from pathlib import Path
          p = Path('streamlit_app.py')
          s = p.read_text()
          old = 'return _original_markdown(_mascot_html(width),unsafe_allow_html=True)'
          new = 'return _original_image(str(MASCOT_PATH),width=width)'
          s = s.replace(old, new)
          old = "new_side_logo='''    st.markdown(f'<div class=\"sok-sidebar-logo\"><img src=\"{MASCOT_DATA_URI}\" alt=\"StrikeOut King 9000\"></div>',unsafe_allow_html=True)'''"
          new = "new_side_logo='''    st.markdown('<div class=\"sok-sidebar-logo\">',unsafe_allow_html=True);st.image(str(MASCOT_PATH),width=130);st.markdown('</div>',unsafe_allow_html=True)'''"
          s = s.replace(old, new)
          old = "new_hero_logo='''with h1:\n    st.markdown(_mascot_html(250),unsafe_allow_html=True)'''"
          new = "new_hero_logo='''with h1:\n    st.image(str(MASCOT_PATH),width=250)'''"
          s = s.replace(old, new)
          p.write_text(s)

      - name: Validate Python
        run: python -m py_compile streamlit_app.py

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add streamlit_app.py
          if git diff --cached --quiet; then
            echo "No mascot changes were necessary."
            exit 0
          fi
          git commit -m "Fix mascot rendering"
          git push
