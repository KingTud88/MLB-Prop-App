name: Run unlimited parlay counter cleanup

on:
  push:
    paths:
      - scripts/fix_unlimited_parlay_counter.py
      - .github/workflows/run-unlimited-parlay-counter-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt pytest
      - name: Fix unlimited parlay counter text
        run: python scripts/fix_unlimited_parlay_counter.py
      - name: Compile
        run: python -m compileall -q streamlit_app.py navigation.py engine automation tests
      - name: Test
        run: pytest -q
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add streamlit_app.py tests/test_bet_add_buttons_contract.py
          if git diff --cached --quiet; then
            echo "No cleanup changes to commit"
            exit 0
          fi
          git commit -m "Fix unlimited Projection parlay counter"
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 2
          done
          exit 1
