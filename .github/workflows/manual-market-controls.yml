name: Manual Projection Market Controls

on:
  push:
    paths:
      - scripts/apply_manual_market_controls.py
      - tests/test_manual_market_controls.py
      - .github/workflows/manual-market-controls.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pytest
      - name: Apply manual market controls
        run: python scripts/apply_manual_market_controls.py
      - name: Compile projection page
        run: python -m py_compile streamlit_app.py
      - name: Run projection UI and sportsbook-separation contracts
        run: pytest -q tests/test_manual_market_controls.py tests/test_app_contract.py tests/test_odds_credit_saver.py tests/test_batter_hand_and_odds_secret.py tests/test_matchup_weather_integrity.py
      - name: Commit projection page controls and retire migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/manual-market-controls.yml
          git add streamlit_app.py
          git commit -m "Add manual sportsbook controls to projection lean cards"
          git pull --rebase origin main
          git push origin HEAD:main
