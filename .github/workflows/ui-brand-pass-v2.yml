name: CLE Brand Pass v2

on:
  push:
    branches: [ui-cle-brand-pass-v2]
    paths:
      - .github/workflows/ui-brand-pass-v2.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui-cle-brand-pass-v2
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pytest pillow
      - name: Apply visual brand pass
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          mascot = Path('assets/strikeout_king_9000_clean.png')
          with Image.open(mascot) as im:
              assert im.format == 'PNG', im.format
              assert im.size[0] >= 160 and im.size[1] >= 160, im.size
              im.verify()

          ui_path = Path('engine/ui_command_center.py')
          ui = ui_path.read_text(encoding='utf-8')
          ui = ui.replace('COMMAND_CENTER_UI_VERSION = "cle-command-center-v6"', 'COMMAND_CENTER_UI_VERSION = "cle-command-center-v7"')
          ui = ui.replace('MASCOT_PATH = ASSET_DIR / "strikeout_king_9000.png"', 'MASCOT_PATH = ASSET_DIR / "strikeout_king_9000_clean.png"')
          ui = ui.replace('            --cc-muted:#92a9bd;\n', '            --cc-muted:#92a9bd;\n            --cc-ui-font:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;\n')
          ui = ui.replace('font-family:Inter,"Segoe UI",Roboto,Arial,sans-serif', 'font-family:var(--cc-ui-font)')
          ui = ui.replace('font-family:Impact,"Arial Narrow",sans-serif!important;\n            font-size:.86rem!important;', 'font-family:var(--cc-ui-font)!important;\n            font-size:.92rem!important;')
          ui = ui.replace('font-family:Impact,"Arial Narrow",sans-serif!important;\n            text-transform:uppercase!important;', 'font-family:var(--cc-ui-font)!important;\n            text-transform:uppercase!important;')
          ui = ui.replace('.cc-hero-kicker {\n            color:#d8e3ed;\n            font-size:.72rem;', '.cc-hero-kicker {\n            color:#d8e3ed;\n            font-family:var(--cc-ui-font);\n            font-size:.78rem;')
          ui = ui.replace('font-size:.78rem;\n            letter-spacing:.13em;', 'font-size:.84rem;\n            letter-spacing:.08em;', 1)
          ui = ui.replace('.cc-status-label { color:#e8eef4;font-size:.72rem;letter-spacing:.08em; }', '.cc-status-label { color:#e8eef4;font-size:.80rem;letter-spacing:.045em; }')
          ui = ui.replace('.cc-status-meta { margin-top:.16rem;color:var(--cc-muted);font-size:.72rem;line-height:1.35; }', '.cc-status-meta { margin-top:.18rem;color:#a8bacb;font-family:var(--cc-ui-font);font-size:.82rem;line-height:1.42; }')
          ui = ui.replace('.cc-matchup-meta { margin-top:.28rem;color:#a9bac9;font-size:.82rem; }', '.cc-matchup-meta { margin-top:.32rem;color:#b7c6d3;font-family:var(--cc-ui-font);font-size:.90rem; }')
          ui = ui.replace('.cc-matchup-status-label { color:var(--cc-green);font-family:var(--cc-ui-font);font-size:.82rem;font-weight:800;letter-spacing:.045em;text-transform:uppercase; }', '.cc-matchup-status-label { color:var(--cc-green);font-family:var(--cc-ui-font);font-size:.86rem;font-weight:800;letter-spacing:.025em;text-transform:uppercase; }')
          ui = ui.replace('.cc-matchup-status-meta { margin-top:.26rem;color:#9eb0c0;font-size:.78rem; }', '.cc-matchup-status-meta { margin-top:.28rem;color:#afc0cf;font-family:var(--cc-ui-font);font-size:.84rem; }')
          ui = ui.replace('font-size:.68rem;\n            font-weight:900;\n            letter-spacing:.045em;', 'font-size:.76rem;\n            font-weight:800;\n            letter-spacing:.02em;', 1)
          ui = ui.replace('font-size:.88rem!important;\n            line-height:1.25!important;', 'font-size:.92rem!important;\n            line-height:1.30!important;')

          crisp_anchor = '        .block-container { max-width:1520px !important; }\n'
          crisp_css = crisp_anchor + '''\n        .stApp,[data-testid="stSidebar"],[data-testid="stMarkdownContainer"],\n        [data-testid="stCaptionContainer"],button,input,label {\n            font-family:var(--cc-ui-font)!important;\n            -webkit-font-smoothing:antialiased;\n            -moz-osx-font-smoothing:grayscale;\n            text-rendering:optimizeLegibility;\n        }\n        [data-testid="stCaptionContainer"],.reco-meta,.search-note {\n            font-family:var(--cc-ui-font)!important;\n            font-size:.86rem!important;\n            line-height:1.45!important;\n            letter-spacing:0!important;\n            text-shadow:none!important;\n        }\n'''
          if crisp_anchor not in ui:
              raise SystemExit('crisp css anchor missing')
          ui = ui.replace(crisp_anchor, crisp_css, 1)

          card_anchor = '        .metric-card,.reco-card {\n            border-radius:15px!important;\n'
          card_css = '''        .cc-card-top { display:flex;align-items:center;justify-content:center;gap:.72rem;margin-bottom:.32rem; }\n        .cc-card-icon {\n            width:48px;height:48px;flex:0 0 48px;border-radius:50%;display:flex;align-items:center;justify-content:center;\n            border:2px solid rgba(236,22,56,.72);background:radial-gradient(circle at 35% 30%,#183e68,#07182b 68%);\n            color:#fff;font-family:Impact,"Arial Narrow",sans-serif;font-size:1.18rem;letter-spacing:.02em;\n            box-shadow:inset 0 0 0 5px rgba(255,255,255,.025),0 8px 18px rgba(0,0,0,.28);\n        }\n        .cc-card-icon.ball { font-family:var(--cc-ui-font);font-size:1.4rem; }\n        .cc-card-icon.hit { color:#ff6a7d; }\n        .cc-team-logo { overflow:hidden;background:radial-gradient(circle at 35% 30%,#122e50,#061426 72%); }\n        .cc-team-logo img { width:66px;height:66px;object-fit:contain;display:block;filter:drop-shadow(0 5px 10px rgba(0,0,0,.28)); }\n\n        .cc-sidebar-brand {\n            padding:.85rem .7rem .8rem;margin:.1rem 0 .8rem;border:1px solid rgba(78,108,137,.66);border-radius:14px;\n            background:linear-gradient(145deg,rgba(8,29,51,.98),rgba(3,16,30,.98));text-align:center;\n            box-shadow:inset 0 1px 0 rgba(255,255,255,.04),0 12px 26px rgba(0,0,0,.20);\n        }\n        .cc-sidebar-crown { color:var(--cc-red);font-size:1.2rem;line-height:1; }\n        .cc-sidebar-script { color:#f5f1e9;font-family:Georgia,"Times New Roman",serif;font-size:1.55rem;font-weight:800;font-style:italic;line-height:.95; }\n        .cc-sidebar-king { color:var(--cc-red);font-family:Impact,"Arial Narrow",sans-serif;font-size:1.42rem;letter-spacing:.035em;line-height:1.0;text-transform:uppercase; }\n        .cc-sidebar-tag { margin-top:.38rem;color:#9fb3c5;font-family:var(--cc-ui-font);font-size:.78rem;line-height:1.35; }\n        .cc-sidebar-pitcher {\n            display:flex;align-items:center;gap:.65rem;padding:.58rem .62rem;margin:.45rem 0 .62rem;border:1px solid rgba(63,100,134,.72);\n            border-radius:12px;background:linear-gradient(145deg,rgba(9,31,55,.96),rgba(5,19,35,.96));\n        }\n        .cc-sidebar-pitcher-logo { width:42px;height:42px;flex:0 0 42px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#07182b;overflow:hidden; }\n        .cc-sidebar-pitcher-logo img { width:38px;height:38px;object-fit:contain; }\n        .cc-sidebar-pitcher-name { color:#f4f7fa;font-family:var(--cc-ui-font);font-size:.86rem;font-weight:800;line-height:1.15; }\n        .cc-sidebar-pitcher-meta { margin-top:.15rem;color:#9fb2c4;font-family:var(--cc-ui-font);font-size:.74rem;line-height:1.25; }\n\n'''
          if card_anchor not in ui:
              raise SystemExit('card css anchor missing')
          ui = ui.replace(card_anchor, card_css + card_anchor, 1)

          helper_marker = '\n\ndef render_command_center_hero('
          helpers = '''\n\ndef _team_logo_url(team_id: int | None) -> str:\n    try:\n        value = int(team_id or 0)\n    except (TypeError, ValueError):\n        value = 0\n    return f"https://www.mlbstatic.com/team-logos/{value}.svg" if value > 0 else ""\n\n\ndef render_sidebar_brand() -> None:\n    st.markdown(\n        '<div class="cc-sidebar-brand"><div class="cc-sidebar-crown">♛</div>'\n        '<div class="cc-sidebar-script">StrikeOut</div><div class="cc-sidebar-king">King 9000</div>'\n        '<div class="cc-sidebar-tag">CLE-themed MLB starter projection engine</div></div>',\n        unsafe_allow_html=True,\n    )\n\n\ndef render_sidebar_pitcher_identity(*, pitcher_name: str, team: str, opponent: str, team_id: int = 0) -> None:\n    logo = _team_logo_url(team_id)\n    logo_html = (\n        f'<img src="{logo}" alt="{_safe(team)} logo" loading="lazy">'\n        if logo else f'<span>{_safe(team)}</span>'\n    )\n    st.markdown(\n        f'<div class="cc-sidebar-pitcher"><div class="cc-sidebar-pitcher-logo">{logo_html}</div>'\n        f'<div><div class="cc-sidebar-pitcher-name">{_safe(pitcher_name)}</div>'\n        f'<div class="cc-sidebar-pitcher-meta">{_safe(team)} vs {_safe(opponent)}</div></div></div>',\n        unsafe_allow_html=True,\n    )\n'''
          if helper_marker not in ui:
              raise SystemExit('hero helper marker missing')
          ui = ui.replace(helper_marker, helpers + helper_marker, 1)

          old_mascot = '''        with mascot_col:\n            st.markdown(\n                '<div class="cc-hero-fallback" aria-label="StrikeOut King 9000">SK9K<span>STRIKEOUT KING</span></div>',\n                unsafe_allow_html=True,\n            )\n'''
          new_mascot = '''        with mascot_col:\n            try:\n                st.image(str(MASCOT_PATH), width=190)\n            except Exception:\n                st.markdown(\n                    '<div class="cc-hero-fallback" aria-label="StrikeOut King 9000">SK9K<span>STRIKEOUT KING</span></div>',\n                    unsafe_allow_html=True,\n                )\n'''
          if old_mascot not in ui:
              raise SystemExit('mascot render anchor missing')
          ui = ui.replace(old_mascot, new_mascot, 1)

          ui = ui.replace('    weather_icon: str = "",\n) -> None:', '    weather_icon: str = "",\n    team_id: int = 0,\n) -> None:', 1)
          old_weather = '    weather = f" {_safe(weather_icon)}" if weather_icon else ""\n    st.markdown(\n'
          new_weather = '''    weather = f" {_safe(weather_icon)}" if weather_icon else ""\n    logo = _team_logo_url(team_id)\n    team_mark = (\n        f'<div class="cc-team-mark cc-team-logo"><img src="{logo}" alt="{_safe(team)} logo" loading="lazy"></div>'\n        if logo else f'<div class="cc-team-mark">{_safe(team)}</div>'\n    )\n    st.markdown(\n'''
          if old_weather not in ui:
              raise SystemExit('matchup logo anchor missing')
          ui = ui.replace(old_weather, new_weather, 1)
          ui = ui.replace('          <div class="cc-team-mark">{_safe(team)}</div>\n', '          {team_mark}\n', 1)
          ui_path.write_text(ui, encoding='utf-8')

          app_path = Path('streamlit_app.py')
          app = app_path.read_text(encoding='utf-8')
          app = app.replace('    render_matchup_strip,\n)', '    render_matchup_strip,\n    render_sidebar_brand,\n    render_sidebar_pitcher_identity,\n)', 1)
          app = app.replace('    st.markdown("## StrikeOut King 9000"); st.caption("CLE-themed MLB starter projection engine")\n', '    render_sidebar_brand()\n', 1)
          game_anchor = 'game=matches[names.index(choice)]; locked=st.session_state.get("locked_pitcher")==game.key\nwith st.sidebar:\n'
          game_insert = '''game=matches[names.index(choice)]; locked=st.session_state.get("locked_pitcher")==game.key\nwith st.sidebar:\n    render_sidebar_pitcher_identity(\n        pitcher_name=game.pitcher_name, team=game.team, opponent=game.opponent,\n        team_id=TEAM_ID_BY_ABBR.get(game.team,0),\n    )\n'''
          if game_anchor not in app:
              raise SystemExit('sidebar pitcher anchor missing')
          app = app.replace(game_anchor, game_insert, 1)
          app = app.replace('    weather_icon=weather_risk.icon or "",\n)', '    weather_icon=weather_risk.icon or "",\n    team_id=TEAM_ID_BY_ABBR.get(game.team,0),\n)', 1)

          app = app.replace("    cls=\"reco-warn\" if side==\"PASS\" else \"reco-under\" if side==\"UNDER\" else \"reco-good\"\n", "    cls=\"reco-warn\" if side==\"PASS\" else \"reco-under\" if side==\"UNDER\" else \"reco-good\"\n    icon=(\"K+\" if \"STRIKEOUT\" in str(effective.get(\"label\",\"\")) else \"OUT\" if \"OUTS\" in str(effective.get(\"label\",\"\")) else \"H\")\n", 1)
          old_reco = '        st.markdown(f\'<div class="reco-card"><div class="reco-label">{effective["label"]}</div><div class="reco-side {cls}">{side}</div><div class="reco-line">{effective["line"]:g} LINE</div><div class="reco-meta">{meta}</div></div>\',unsafe_allow_html=True)\n'
          new_reco = '        st.markdown(f\'<div class="reco-card"><div class="cc-card-top"><div class="cc-card-icon">{icon}</div><div class="reco-label">{effective["label"]}</div></div><div class="reco-side {cls}">{side}</div><div class="reco-line">{effective["line"]:g} LINE</div><div class="reco-meta">{meta}</div></div>\',unsafe_allow_html=True)\n'
          if old_reco not in app:
              raise SystemExit('reco card anchor missing')
          app = app.replace(old_reco, new_reco, 1)

          app = app.replace('<div class="metric-card"><div class="metric-label">PROJECTED STRIKEOUTS</div><div class="metric-value">', '<div class="metric-card"><div class="cc-card-top"><div class="cc-card-icon">K</div><div class="metric-label">PROJECTED STRIKEOUTS</div></div><div class="metric-value">', 1)
          app = app.replace('<div class="metric-card"><div class="metric-label">PROJECTED OUTS</div><div class="metric-value">', '<div class="metric-card"><div class="cc-card-top"><div class="cc-card-icon ball">⚾</div><div class="metric-label">PROJECTED OUTS</div></div><div class="metric-value">', 1)
          app = app.replace('<div class="metric-card"><div class="metric-label">PROJECTED HITS ALLOWED</div><div class="metric-value">', '<div class="metric-card"><div class="cc-card-top"><div class="cc-card-icon hit">H</div><div class="metric-label">PROJECTED HITS ALLOWED</div></div><div class="metric-value">', 1)
          app_path.write_text(app, encoding='utf-8')

          test_path = Path('tests/test_ui_command_center_contract.py')
          test = test_path.read_text(encoding='utf-8')
          test = test.replace('test_command_center_v6_exposes_reusable_hero_and_matchup_components', 'test_command_center_v7_exposes_reusable_brand_components')
          test = test.replace('COMMAND_CENTER_UI_VERSION = "cle-command-center-v6"', 'COMMAND_CENTER_UI_VERSION = "cle-command-center-v7"')
          test = test.replace('test_main_projection_uses_v6_components_without_removing_model_flow', 'test_main_projection_uses_v7_components_without_removing_model_flow')
          test = test.replace('    assert "cc-hero-fallback" in source\n    assert "st.image(str(MASCOT_PATH)" not in source\n', '    assert "cc-hero-fallback" in source\n    assert "st.image(str(MASCOT_PATH), width=190)" in source\n    assert "def render_sidebar_brand(" in source\n    assert "def render_sidebar_pitcher_identity(" in source\n    assert "www.mlbstatic.com/team-logos" in source\n')
          test += '''\n\ndef test_brand_pass_adds_team_marks_and_projection_icon_bubbles():\n    source = Path("streamlit_app.py").read_text(encoding="utf-8")\n    theme = Path("engine/ui_command_center.py").read_text(encoding="utf-8")\n    assert "render_sidebar_brand()" in source\n    assert "render_sidebar_pitcher_identity(" in source\n    assert "team_id=TEAM_ID_BY_ABBR.get(game.team,0)" in source\n    assert "cc-card-icon" in source\n    assert ".cc-card-icon" in theme\n    assert ".cc-sidebar-brand" in theme\n    assert ".cc-team-logo" in theme\n    assert "calculate_projection(" in source\n    assert "this page never calls the Odds API" in source\n'''
          test_path.write_text(test, encoding='utf-8')

          read_path = Path('tests/test_command_center_readability.py')
          read = read_path.read_text(encoding='utf-8')
          read = read.replace('COMMAND_CENTER_UI_VERSION = "cle-command-center-v6"', 'COMMAND_CENTER_UI_VERSION = "cle-command-center-v7"')
          read = read.replace('MASCOT_PATH = ASSET_DIR / "strikeout_king_9000.png"', 'MASCOT_PATH = ASSET_DIR / "strikeout_king_9000_clean.png"')
          read = read.replace('assert "st.image(str(MASCOT_PATH)" not in source', 'assert "st.image(str(MASCOT_PATH), width=190)" in source')
          read = read.replace('assert \'font-family:Inter,"Segoe UI",Roboto,Arial,sans-serif\' in source', 'assert \'--cc-ui-font:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif\' in source')
          read += '''\n\ndef test_verified_mascot_asset_is_real_png():\n    from PIL import Image\n    path = Path("assets/strikeout_king_9000_clean.png")\n    assert path.exists()\n    with Image.open(path) as image:\n        assert image.format == "PNG"\n        assert image.size[0] >= 160 and image.size[1] >= 160\n        image.verify()\n'''
          read_path.write_text(read, encoding='utf-8')
          PY
      - name: Compile and full quality gate
        run: |
          python -m compileall -q streamlit_app.py navigation.py engine automation tests
          pytest -q
      - name: Commit visual pass and remove temporary workflows
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add streamlit_app.py engine/ui_command_center.py tests/test_ui_command_center_contract.py tests/test_command_center_readability.py assets/strikeout_king_9000_clean.png
          git rm -f .github/workflows/ui-brand-pass-v2.yml .github/workflows/mascot-normalize.yml
          git commit -m "Apply CLE brand and readability pass"
          git push origin HEAD:ui-cle-brand-pass-v2
