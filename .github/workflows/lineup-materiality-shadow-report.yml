name: Lineup Materiality Shadow Report

on:
  push:
    branches: [agent/lineup-materiality-shadow]

permissions:
  contents: write

jobs:
  report:
    if: github.event.head_commit.message != 'Run lineup materiality shadow report'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pytest
      - name: Validate materiality contracts
        run: PYTHONPATH=. pytest -q tests/test_lineup_materiality_shadow.py
      - name: Generate report-only materiality shadow
        run: PYTHONPATH=. python -m training.lineup_materiality_shadow
      - name: Commit report outputs to isolated branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/lineup_materiality_shadow_detail.csv data/lineup_materiality_shadow_summary.csv data/lineup_materiality_shadow_gate.csv
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Run lineup materiality shadow report"
          git push origin HEAD:agent/lineup-materiality-shadow
