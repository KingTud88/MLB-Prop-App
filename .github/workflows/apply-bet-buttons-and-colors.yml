name: Apply bet buttons and result colors

on:
  push:
    branches: [main]
    paths:
      - scripts/add_bet_buttons_and_result_colors.py
      - .github/workflows/apply-bet-buttons-and-colors.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply betting UI upgrades
        run: python scripts/add_bet_buttons_and_result_colors.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages/2_Bet_Tracker.py pages/6_Top_Plays.py streamlit_app.py
          if git diff --cached --quiet; then
            echo "No changes needed."
          else
            git commit -m "Add bet buttons and tracker result colors"
            for attempt in 1 2 3; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then exit 0; fi
              sleep $((attempt * 2))
            done
            exit 1
          fi
