name: Fix empty sidebar brand wrapper

on:
  push:
    paths:
      - '.github/workflows/fix-empty-sidebar-brand.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Hide orphaned empty brand wrapper
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('navigation.py')
          text = path.read_text()
          marker = '        .sk-nav-brand:empty {'
          if marker not in text:
              needle = '        .sk-nav-mascot {'
              rule = '''        .sk-nav-brand:empty {\n            display:none !important;\n            margin:0 !important;\n            padding:0 !important;\n            border:0 !important;\n            background:none !important;\n            box-shadow:none !important;\n        }\n'''
              if needle not in text:
                  raise SystemExit('sidebar mascot selector not found')
              text = text.replace(needle, rule + needle, 1)
              path.write_text(text)
          PY
      - name: Commit sidebar bubble fix
        run: |
          if git diff --quiet -- navigation.py; then
            echo 'No change needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add navigation.py
          git commit -m 'Remove empty sidebar brand bubble'
          git push
