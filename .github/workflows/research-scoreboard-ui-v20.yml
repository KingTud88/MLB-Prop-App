name: Research Scoreboard UI V20

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Run research scoreboard UI patch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Apply UI patch
        run: python .github/scripts/research_scoreboard_ui_patch.py

      - name: Compile
        run: python -m compileall -q streamlit_app.py navigation.py engine pages automation tests

      - name: Targeted scoreboard contracts
        run: PYTHONPATH=. pytest -q tests/test_research_promotion_scoreboard.py tests/test_research_promotion_scoreboard_ui_contract.py

      - name: Full regression suite
        run: PYTHONPATH=. pytest -q

      - name: Commit verified product files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages/4_Projection_History.py tests/test_research_promotion_scoreboard_ui_contract.py
          if git diff --cached --quiet; then
            echo "No scoreboard UI changes to commit."
            exit 0
          fi
          git commit -m "Show research promotion scoreboard in history"

          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main; then
              if git push origin HEAD:main; then
                exit 0
              fi
            else
              git rebase --abort || true
              echo "Rebase conflict; refusing to overwrite main."
              exit 1
            fi
            sleep $((attempt * 2))
          done
          exit 1
