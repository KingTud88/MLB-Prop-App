name: Projection Input Quality Audit

on:
  workflow_dispatch:
  push:
    branches:
      - input-quality-audit
    paths:
      - training/input_quality_audit.py
      - .github/workflows/input-quality-audit.yml

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt pytest
      - name: Existing quality suite
        run: pytest -q
      - name: Report-only input quality audit
        run: python -m training.input_quality_audit
      - name: Commit audit evidence to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/input_quality_summary.csv data/input_quality_components.csv
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refresh projection input quality evidence"
          git push origin HEAD:input-quality-audit
