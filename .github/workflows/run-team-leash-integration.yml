name: Run team leash integration

on:
  push:
    paths:
      - scripts/patch_team_leash_integration.py
      - scripts/fix_team_leash_contract.py
      - .github/workflows/run-team-leash-integration.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pytest
      - name: Apply team leash integration
        run: |
          python scripts/patch_team_leash_integration.py
          python scripts/fix_team_leash_contract.py
      - name: Compile
        run: python -m compileall -q streamlit_app.py navigation.py pages engine automation tests
      - name: Test
        run: pytest -q
      - name: Commit feature
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add automation/daily_projection_runner.py pages/5_Daily_Projection_Run.py pages/4_Projection_History.py streamlit_app.py engine/signal_validation.py tests/test_team_leash.py tests/test_team_leash_ui_contract.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Integrate team leash candidate validation"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort || true
            sleep $((attempt * 2))
          done
          exit 1
