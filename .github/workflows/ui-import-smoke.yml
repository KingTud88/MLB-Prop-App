name: UI import smoke

on:
  push:
    branches: [fix-ui-import-boot]
    paths:
      - .github/workflows/ui-import-smoke.yml
      - engine/ui_command_center.py
      - streamlit_app.py

jobs:
  smoke:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements.txt pytest
      - name: Exact command-center import
        run: |
          python - <<'PY'
          import engine.ui_command_center as u
          print('module', u.__file__)
          for name in (
              'apply_command_center_theme',
              'render_command_center_hero',
              'render_matchup_strip',
              'render_sidebar_brand',
              'render_sidebar_pitcher_identity',
          ):
              print(name, getattr(u, name, None))
              assert callable(getattr(u, name, None)), name
          from engine.ui_command_center import (
              apply_command_center_theme,
              render_command_center_hero,
              render_matchup_strip,
              render_sidebar_brand,
              render_sidebar_pitcher_identity,
          )
          print('exact import ok')
          PY
      - run: python -m compileall -q streamlit_app.py engine
