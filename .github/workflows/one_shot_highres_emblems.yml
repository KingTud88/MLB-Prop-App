name: one-shot-highres-emblems

on:
  push:
    branches:
      - ui/highres-projection-emblems-v14

permissions:
  contents: write

jobs:
  build-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/highres-projection-emblems-v14
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow and pytest
        run: pip install pillow pytest
      - name: Split master emblem sheet into six 128px assets
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          assets = Path('assets')
          master_path = assets / 'projection_summary_emblems_v2.webp'
          master = Image.open(master_path).convert('RGBA')
          if master.size != (768, 128):
              raise SystemExit(f'Unexpected master size: {master.size}')

          names = [
              'projection_k.webp',
              'projection_k_plus.webp',
              'projection_outs.webp',
              'projection_outs_plus.webp',
              'projection_hits.webp',
              'projection_hits_plus.webp',
          ]

          for index, name in enumerate(names):
              tile = master.crop((index * 128, 0, (index + 1) * 128, 128))
              out = assets / name
              tile.save(out, format='WEBP', lossless=True, method=6)
              verify = Image.open(out)
              if verify.size != (128, 128):
                  raise SystemExit(f'{name}: bad output size {verify.size}')
              print(name, verify.size, out.stat().st_size)

          app = Path('streamlit_app.py')
          text = app.read_text(encoding='utf-8')
          for stem in (
              'projection_k.webp',
              'projection_k_plus.webp',
              'projection_outs.webp',
              'projection_outs_plus.webp',
              'projection_hits.webp',
              'projection_hits_plus.webp',
          ):
              text = text.replace(f'{stem}?v=13', f'{stem}?v=14')
          app.write_text(text, encoding='utf-8')

          polish = Path('tests/test_info_emblem_polish.py')
          ptext = polish.read_text(encoding='utf-8').replace('?v=13', '?v=14')
          polish.write_text(ptext, encoding='utf-8')

          Path('tests/test_projection_emblem_assets.py').write_text(
              '''from pathlib import Path\n\nfrom PIL import Image\n\n\ndef test_projection_emblems_are_true_128px_master_tiles():\n    names = [\n        "projection_k.webp",\n        "projection_k_plus.webp",\n        "projection_outs.webp",\n        "projection_outs_plus.webp",\n        "projection_hits.webp",\n        "projection_hits_plus.webp",\n    ]\n    for name in names:\n        image = Image.open(Path("assets") / name)\n        assert image.size == (128, 128), f"{name} was {image.size}"\n\n\ndef test_projection_page_uses_v14_highres_asset_cache_key():\n    source = Path("streamlit_app.py").read_text(encoding="utf-8")\n    for name in (\n        "projection_k.webp?v=14",\n        "projection_k_plus.webp?v=14",\n        "projection_outs.webp?v=14",\n        "projection_outs_plus.webp?v=14",\n        "projection_hits.webp?v=14",\n        "projection_hits_plus.webp?v=14",\n    ):\n        assert name in source\n''',
              encoding='utf-8',
          )
          PY
      - name: Run focused checks
        run: |
          python -m compileall -q streamlit_app.py engine tests
          pytest -q tests/test_info_emblem_polish.py tests/test_projection_emblem_assets.py
      - name: Commit generated assets and remove one-shot workflow
        run: |
          rm .github/workflows/one_shot_highres_emblems.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/projection_k.webp assets/projection_k_plus.webp assets/projection_outs.webp assets/projection_outs_plus.webp assets/projection_hits.webp assets/projection_hits_plus.webp streamlit_app.py tests/test_info_emblem_polish.py tests/test_projection_emblem_assets.py .github/workflows/one_shot_highres_emblems.yml
          git commit -m "Replace Projection emblems with 128px master tiles"
          git push origin HEAD:ui/highres-projection-emblems-v14
