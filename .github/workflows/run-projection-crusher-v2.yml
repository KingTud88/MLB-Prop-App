name: Projection Crusher V2 Report

on:
  push:
    paths:
      - '.github/workflows/run-projection-crusher-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Generate Crusher v2 evidence
        run: python -m training.projection_crusher_v2
      - name: Commit report-only evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/projection_crusher_v2_detail.csv data/projection_crusher_v2_pitchers.csv data/projection_crusher_v2_cohorts.csv data/projection_crusher_v2_coverage.csv
          if git diff --cached --quiet; then
            echo "No Crusher v2 evidence changes"
            exit 0
          fi
          git commit -m "Refresh Projection Crusher v2 evidence"
          git push
