name: Patch Top Plays Postmortem Null Safety

on:
  push:
    branches:
      - research/top-plays-postmortem

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
      - name: Patch null-safe source handling
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('training/top_plays_postmortem.py')
          text = path.read_text()
          old = '''def _key(value: object) -> str:\n    text = str(value or "").strip()\n    return text[:-2] if text.endswith(".0") else text\n\n\ndef _safe_line_source(value: object) -> str:\n    source = str(value or "").strip()\n    upper = source.upper()\n    if not source or any(marker in upper for marker in FORBIDDEN_LINE_SOURCE_MARKERS):\n        return ""\n    return source\n'''
          new = '''def _missing_scalar(value: object) -> bool:\n    if value is None:\n        return True\n    try:\n        return bool(pd.isna(value))\n    except (TypeError, ValueError):\n        return False\n\n\ndef _key(value: object) -> str:\n    if _missing_scalar(value):\n        return ""\n    text = str(value).strip()\n    return text[:-2] if text.endswith(".0") else text\n\n\ndef _safe_line_source(value: object) -> str:\n    if _missing_scalar(value):\n        return ""\n    source = str(value).strip()\n    upper = source.upper()\n    if not source or any(marker in upper for marker in FORBIDDEN_LINE_SOURCE_MARKERS):\n        return ""\n    return source\n'''
          if old not in text:
              raise SystemExit('source helper anchor not found')
          text = text.replace(old, new, 1)
          old2 = '''def _lineup_state(snapshot: pd.Series) -> str:\n    confirmed = snapshot.get("lineup_confirmed")\n    if isinstance(confirmed, (bool, np.bool_)):\n        return "CONFIRMED" if bool(confirmed) else "PROJECTED"\n    text = str(confirmed or "").strip().lower()\n    if text in {"true", "1", "yes"}:\n        return "CONFIRMED"\n    if text in {"false", "0", "no"}:\n        return "PROJECTED"\n    source = str(snapshot.get("lineup_source", "") or "").strip().upper()\n    return source or "UNKNOWN"\n\n\ndef _weather_state(snapshot: pd.Series) -> str:\n    value = str(snapshot.get("weather_delay_risk", "") or "").strip().upper()\n    return value or "UNKNOWN"\n'''
          new2 = '''def _lineup_state(snapshot: pd.Series) -> str:\n    confirmed = snapshot.get("lineup_confirmed")\n    if isinstance(confirmed, (bool, np.bool_)):\n        return "CONFIRMED" if bool(confirmed) else "PROJECTED"\n    if not _missing_scalar(confirmed):\n        text = str(confirmed).strip().lower()\n        if text in {"true", "1", "yes"}:\n            return "CONFIRMED"\n        if text in {"false", "0", "no"}:\n            return "PROJECTED"\n    source_value = snapshot.get("lineup_source", "")\n    source = "" if _missing_scalar(source_value) else str(source_value).strip().upper()\n    return source or "UNKNOWN"\n\n\ndef _weather_state(snapshot: pd.Series) -> str:\n    value = snapshot.get("weather_delay_risk", "")\n    if _missing_scalar(value):\n        return "UNKNOWN"\n    text = str(value).strip().upper()\n    return text or "UNKNOWN"\n'''
          if old2 not in text:
              raise SystemExit('context helper anchor not found')
          path.write_text(text.replace(old2, new2, 1))
          PY
          python -m compileall -q training/top_plays_postmortem.py tests/test_top_plays_postmortem.py tests/test_top_plays_postmortem_nulls.py
          python -m pytest -q tests/test_top_plays_postmortem.py tests/test_top_plays_postmortem_nulls.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add training/top_plays_postmortem.py
          git commit -m "Harden postmortem line source null handling"
          git push
