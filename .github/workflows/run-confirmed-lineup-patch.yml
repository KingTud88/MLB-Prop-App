name: Run confirmed lineup patch

on:
  push:
    paths:
      - scripts/patch_confirmed_lineups.py
      - scripts/patch_confirmed_lineup_contracts.py
      - .github/workflows/run-confirmed-lineup-patch.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pytest
      - name: Apply confirmed-lineup integration
        run: |
          python scripts/patch_confirmed_lineups.py
          python scripts/patch_confirmed_lineup_contracts.py
      - name: Compile
        run: python -m compileall -q streamlit_app.py pages engine automation tests
      - name: Test
        run: pytest -q
      - name: Live MLB lineup parser smoke check
        run: |
          python - <<'PY'
          from datetime import datetime
          from zoneinfo import ZoneInfo
          from automation.daily_projection_runner import schedule
          from engine.lineup_context import get_confirmed_lineup
          rows = schedule(datetime.now(ZoneInfo('America/New_York')).date().isoformat())
          checked = 0
          confirmed = 0
          seen = set()
          for row in rows:
              key = (row['game_pk'], row.get('opponent_team_id'))
              if key in seen or not row.get('opponent_team_id'):
                  continue
              seen.add(key)
              ctx = get_confirmed_lineup(row['game_pk'], row['opponent_team_id'])
              checked += 1
              confirmed += int(ctx.confirmed)
          print(f'live lineup parser checked={checked} confirmed_now={confirmed}')
          assert checked > 0
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add engine/opposing_batters.py automation/daily_projection_runner.py streamlit_app.py pages/5_Daily_Projection_Run.py pages/4_Projection_History.py tests/test_confirmed_lineups.py tests/test_lineup_integration_contract.py tests/test_matchup_weather_integrity.py tests/test_projection_weather_batter_contract.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add confirmed lineup matchup intelligence"
          git pull --rebase origin main
          git push origin HEAD:main
