name: Apply ML shadow and Projection Summary fix

on:
  push:
    paths:
      - ".github/workflows/apply-ml-shadow-and-summary-fix.yml"

permissions:
  contents: write

jobs:
  patch-verify-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
      - name: Apply guarded production wiring
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"Target missing in {path}: {old[:120]!r}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          # Fix the shadow feature guard: market 'line' is banned by architecture,
          # but substring matching would also reject legitimate 'lineup_*' fields.
          replace_once(
              "training/ml_shadow_report.py",
              '    "market",\n    "line",\n    "projection",',
              '    "market",\n    "projection",',
          )

          # Save the truly independent raw K path means going forward. These are
          # evidence-only fields; the live ensemble remains unchanged.
          replace_once(
              "automation/daily_projection_runner.py",
              '        "projection": result.ensemble_mean, "k_sd": result.ensemble_sd,\n',
              '        "projection": result.ensemble_mean, "k_sd": result.ensemble_sd,\n        "sim_mean_k": result.simulation_mean, "math_mean_k": result.mathematical_mean,\n        "sim_sd_k": result.simulation_sd, "math_sd_k": result.mathematical_sd,\n',
          )

          # Report file locations are read-only from Streamlit.
          replace_once(
              "streamlit_app.py",
              'OBS_LOG = APP_DIR / "data" / "starter_observation_log.csv"\n',
              'OBS_LOG = APP_DIR / "data" / "starter_observation_log.csv"\nML_SHADOW_SUMMARY_PATH = APP_DIR / "data" / "ml_shadow_summary.csv"\nML_SHADOW_LIVE_PATH = APP_DIR / "data" / "ml_shadow_live_candidates.csv"\n',
          )

          # Repair the no-line card composition without inventing a market lean.
          replace_once(
              "streamlit_app.py",
              '''    if no_line:\n        cls="reco-neutral"\n        side_text="PROJECTION ONLY"\n        line_text="NO ACTIVE LINE"\n        meta=f"Projection {projection_text} · add line on Daily Projection Run"\n        line_class="reco-line"''',
              '''    if no_line:\n        cls="reco-neutral"\n        side_text=f"{projection_text} PROJ"\n        line_text="NO ACTIVE LINE"\n        meta="Bet lean waits for a Daily Projection Run sportsbook line"\n        line_class="reco-line"''',
          )

          # Keep the approved 88px emblems. Only the neutral no-line typography is
          # tightened so the value cannot collide with K+/OUT+/H+.
          replace_once(
              "streamlit_app.py",
              '/* PROJECTION_WEATHER_SUMMARY_V10 · compact Hits pair + game delay-risk command card */',
              '''/* PROJECTION_SUMMARY_NO_LINE_V14 · compact no-market state; approved emblem geometry untouched */\n.reco-card.reco-neutral .reco-side{\n    font-size:1.82rem!important;\n    line-height:1.04!important;\n    letter-spacing:-.02em!important;\n    white-space:nowrap!important;\n}\n.reco-card.reco-neutral .reco-line{margin-top:.36rem!important}\n.reco-card.reco-neutral .reco-meta{max-width:100%!important;line-height:1.35!important}\n@media (max-width:900px){.reco-card.reco-neutral .reco-side{font-size:1.65rem!important}}\n\n/* PROJECTION_WEATHER_SUMMARY_V10 · compact Hits pair + game delay-risk command card */''',
          )

          helper = r'''

def render_ml_shadow_dashboard(game):
    st.markdown("### ML SHADOW CHALLENGER · REPORT ONLY")
    st.caption(
        "Gradient-boosted K challenger trained chronologically on earlier resolved starter rows only. "
        "Sportsbook data and postgame features are banned. Nothing here changes SIM, MATH, the headline projection, Top Plays, or bet leans."
    )
    try:
        summary=pd.read_csv(ML_SHADOW_SUMMARY_PATH) if ML_SHADOW_SUMMARY_PATH.exists() else pd.DataFrame()
    except Exception:
        summary=pd.DataFrame()
    if summary.empty:
        st.info("ML shadow evidence has not been generated yet. The live two-path projection remains unchanged.")
        return

    def _row(name):
        rows=summary.loc[summary.get("Challenger",pd.Series(dtype=str)).astype(str).eq(name)]
        return rows.iloc[0] if not rows.empty else pd.Series(dtype=object)

    def _metric(row,name,kind="number"):
        value=pd.to_numeric(pd.Series([row.get(name)]),errors="coerce").iloc[0]
        if pd.isna(value):
            return "—"
        if kind=="pct":
            return f"{float(value):+.1%}"
        return f"{float(value):.3f}"

    ml=_row("ML_SHADOW")
    three=_row("SIM_MATH_ML_EQUAL_THIRDS")
    m1,m2,m3,m4=st.columns(4)
    m1.metric("ML shadow",str(ml.get("Status","LEARNING")))
    m2.metric("ML OOS starts",int(pd.to_numeric(pd.Series([ml.get("OOS_Starts",0)]),errors="coerce").fillna(0).iloc[0]))
    m3.metric("ML MAE",_metric(ml,"Candidate_MAE"))
    m4.metric("vs current MAE",_metric(ml,"Relative_MAE_Improvement","pct"))
    t1,t2,t3,t4=st.columns(4)
    t1.metric("3-path research",str(three.get("Status","LEARNING")))
    t2.metric("3-path OOS starts",int(pd.to_numeric(pd.Series([three.get("OOS_Starts",0)]),errors="coerce").fillna(0).iloc[0]))
    t3.metric("3-path MAE",_metric(three,"Candidate_MAE"))
    t4.metric("vs current MAE",_metric(three,"Relative_MAE_Improvement","pct"))

    try:
        live=pd.read_csv(ML_SHADOW_LIVE_PATH) if ML_SHADOW_LIVE_PATH.exists() and ML_SHADOW_LIVE_PATH.stat().st_size>1 else pd.DataFrame()
    except Exception:
        live=pd.DataFrame()
    if not live.empty:
        game_pk=str(getattr(game,"game_pk","")).replace(".0","")
        pitcher_id=str(getattr(game,"pitcher_id","")).replace(".0","")
        gp=live.get("game_pk",pd.Series(index=live.index,dtype=str)).astype(str).str.replace(r"\.0$","",regex=True)
        pid=live.get("pitcher_id",pd.Series(index=live.index,dtype=str)).astype(str).str.replace(r"\.0$","",regex=True)
        match=live.loc[gp.eq(game_pk)&pid.eq(pitcher_id)]
        if not match.empty:
            row=match.iloc[-1]
            st.markdown("#### Current pitcher shadow readout")
            c1,c2,c3,c4=st.columns(4)
            c1.metric("Current projection",f"{float(row.get('Existing_Projection')):.2f}")
            c2.metric("ML shadow",f"{float(row.get('ML_Shadow_Projection')):.2f}")
            three_value=pd.to_numeric(pd.Series([row.get("Three_Path_Candidate")]),errors="coerce").iloc[0]
            c3.metric("3-path candidate","—" if pd.isna(three_value) else f"{float(three_value):.2f}")
            c4.metric("Prior training starts",int(pd.to_numeric(pd.Series([row.get("Training_Resolved_Starts",0)]),errors="coerce").fillna(0).iloc[0]))
            st.caption("Research readout only. The current projection cards and all betting decisions still use the existing two-path engine.")

    display_cols=[c for c in ("Challenger","OOS_Starts","Existing_MAE","Candidate_MAE","Relative_MAE_Improvement","Candidate_Win_Share","Status","Reason") if c in summary.columns]
    if display_cols:
        st.dataframe(summary[display_cols],use_container_width=True,hide_index=True)
'''
          replace_once(
              "streamlit_app.py",
              '\n\ndef render_calibration_dashboard():',
              helper + '\n\ndef render_calibration_dashboard():',
          )

          replace_once(
              "streamlit_app.py",
              'st.dataframe(model_view,use_container_width=True,hide_index=True); st.markdown("### Calibration diagnostics"); render_calibration_dashboard(); st.dataframe(calibration_summary(load_projection_history()),use_container_width=True,hide_index=True); st.stop()',
              'st.dataframe(model_view,use_container_width=True,hide_index=True); st.markdown("### Calibration diagnostics"); render_calibration_dashboard(); st.dataframe(calibration_summary(load_projection_history()),use_container_width=True,hide_index=True); render_ml_shadow_dashboard(game); st.stop()',
          )
          PY
      - name: Compile
        run: python -m compileall -q streamlit_app.py navigation.py engine automation training tests
      - name: Full regression suite
        run: pytest -q
      - name: Generate initial report-only ML evidence
        run: python -m training.ml_shadow_report
      - name: Commit verified changes and reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add streamlit_app.py automation/daily_projection_runner.py training/ml_shadow_report.py tests data/ml_shadow_detail.csv data/ml_shadow_summary.csv data/ml_shadow_live_candidates.csv data/ml_shadow_feature_manifest.csv
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add report-only ML shadow and repair Projection Summary no-line cards"
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
