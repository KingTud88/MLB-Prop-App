name: Starter Ramp Coverage Audit

on:
  workflow_dispatch:
  push:
    branches:
      - starter-ramp-audit
    paths:
      - training/starter_ramp_audit.py
      - .github/workflows/starter-ramp-audit.yml

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt pytest
      - name: Quality suite
        run: pytest -q
      - name: Report-only starter ramp coverage audit
        run: python -m training.starter_ramp_audit
      - name: Commit evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/starter_ramp_coverage_summary.csv
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refresh starter ramp coverage evidence"
          git push origin HEAD:starter-ramp-audit
