name: One-shot Main Projection SportsGameOdds hotfix

on:
  push:
    branches:
      - fix/main-projection-sgo-lines

permissions:
  contents: write

jobs:
  hotfix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout hotfix branch
        uses: actions/checkout@v6
        with:
          ref: fix/main-projection-sgo-lines
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Patch Main Projection to read SportsGameOdds snapshot
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          app = Path('streamlit_app.py')
          source = app.read_text(encoding='utf-8')
          old_import = 'from engine.odds_snapshot import load_pitcher_strikeout_odds'
          new_import = 'from engine.sportsgameodds import load_pitcher_market_odds'
          old_call = 'odds_rows=load_pitcher_strikeout_odds(game.pitcher_name,selected_date.isoformat())'
          new_call = 'odds_rows=load_pitcher_market_odds(game.pitcher_name,selected_date.isoformat())'
          if source.count(old_import) != 1 or source.count(old_call) != 1:
              raise SystemExit('Main Projection loader contract changed; refusing blind replacement.')
          source = source.replace(old_import, new_import).replace(old_call, new_call)
          app.write_text(source, encoding='utf-8')

          for name in (
              'tests/test_app_contract.py',
              'tests/test_odds_credit_saver.py',
              'tests/test_ui_command_center_contract.py',
          ):
              path = Path(name)
              text = path.read_text(encoding='utf-8')
              text = text.replace('load_pitcher_strikeout_odds', 'load_pitcher_market_odds')
              path.write_text(text, encoding='utf-8')

          contract = Path('tests/test_main_projection_sportsgameodds_lines.py')
          contract.write_text('''from pathlib import Path\n\n\ndef test_main_projection_reads_current_sportsgameodds_snapshot_for_all_markets():\n    source = Path("streamlit_app.py").read_text(encoding="utf-8")\n    assert "from engine.sportsgameodds import load_pitcher_market_odds" in source\n    assert "odds_rows=load_pitcher_market_odds(game.pitcher_name,selected_date.isoformat())" in source\n    assert "load_pitcher_strikeout_odds" not in source\n    assert 'market_recommendation(proj,odds_rows,"pitcher_strikeouts_alternate"' in source\n    assert 'market_recommendation(proj,odds_rows,"pitcher_outs_alternate"' in source\n    assert 'r.get("market") in {"pitcher_hits_allowed","pitcher_hits_allowed_alternate"}' in source\n\n\ndef test_main_projection_keeps_durable_legacy_archive_overlay_and_no_line_guard():\n    source = Path("streamlit_app.py").read_text(encoding="utf-8")\n    assert "overlay_manual_market_lines" in source\n    assert "active_strikeout_line" in source\n    assert "active_outs_line" in source\n    assert "active_hits_allowed_line" in source\n    assert "NO ACTIVE LINE" in source\n''', encoding='utf-8')
          PY

      - name: Remove one-shot workflow from final branch
        run: rm .github/workflows/main-projection-sgo-hotfix-once.yml

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Compile hotfix surface
        run: python -m compileall -q streamlit_app.py engine/sportsgameodds.py tests

      - name: Run focused sportsbook contracts
        run: |
          pytest -q \
            tests/test_main_projection_sportsgameodds_lines.py \
            tests/test_sportsgameodds.py \
            tests/test_app_contract.py \
            tests/test_odds_credit_saver.py \
            tests/test_ui_command_center_contract.py \
            tests/test_sportsgameodds_ui_cleanup.py

      - name: Commit hotfix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix Main Projection SportsGameOdds line loader'
          git push origin HEAD:fix/main-projection-sgo-lines
