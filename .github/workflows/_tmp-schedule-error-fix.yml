name: Temporary Schedule Error-State Fix

on:
  push:
    branches: [fix/schedule-error-state]

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Apply surgical schedule failure-state fix
        run: |
          python - <<'PY'
          from pathlib import Path

          app = Path("streamlit_app.py")
          source = app.read_text(encoding="utf-8")
          old = '''schedule,err=get_schedule(selected_date.isoformat())
          if err: st.error(err)
          if not schedule: st.warning("No announced probable pitchers are available for this date."); st.stop()
          '''
          new = '''schedule,err=get_schedule(selected_date.isoformat())
          if err:
              st.error(err)
              st.stop()
          if not schedule:
              st.warning("No announced probable pitchers are available for this date.")
              st.stop()
          '''
          if source.count(old) != 1:
              raise SystemExit(f"Expected exactly one schedule failure block; found {source.count(old)}")
          app.write_text(source.replace(old, new, 1), encoding="utf-8")

          tests = Path("tests/test_app_contract.py")
          test_source = tests.read_text(encoding="utf-8")
          test_name = "test_schedule_api_error_stops_before_empty_slate_warning"
          if test_name not in test_source:
              test_source += '''\n\ndef test_schedule_api_error_stops_before_empty_slate_warning():
              source = APP.read_text(encoding="utf-8")
              expected = (\n                  'schedule,err=get_schedule(selected_date.isoformat())\\n'\n                  'if err:\\n'\n                  '    st.error(err)\\n'\n                  '    st.stop()\\n'\n                  'if not schedule:\\n'\n                  '    st.warning("No announced probable pitchers are available for this date.")\\n'\n                  '    st.stop()'\n              )
              assert expected in source
          '''
              tests.write_text(test_source, encoding="utf-8")
          PY

      - name: Targeted validation
        run: |
          python -m compileall -q streamlit_app.py
          pytest -q tests/test_app_contract.py

      - name: Remove temporary scaffolding and persist only product/test changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -- .github/workflows/_tmp-schedule-error-fix.yml
          git add -- streamlit_app.py tests/test_app_contract.py
          git diff --cached --check
          git commit -m "Clarify schedule API failure state"
          git push origin HEAD:fix/schedule-error-state
