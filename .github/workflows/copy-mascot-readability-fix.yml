name: Copy Mascot Readability Fix

on:
  workflow_dispatch:
  push:
    branches:
      - ui-mascot-readability-clean
    paths:
      - .github/workflows/copy-mascot-readability-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui-mascot-readability-clean
          fetch-depth: 0
      - name: Copy validated files from fix branch
        run: |
          git fetch origin ui-main-projection-v2
          git show origin/ui-main-projection-v2:engine/ui_command_center.py > engine/ui_command_center.py
          git show origin/ui-main-projection-v2:tests/test_ui_command_center_contract.py > tests/test_ui_command_center_contract.py
          git show origin/ui-main-projection-v2:tests/test_command_center_readability.py > tests/test_command_center_readability.py
      - name: Compile copied fix
        run: python -m compileall -q engine streamlit_app.py tests
      - name: Commit clean copy and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add engine/ui_command_center.py tests/test_ui_command_center_contract.py tests/test_command_center_readability.py
          git rm .github/workflows/copy-mascot-readability-fix.yml
          git commit -m "Fix mascot rendering and small-text readability"
          git push origin HEAD:ui-mascot-readability-clean
