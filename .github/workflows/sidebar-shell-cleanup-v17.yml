name: Sidebar Shell Cleanup V17

on:
  push:
    paths:
      - '.github/workflows/sidebar-shell-cleanup-v17.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pytest
      - name: Apply sidebar shell cleanup
        run: python .github/scripts/sidebar_shell_cleanup_v17.py
      - name: Compile
        run: python -m compileall -q navigation.py streamlit_app.py engine pages tests
      - name: Full regression suite
        run: pytest -q
      - name: Commit verified presentation cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add navigation.py tests/test_ui_theme_contract.py
          git diff --cached --check
          git commit -m "Remove retired secondary sidebar shell"
          git restore .
          git clean -fd
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
