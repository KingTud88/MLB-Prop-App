name: temporary-card-explainability-refactor

on:
  push:
    branches:
      - ui/card-level-explainability-v2

permissions:
  contents: write

jobs:
  refactor:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/card-level-explainability-v2
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Apply refactor
        run: python automation/_card_explainability_refactor.py
      - name: Compile changed app and helpers
        run: python -m compileall -q streamlit_app.py engine/card_explainability.py tests/test_card_level_explainability.py
      - name: Run focused explainability tests
        run: pytest -q tests/test_card_level_explainability.py tests/test_app_contract.py tests/test_ui_command_center_contract.py
      - name: Remove temporary refactor files
        run: rm automation/_card_explainability_refactor.py .github/workflows/_card_explainability_refactor.yml
      - name: Commit refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Redesign Projection explainability as card-level details"
          git push origin HEAD:ui/card-level-explainability-v2
