name: Fix Projection History UI Quotes

on:
  push:
    branches:
      - ui-projection-history-cleanup
    paths:
      - .github/workflows/fix-history-quotes.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Escape History UI HTML strings
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('pages/4_Projection_History.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace('"<div class="history-hero"><strong>Performance archive · frozen pregame evidence</strong>"', "'<div class=\"history-hero\"><strong>Performance archive · frozen pregame evidence</strong>'")
          text = text.replace('"<span>Scoreboard first, K wins and crushers next, deeper learning diagnostics below.</span></div>"', "'<span>Scoreboard first, K wins and crushers next, deeper learning diagnostics below.</span></div>'")
          text = text.replace('st.markdown("<div class="history-kicker">Performance scoreboard</div>", unsafe_allow_html=True)', 'st.markdown(\'<div class="history-kicker">Performance scoreboard</div>\', unsafe_allow_html=True)')
          text = text.replace('st.markdown("<div class="history-kicker">Actionable K results</div>", unsafe_allow_html=True)', 'st.markdown(\'<div class="history-kicker">Actionable K results</div>\', unsafe_allow_html=True)')
          path.write_text(text, encoding='utf-8')
          compile(text, str(path), 'exec')
          PY
      - name: Commit fix and remove temporary workflow
        run: |
          rm .github/workflows/fix-history-quotes.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix Projection History UI quote escaping"
          git push origin HEAD:ui-projection-history-cleanup
