name: Run Projection weather batter patch

on:
  push:
    paths:
      - scripts/patch_projection_weather_batters.py
      - .github/projection-weather-trigger
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pytest
      - run: python scripts/patch_projection_weather_batters.py
      - run: python -m compileall -q streamlit_app.py engine tests
      - run: pytest -q
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add streamlit_app.py tests/test_weather_risk.py tests/test_projection_weather_batter_contract.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add weather delay badges and opposing batter box"
          git pull --rebase origin main
          git push origin HEAD:main
