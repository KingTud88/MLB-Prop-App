name: Lineup K Walk-Forward Validation

on:
  workflow_dispatch:
  push:
    branches:
      - lineup-k-walkforward
    paths:
      - training/lineup_k_walkforward.py
      - .github/workflows/lineup-k-walkforward.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt pytest
      - name: Existing quality suite
        run: pytest -q
      - name: Chronological K-only lineup validation
        run: python -m training.lineup_k_walkforward
      - name: Commit report-only evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/lineup_k_walkforward_detail.csv data/lineup_k_walkforward_summary.csv
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refresh lineup K walk-forward evidence"
          git push origin HEAD:lineup-k-walkforward
