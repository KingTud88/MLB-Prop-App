name: temp-bet-tracker-fragment

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: github.head_ref == 'fix/bet-tracker-delete-fragment'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Apply guarded fragment patch
        run: |
          if ! grep -q 'BET_TRACKER_FRAGMENT_WORKSPACE_V1' pages/2_Bet_Tracker.py; then
            python tools/patch_bet_tracker_fragment.py
          fi
      - name: Install and validate
        run: |
          pip install -r requirements.txt pytest
          python -m compileall -q pages/2_Bet_Tracker.py tests/test_bet_tracker_page_contract.py
          pytest -q --durations=20
      - name: Commit validated repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pages/2_Bet_Tracker.py tests/test_bet_tracker_page_contract.py
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
            exit 0
          fi
          git commit -m 'Scope Bet Tracker delete interactions to fragment'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
