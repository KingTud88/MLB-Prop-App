          success_anchor = '''        except ValueError as exc:
            _raise_safe_failure(
                service=service,
                host=host,
                method=method,
                status_code=status or None,
                detail=f"Invalid JSON: {exc}",
                cause=exc,
            )
        return response
'''
          success_replacement = '''        except ValueError as exc:
            _raise_safe_failure(
                service=service,
                host=host,
                method=method,
                status_code=status or None,
                detail=f"Invalid JSON: {exc}",
                cause=exc,
            )
        _record_success(host)
        return response
'''
          if source.count(success_anchor) != 1:
              raise SystemExit(f"success anchor count={source.count(success_anchor)}")
          source = source.replace(success_anchor, success_replacement, 1)
          runtime.write_text(source, encoding="utf-8")

