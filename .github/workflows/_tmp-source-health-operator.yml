name: Temporary Source Health Operator Patch

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Apply observability-only source-health patch
        run: |
          python - <<'PY'
          from pathlib import Path

          runtime = Path("runtime_http.py")
          source = runtime.read_text(encoding="utf-8")
          source = source.replace(
              "import logging\nimport time\n",
              "import logging\nimport time\nfrom datetime import datetime, timezone\nfrom threading import RLock\n",
              1,
          )
          anchor = "BACKOFF_SECONDS = (0.20, 0.40)\n\n\n@dataclass(frozen=True)\nclass ServiceFailure:"
          replacement = '''BACKOFF_SECONDS = (0.20, 0.40)

_SOURCE_HEALTH_LOCK = RLock()
_SOURCE_HEALTH = {
    host: {
        "service": service,
        "host": host,
        "status": "NOT CHECKED",
        "last_attempt_at_utc": None,
        "last_success_at_utc": None,
        "last_failure_at_utc": None,
    }
    for host, service in TRACKED_SERVICES.items()
}


def _utc_now() -> str:
    return datetime.now(timezone.utc).isoformat(timespec="seconds").replace("+00:00", "Z")


def _record_attempt(host: str) -> None:
    with _SOURCE_HEALTH_LOCK:
        if host in _SOURCE_HEALTH:
            _SOURCE_HEALTH[host]["last_attempt_at_utc"] = _utc_now()


def _record_success(host: str) -> None:
    now = _utc_now()
    with _SOURCE_HEALTH_LOCK:
        if host in _SOURCE_HEALTH:
            _SOURCE_HEALTH[host]["status"] = "OK"
            _SOURCE_HEALTH[host]["last_success_at_utc"] = now


def _record_failure(host: str) -> None:
    now = _utc_now()
    with _SOURCE_HEALTH_LOCK:
        if host in _SOURCE_HEALTH:
            _SOURCE_HEALTH[host]["status"] = "ERROR"
            _SOURCE_HEALTH[host]["last_failure_at_utc"] = now


def source_health_snapshot() -> list[dict[str, str | None]]:
    """Return a defensive, operator-only snapshot of tracked source health."""
    with _SOURCE_HEALTH_LOCK:
        return [dict(_SOURCE_HEALTH[host]) for host in TRACKED_SERVICES]


def _reset_source_health_for_tests() -> None:
    """Reset in-memory telemetry without changing request behavior."""
    with _SOURCE_HEALTH_LOCK:
        for host, service in TRACKED_SERVICES.items():
            _SOURCE_HEALTH[host] = {
                "service": service,
                "host": host,
                "status": "NOT CHECKED",
                "last_attempt_at_utc": None,
                "last_success_at_utc": None,
                "last_failure_at_utc": None,
            }


@dataclass(frozen=True)
class ServiceFailure:'''
          if source.count(anchor) != 1:
              raise SystemExit(f"runtime health anchor count={source.count(anchor)}")
          source = source.replace(anchor, replacement, 1)

          failure_anchor = '''    LOGGER.warning(
        "%s request failed host=%s method=%s status=%s detail=%s",'''
          failure_replacement = '''    _record_failure(host)
    LOGGER.warning(
        "%s request failed host=%s method=%s status=%s detail=%s",'''
          if source.count(failure_anchor) != 1:
              raise SystemExit(f"failure anchor count={source.count(failure_anchor)}")
          source = source.replace(failure_anchor, failure_replacement, 1)

          tracked_anchor = '''    host, service = tracked
    last_exception: BaseException | None = None

    for attempt in range(MAX_ATTEMPTS):'''
          tracked_replacement = '''    host, service = tracked
    last_exception: BaseException | None = None
    _record_attempt(host)

