          app_tests.write_text(app_test_source, encoding="utf-8")
          PY

      - name: Targeted validation
        run: |
          python -m compileall -q runtime_http.py streamlit_app.py
          pytest -q tests/test_runtime_http.py tests/test_app_contract.py

      - name: Remove temporary scaffolding and persist only telemetry/UI/tests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -- .github/workflows/_tmp-source-health-operator.yml
          git add -- runtime_http.py streamlit_app.py tests/test_runtime_http.py tests/test_app_contract.py
          git diff --cached --check
          git commit -m "Add source-health operator display"
          git push origin HEAD:polish/source-health-operator
