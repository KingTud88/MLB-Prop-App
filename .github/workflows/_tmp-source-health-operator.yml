    _reset_source_health_for_tests,
    request_with_resilience,
    source_health_snapshot,
)'''
          if tests.count(import_anchor) != 1:
              raise SystemExit(f"runtime test import anchor count={tests.count(import_anchor)}")
          tests = tests.replace(import_anchor, import_replacement, 1)
          test_name = "test_source_health_snapshot_is_observability_only_and_defensive"
          if test_name not in tests:
              tests += '''


def test_source_health_snapshot_is_observability_only_and_defensive():
    _reset_source_health_for_tests()
    initial = source_health_snapshot()
    assert [(row["service"], row["status"]) for row in initial] == [
        ("MLB data", "NOT CHECKED"),
        ("Weather data", "NOT CHECKED"),
    ]
    initial[0]["status"] = "MUTATED"
    assert source_health_snapshot()[0]["status"] == "NOT CHECKED"

    request_func, _ = scripted(FakeResponse(200, {"dates": []}))
    request_with_resilience(
        requests.Session(),
        "GET",
        "https://statsapi.mlb.com/api/v1/schedule",
        request_func=request_func,
        sleep=lambda _: None,
    )
    snapshot = source_health_snapshot()
    assert snapshot[0]["status"] == "OK"
    assert snapshot[0]["last_attempt_at_utc"]
    assert snapshot[0]["last_success_at_utc"]
    assert snapshot[0]["last_failure_at_utc"] is None
    assert snapshot[1]["status"] == "NOT CHECKED"


def test_source_health_records_final_failure_without_changing_safe_error():
    _reset_source_health_for_tests()
    request_func, _ = scripted(
        requests.ConnectionError("private one"),
        requests.ConnectionError("private two"),
        requests.ConnectionError("private three"),
    )
    with pytest.raises(ExternalServiceError) as exc_info:
        request_with_resilience(
            requests.Session(),
            "GET",
            "https://api.open-meteo.com/v1/forecast",
            request_func=request_func,
            sleep=lambda _: None,
        )
    assert str(exc_info.value) == "Weather data temporarily unavailable. Please try again."
    snapshot = source_health_snapshot()
    assert snapshot[0]["status"] == "NOT CHECKED"
    assert snapshot[1]["status"] == "ERROR"
    assert snapshot[1]["last_attempt_at_utc"]
    assert snapshot[1]["last_failure_at_utc"]
    assert snapshot[1]["last_success_at_utc"] is None


def test_untracked_requests_do_not_create_source_health_rows():
    _reset_source_health_for_tests()
    before = source_health_snapshot()
    request_func, _ = scripted(FakeResponse(200, {"ok": True}))
    request_with_resilience(
        requests.Session(),
        "GET",
        "https://example.com/api",
        request_func=request_func,
        sleep=lambda _: None,
    )
    assert source_health_snapshot() == before
'''
          runtime_tests.write_text(tests, encoding="utf-8")

          app = Path("streamlit_app.py")
          app_source = app.read_text(encoding="utf-8")
          import_anchor = "import streamlit as st\n\nfrom engine.ui_theme import apply_page_theme"
          import_replacement = "import streamlit as st\n\nfrom runtime_http import source_health_snapshot\nfrom engine.ui_theme import apply_page_theme"
          if app_source.count(import_anchor) != 1:
              raise SystemExit(f"app import anchor count={app_source.count(import_anchor)}")
          app_source = app_source.replace(import_anchor, import_replacement, 1)

          sidebar_anchor = '''with st.sidebar:
    render_sidebar_brand()
    _nav_options='''
          sidebar_replacement = '''def render_source_health(slot) -> None:
    rows = source_health_snapshot()
