name: Opponent Matchup Audit

on:
  workflow_dispatch:
  push:
    branches:
      - opponent-matchup-audit
    paths:
      - training/opponent_matchup_audit.py
      - .github/workflows/opponent-matchup-audit.yml

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt pytest
      - name: Existing quality suite
        run: pytest -q
      - name: Report-only opponent matchup audit
        run: python -m training.opponent_matchup_audit
      - name: Commit audit evidence to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/opponent_matchup_buckets.csv data/opponent_matchup_summary.csv
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refresh opponent matchup audit evidence"
          git push origin HEAD:opponent-matchup-audit
