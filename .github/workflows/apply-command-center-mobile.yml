name: Apply secondary-page mobile consistency

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-command-center-mobile.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: command-center-mobile-sweep
  cancel-in-progress: false

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Add deliberate phone and tablet reflow
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("engine/command_center_consistency.py")
          source = path.read_text(encoding="utf-8")
          marker = "/* COMMAND_CENTER_MOBILE_V2 · deliberate phone/tablet reflow */"
          if marker not in source:
              lines = [
                  "",
                  "        /* COMMAND_CENTER_MOBILE_V2 · deliberate phone/tablet reflow */",
                  "        @media (max-width:640px){",
                  "            .stApp [data-testid=\"stHorizontalBlock\"]{",
                  "                flex-wrap:wrap!important;",
                  "                gap:.55rem!important;",
                  "            }",
                  "            .stApp [data-testid=\"stHorizontalBlock\"] > [data-testid=\"stColumn\"]{",
                  "                width:100%!important;",
                  "                min-width:100%!important;",
                  "                flex:1 1 100%!important;",
                  "            }",
                  "            .stApp div[data-testid=\"stButton\"],",
                  "            .stApp div[data-testid=\"stDownloadButton\"]{width:100%!important}",
                  "            .stApp div[data-testid=\"stButton\"] button,",
                  "            .stApp div[data-testid=\"stDownloadButton\"] button{",
                  "                width:100%!important;",
                  "                min-height:2.95rem!important;",
                  "            }",
                  "            .stApp [data-testid=\"stForm\"]{padding:.72rem!important}",
                  "            .stApp .daily-run-status{",
                  "                align-items:flex-start!important;",
                  "                flex-direction:column!important;",
                  "                gap:.38rem!important;",
                  "            }",
                  "            .stApp .daily-run-status .meta{text-align:left!important}",
                  "            .stApp .bt-ticket-state .name,",
                  "            .stApp .tp-pitcher{overflow-wrap:anywhere!important}",
                  "            .stApp .bt-sub,",
                  "            .stApp .ph-command-sub,",
                  "            .stApp .daily-command-sub,",
                  "            .stApp .tp-page-sub{",
                  "                font-size:.84rem!important;",
                  "                line-height:1.43!important;",
                  "            }",
                  "            .stApp .history-primary-note,",
                  "            .stApp .daily-note{padding:.70rem .76rem!important}",
                  "            .stApp .tp-stat-grid{grid-template-columns:repeat(2,minmax(0,1fr))!important}",
                  "            .stApp div[data-testid=\"stExpander\"] summary{min-height:3.05rem!important}",
                  "        }",
                  "        @media (max-width:480px){",
                  "            .stApp .block-container{",
                  "                padding-left:.62rem!important;",
                  "                padding-right:.62rem!important;",
                  "            }",
                  "            .stApp .bt-hero,",
                  "            .stApp .ph-command-hero,",
                  "            .stApp .daily-command-hero,",
                  "            .stApp .tp-page-hero{",
                  "                padding:.72rem .74rem!important;",
                  "                margin-bottom:.66rem!important;",
                  "            }",
                  "            .stApp .bt-kicker,",
                  "            .stApp .ph-command-kicker,",
                  "            .stApp .daily-command-kicker,",
                  "            .stApp .tp-page-kicker{",
                  "                font-size:.62rem!important;",
                  "                letter-spacing:.095em!important;",
                  "            }",
                  "            .stApp .bt-title,",
                  "            .stApp .ph-command-title,",
                  "            .stApp .daily-command-title,",
                  "            .stApp .tp-page-title{",
                  "                font-size:2.28rem!important;",
                  "                line-height:.90!important;",
                  "            }",
                  "            .stApp .bt-rule,",
                  "            .stApp .ph-command-rule,",
                  "            .stApp .daily-command-rule,",
                  "            .stApp .tp-page-rule{",
                  "                width:100%!important;",
                  "                font-size:.58rem!important;",
                  "                line-height:1.35!important;",
                  "                letter-spacing:.045em!important;",
                  "                white-space:normal!important;",
                  "            }",
                  "            .stApp .bt-section,",
                  "            .stApp .history-section-head,",
                  "            .stApp .daily-section-head,",
                  "            .stApp .tp-section-ribbon{",
                  "                width:100%!important;",
                  "                min-width:0!important;",
                  "                max-width:100%!important;",
                  "                padding:.40rem .68rem!important;",
                  "            }",
                  "            .stApp [data-testid=\"stMetric\"]{min-height:92px!important}",
                  "            .stApp [data-testid=\"stMetricLabel\"]{font-size:.73rem!important}",
                  "            .stApp [data-testid=\"stMetricValue\"]{font-size:1.48rem!important}",
                  "            .stApp [data-testid=\"stCaptionContainer\"]{font-size:.76rem!important}",
                  "            .stApp .tp-stat-grid{grid-template-columns:1fr!important}",
                  "            .stApp .tp-market-row{gap:.28rem!important}",
                  "        }",
              ]
              mobile = "\n".join(lines) + "\n"
              anchor = "        </style>\n"
              if anchor not in source:
                  raise SystemExit("Shared style closing tag not found")
              source = source.replace(anchor, mobile + anchor, 1)
              path.write_text(source, encoding="utf-8")

          test_path = Path("tests/test_command_center_consistency.py")
          test_source = test_path.read_text(encoding="utf-8")
          if "test_secondary_pages_have_deliberate_mobile_reflow" not in test_source:
              test_lines = [
                  "",
                  "",
                  "def test_secondary_pages_have_deliberate_mobile_reflow():",
                  "    source = (ROOT / \"engine\" / \"command_center_consistency.py\").read_text(encoding=\"utf-8\")",
                  "    assert \"COMMAND_CENTER_MOBILE_V2\" in source",
                  "    assert \"@media (max-width:640px)\" in source",
                  "    assert \"@media (max-width:480px)\" in source",
                  "    assert 'flex:1 1 100%!important' in source",
                  "",
              ]
              test_path.write_text(test_source + "\n".join(test_lines), encoding="utf-8")
          PY

      - name: Syntax validation
        run: |
          python - <<'PY'
          from pathlib import Path
          for path in ["engine/command_center_consistency.py", "tests/test_command_center_consistency.py"]:
              compile(Path(path).read_text(encoding="utf-8"), path, "exec")
          print("syntax_ok")
          PY

      - name: Full regression suite
        run: pytest -q

      - name: Commit verified responsive changes
        run: |
          rm -rf .pytest_cache
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add engine/command_center_consistency.py tests/test_command_center_consistency.py
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No responsive changes to commit."
            exit 0
          fi
          git commit -m "Add responsive command-center parity"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
