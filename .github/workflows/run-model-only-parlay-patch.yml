name: Run model-only parlay patch

on:
  push:
    paths:
      - scripts/remove_sportsbook_gate_from_parlay.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python scripts/remove_sportsbook_gate_from_parlay.py
      - run: python -m compileall -q pages/6_Top_Plays.py engine tests
      - run: pytest -q
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages/6_Top_Plays.py engine/bet_tracker.py tests/test_bet_add_buttons_contract.py tests/test_bet_tracker.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Make parlay builder sportsbook independent"
          git pull --rebase origin main
          git push origin HEAD:main
