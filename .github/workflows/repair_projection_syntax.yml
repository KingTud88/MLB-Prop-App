name: Repair projection syntax

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Repair malformed probability expression
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("streamlit_app.py")
          s = p.read_text(encoding="utf-8")
          bad = "probs[0]+=.5*(1+math.erf((-0.5-mean)/(sd*math.sqrt(2)));"
          good = "probs[0]+=.5*(1+math.erf((-0.5-mean)/(sd*math.sqrt(2))));"
          if bad not in s:
              raise SystemExit("Malformed probability expression was not found")
          p.write_text(s.replace(bad, good, 1), encoding="utf-8")
          PY
          python -m py_compile streamlit_app.py
      - name: Commit repair and remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/repair_projection_syntax.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add streamlit_app.py .github/workflows/repair_projection_syntax.yml
          git commit -m "Fix projection math syntax error"
          git push
