name: Daily Projection Capture and Resolver

on:
  push:
    branches: [main]
  schedule:
    # Multiple pregame refreshes keep the durable archive in sync with late
    # probable-starter announcements. Existing (game_pk, pitcher_id) snapshots
    # are deduped by the runner, so these extra passes do not create duplicates.
    - cron: "15 13 * * *"
    - cron: "15 16 * * *"
    - cron: "15 18 * * *"
    - cron: "15 20 * * *"
    - cron: "15 22 * * *"
    - cron: "15 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-projection-resolver
  cancel-in-progress: false

jobs:
  projection-log:
    if: github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'Automate projection capture and game resolution')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Sync trigger snapshot to latest main
        run: |
          git fetch origin main
          git rebase origin/main

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Safety, lineage, calibration, ML-shadow, Top Plays, catcher-context, lineup, lineup-materiality, umpire, matchup, handedness-matchup, matchup-boost, boost-cap, reduce-stress, weak-reduce-shadow, and asymmetric-response contracts
        run: PYTHONPATH=. pytest -q tests/test_live_role_shadow_evidence.py tests/test_live_role_shadow_gate.py tests/test_daily_role_shadow.py tests/test_role_workload_gate.py tests/test_calibration_lineage.py tests/test_calibration_health.py tests/test_calibration_shadow_replay.py tests/test_calibration_shadow_gate.py tests/test_umpire_context.py tests/test_umpire_k_live_validation.py tests/test_ml_shadow_report.py tests/test_top_plays_postmortem.py tests/test_top_plays_postmortem_nulls.py tests/test_top_plays_accountability.py tests/test_catcher_context_capture.py tests/test_catcher_context_validation.py tests/test_lineup_k_walkforward.py tests/test_lineup_materiality_shadow.py tests/test_opponent_matchup_validation.py tests/test_handedness_matchup_capture.py tests/test_handedness_matchup_audit.py tests/test_opponent_matchup_boost_stress.py tests/test_opponent_matchup_boost_cap_shadow.py tests/test_opponent_matchup_reduce_stress.py tests/test_opponent_matchup_weak_reduce_neutral_shadow.py tests/test_opponent_matchup_asymmetric_response_shadow.py

      - name: Resolve completed projection rows
        run: PYTHONPATH=. python automation/resolve_projection_log.py

      - name: Capture today's projections and resolve finished games
        run: PYTHONPATH=. python automation/daily_projection_runner.py

      - name: Capture report-only pregame handedness matchup context
        run: PYTHONPATH=. python -m training.handedness_matchup_capture

      - name: Capture report-only catcher context
        run: PYTHONPATH=. python -m training.catcher_context_capture

      - name: Capture report-only pregame umpire context
        run: PYTHONPATH=. python automation/umpire_context_capture.py

      - name: Refresh resolved live role-shadow evidence
        run: PYTHONPATH=. python -m training.live_role_shadow_evidence

      - name: Evaluate live role-shadow activation gate
        run: PYTHONPATH=. python -m training.live_role_shadow_gate

      - name: Audit calibration lineage
        run: PYTHONPATH=. python -m training.calibration_lineage

      - name: Refresh lineage-safe calibration health
        run: PYTHONPATH=. python -m training.calibration_health

      - name: Refresh walk-forward calibration shadow replay
        run: PYTHONPATH=. python -m training.calibration_shadow_replay

      - name: Evaluate report-only calibration promotion gate
        run: PYTHONPATH=. python -m training.calibration_shadow_gate

      - name: Refresh report-only gradient-boosted K challenger
        run: PYTHONPATH=. python -m training.ml_shadow_report

      - name: Refresh report-only real-line Top Plays postmortem
        run: PYTHONPATH=. python -m training.top_plays_postmortem

      - name: Refresh report-only Top Plays accountability
        run: PYTHONPATH=. python -m training.top_plays_accountability

      - name: Refresh report-only catcher context walk-forward validation
        run: PYTHONPATH=. python -m training.catcher_context_validation

      - name: Refresh lineage-safe confirmed-lineup K walk-forward validation
        run: PYTHONPATH=. python -m training.lineup_k_walkforward

      - name: Refresh report-only frozen confirmed-lineup materiality shadow
        run: PYTHONPATH=. python -m training.lineup_materiality_shadow

      - name: Refresh lineage-safe live umpire K validation
        run: PYTHONPATH=. python -m training.umpire_k_live_validation

      - name: Refresh report-only opponent matchup ablation validation
        run: PYTHONPATH=. python -m training.opponent_matchup_validation

      - name: Refresh report-only handedness matchup audit
        run: PYTHONPATH=. python -m training.handedness_matchup_audit

      - name: Refresh report-only positive opponent matchup boost stress test
        run: PYTHONPATH=. python -m training.opponent_matchup_boost_stress

      - name: Refresh report-only suppressive opponent matchup robustness stress test
        run: PYTHONPATH=. python -m training.opponent_matchup_reduce_stress

      - name: Refresh report-only frozen weak-REDUCE neutralization shadow
        run: PYTHONPATH=. python -m training.opponent_matchup_weak_reduce_neutral_shadow

      - name: Refresh report-only frozen asymmetric opponent-response challenger
        run: PYTHONPATH=. python -m training.opponent_matchup_asymmetric_response_shadow

      - name: Refresh report-only frozen positive opponent boost-cap shadow
        run: PYTHONPATH=. python -m training.opponent_matchup_boost_cap_shadow

      - name: Commit updated projection, shadow, calibration, ML, Top Plays, catcher, lineup, lineup-materiality, umpire, matchup, handedness-matchup, matchup-boost, boost-cap, reduce-stress, weak-reduce-shadow, and asymmetric-response reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/projection_log.csv data/starter_observation_log.csv data/umpire_observation_log.csv data/live_role_shadow_detail.csv data/live_role_shadow_summary.csv data/live_role_shadow_gate.csv data/calibration_lineage_audit.csv data/calibration_health.csv data/calibration_shadow_detail.csv data/calibration_shadow_summary.csv data/calibration_shadow_gate.csv data/ml_shadow_detail.csv data/ml_shadow_summary.csv data/ml_shadow_live_candidates.csv data/ml_shadow_feature_manifest.csv data/top_plays_postmortem_detail.csv data/top_plays_postmortem_summary.csv data/top_plays_postmortem_daily.csv data/top_plays_postmortem_coverage.csv data/top_plays_accountability_summary.csv data/top_plays_accountability_findings.csv data/catcher_context_log.csv data/catcher_context_validation_detail.csv data/catcher_context_validation_summary.csv data/catcher_context_validation_gate.csv data/lineup_k_walkforward_detail.csv data/lineup_k_walkforward_summary.csv data/lineup_k_walkforward_segments.csv data/lineup_k_walkforward_gate.csv data/lineup_materiality_shadow_detail.csv data/lineup_materiality_shadow_summary.csv data/lineup_materiality_shadow_gate.csv data/umpire_k_live_validation_detail.csv data/umpire_k_live_validation_summary.csv data/umpire_k_live_validation_segments.csv data/umpire_k_live_validation_gate.csv data/opponent_matchup_validation_detail.csv data/opponent_matchup_validation_summary.csv data/opponent_matchup_validation_segments.csv data/opponent_matchup_validation_gate.csv data/handedness_matchup_context_log.csv data/handedness_matchup_audit_detail.csv data/handedness_matchup_audit_segments.csv data/handedness_matchup_audit_gate.csv data/opponent_matchup_boost_stress_detail.csv data/opponent_matchup_boost_stress_summary.csv data/opponent_matchup_boost_stress_segments.csv data/opponent_matchup_boost_stress_gate.csv data/opponent_matchup_reduce_stress_detail.csv data/opponent_matchup_reduce_stress_summary.csv data/opponent_matchup_reduce_stress_segments.csv data/opponent_matchup_reduce_stress_gate.csv data/opponent_matchup_weak_reduce_neutral_shadow_detail.csv data/opponent_matchup_weak_reduce_neutral_shadow_summary.csv data/opponent_matchup_asymmetric_response_shadow_detail.csv data/opponent_matchup_asymmetric_response_shadow_summary.csv data/opponent_matchup_asymmetric_response_shadow_segments.csv data/opponent_matchup_asymmetric_response_shadow_gate.csv data/opponent_matchup_boost_cap_shadow_detail.csv data/opponent_matchup_boost_cap_shadow_summary.csv
          if git diff --cached --quiet; then
            echo "No projection/history/shadow/calibration/ML/Top-Plays/catcher/lineup/lineup-materiality/umpire/matchup/handedness-matchup/matchup-boost/boost-cap/reduce-stress/weak-reduce-shadow/asymmetric-response report changes to commit."
            exit 0
          fi

          git commit -m "Automate projection capture and game resolution"

          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main; then
              if git push origin HEAD:main; then
                exit 0
              fi
            else
              git rebase --abort || true
              echo "Rebase conflict while updating projection/history logs; refusing to overwrite main."
              exit 1
            fi
            echo "Push race on attempt ${attempt}; retrying against latest main."
            sleep $((attempt * 2))
          done

          echo "Projection/history-log push failed after 3 attempts."
          exit 1

  research-context-readiness:
    needs: projection-log
    if: needs.projection-log.result == 'success'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Sync to current main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Refresh and persist report-only research context
        run: bash automation/research_context_readiness.sh
