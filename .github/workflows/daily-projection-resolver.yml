name: Daily Projection Capture and Resolver

on:
  push:
    branches: [main]
  schedule:
    - cron: "15 13 * * *"
    - cron: "15 20 * * *"
    - cron: "15 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-projection-resolver
  cancel-in-progress: false

jobs:
  projection-log:
    if: github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'Automate projection capture and game resolution')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Live shadow evidence contracts
        run: PYTHONPATH=. pytest -q tests/test_live_role_shadow_evidence.py tests/test_live_role_shadow_gate.py tests/test_daily_role_shadow.py tests/test_role_workload_gate.py

      - name: Resolve completed projection rows
        run: PYTHONPATH=. python automation/resolve_projection_log.py

      - name: Capture today's projections and resolve finished games
        run: PYTHONPATH=. python automation/daily_projection_runner.py

      - name: Refresh resolved live role-shadow evidence
        run: PYTHONPATH=. python -m training.live_role_shadow_evidence

      - name: Evaluate live role-shadow activation gate
        run: PYTHONPATH=. python -m training.live_role_shadow_gate

      - name: Commit updated projection, observation, and shadow-evidence logs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/projection_log.csv data/starter_observation_log.csv data/live_role_shadow_detail.csv data/live_role_shadow_summary.csv data/live_role_shadow_gate.csv
          if git diff --cached --quiet; then
            echo "No projection/history/shadow-evidence changes to commit."
            exit 0
          fi

          git commit -m "Automate projection capture and game resolution"

          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main; then
              if git push origin HEAD:main; then
                exit 0
              fi
            else
              git rebase --abort || true
              echo "Rebase conflict while updating projection/history logs; refusing to overwrite main."
              exit 1
            fi
            echo "Push race on attempt ${attempt}; retrying against latest main."
            sleep $((attempt * 2))
          done

          echo "Projection/history-log push failed after 3 attempts."
          exit 1
