name: Daily Projection Capture and Resolver

on:
  push:
    branches: [main]
  schedule:
    - cron: "15 13 * * *"
    - cron: "15 20 * * *"
    - cron: "15 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-projection-resolver
  cancel-in-progress: false

jobs:
  projection-log:
    if: github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'Automate projection capture and game resolution')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas requests

      - name: Capture today's projections and resolve finished games
        run: PYTHONPATH=. python automation/daily_projection_runner.py

      - name: Commit updated projection log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/projection_log.csv
          if git diff --cached --quiet; then
            echo "No projection-log changes to commit."
          else
            git commit -m "Automate projection capture and game resolution"
            git push
          fi
