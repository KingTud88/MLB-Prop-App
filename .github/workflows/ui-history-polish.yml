name: Apply Projection History UI Polish

on:
  push:
    branches:
      - ui-projection-history-cleanup
    paths:
      - automation/ui_history_polish.py
      - .github/workflows/ui-history-polish.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply surgical History UI patch
        run: python automation/ui_history_polish.py
      - name: Commit generated page polish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages/4_Projection_History.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Polish Projection History hierarchy"
          git push origin HEAD:ui-projection-history-cleanup
