name: Apply Top Plays Layout

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - scripts/fix_bet_save.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply Top Plays cleanup
        run: python scripts/fix_bet_save.py
      - name: Validate
        run: |
          python -m compileall -q pages/6_Top_Plays.py navigation.py
          grep -q 'Top Play actions' pages/6_Top_Plays.py
          grep -q 'Model diagnostics' pages/6_Top_Plays.py
          grep -q 'MASCOT_PATH' navigation.py
          if grep -q "Today's five highest-probability model legs" pages/6_Top_Plays.py; then
            echo "Duplicate Top Plays table still present"
            exit 1
          fi
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages/6_Top_Plays.py navigation.py
          if git diff --cached --quiet; then
            echo "No Top Plays cleanup changes needed."
            exit 0
          fi
          git commit -m "Simplify Top Plays page"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
