name: Apply Top Plays Layout

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - scripts/fix_bet_save.py
      - .github/workflows/apply-bet-save-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply approved Top Plays layout
        run: python scripts/fix_bet_save.py
      - name: Validate
        run: |
          python -m compileall -q pages/6_Top_Plays.py
          grep -q 'styled_view = view.style.set_properties' pages/6_Top_Plays.py
          grep -q 'Decision Evidence' pages/6_Top_Plays.py
          grep -q 'Tier Hit Rate' pages/6_Top_Plays.py
          grep -q 'pd.isna(weather_raw)' pages/6_Top_Plays.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages/6_Top_Plays.py
          if git diff --cached --quiet; then
            echo "No Top Plays UI changes needed."
            exit 0
          fi
          git commit -m "Match Top Plays approved layout"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
