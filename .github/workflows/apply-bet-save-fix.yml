name: Apply Bet Tracker Tickets

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - scripts/fix_bet_save.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply Bet Tracker ticket UI
        run: python scripts/fix_bet_save.py
      - name: Validate
        run: |
          python -m compileall -q pages/2_Bet_Tracker.py engine/bet_tracker.py
          grep -q 'BET_TRACKER_TICKET_CARDS_V1' pages/2_Bet_Tracker.py
          grep -q 'Open any ticket to see each pitcher leg' pages/2_Bet_Tracker.py
          grep -q 'st.progress(_progress_value(actual, line))' pages/2_Bet_Tracker.py
          grep -q '"_Legs": leg_details' pages/2_Bet_Tracker.py
          grep -q 'LIVE AHEAD' engine/bet_tracker.py
          grep -q 'LIVE BEHIND' engine/bet_tracker.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages/2_Bet_Tracker.py
          if git diff --cached --quiet; then
            echo "No Bet Tracker ticket changes needed."
            exit 0
          fi
          git commit -m "Add live Bet Tracker ticket progress"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
