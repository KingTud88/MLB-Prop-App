name: temporary-info-emblem-polish

on:
  push:
    branches:
      - ui/info-emblem-polish-v3

permissions:
  contents: write

jobs:
  polish:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/info-emblem-polish-v3
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Apply UI polish
        run: python automation/_info_emblem_polish.py
      - name: Compile changed files
        run: python -m compileall -q streamlit_app.py engine/card_explainability.py tests/test_info_emblem_polish.py
      - name: Run focused UI contracts
        run: pytest -q tests/test_info_emblem_polish.py tests/test_card_level_explainability.py tests/test_ui_command_center_contract.py tests/test_explainability_ui.py
      - name: Remove temporary refactor files
        run: rm automation/_info_emblem_polish.py .github/workflows/_info_emblem_polish.yml
      - name: Commit polish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Polish Projection info controls and emblems"
          git push origin HEAD:ui/info-emblem-polish-v3
