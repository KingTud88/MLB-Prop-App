name: temp-emblem-render-hotfix

on:
  push:
    branches:
      - hotfix/emblem-sprite-render

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/emblem-sprite-render
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply targeted UI fix
        run: python automation/_temp_fix_emblem_render.py
      - name: Compile changed Python
        run: python -m compileall -q streamlit_app.py engine/card_explainability.py tests/test_info_emblem_polish.py
      - name: Commit hotfix and remove temporary scaffolding
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm automation/_temp_fix_emblem_render.py .github/workflows/_temp_emblem_render_hotfix.yml
          git add streamlit_app.py engine/card_explainability.py tests/test_info_emblem_polish.py
          git commit -m "Fix enlarged projection emblem rendering"
          git push origin HEAD:hotfix/emblem-sprite-render
