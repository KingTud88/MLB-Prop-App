name: Opponent Asymmetric Response Shadow Report

on:
  push:
    branches: [agent/opponent-asymmetric-response-challenger]

permissions:
  contents: write

jobs:
  report:
    if: github.event.head_commit.message != 'Run asymmetric opponent response shadow report'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pytest
      - name: Validate asymmetric shadow contracts
        run: PYTHONPATH=. pytest -q tests/test_opponent_matchup_asymmetric_response_shadow.py
      - name: Generate report-only asymmetric opponent response evidence
        run: PYTHONPATH=. python -m training.opponent_matchup_asymmetric_response_shadow
      - name: Commit report outputs to isolated branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/opponent_matchup_asymmetric_response_shadow_detail.csv data/opponent_matchup_asymmetric_response_shadow_summary.csv data/opponent_matchup_asymmetric_response_shadow_segments.csv data/opponent_matchup_asymmetric_response_shadow_gate.csv
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Run asymmetric opponent response shadow report"
          git push origin HEAD:agent/opponent-asymmetric-response-challenger
