name: Run projection bet actions

on:
  push:
    paths:
      - scripts/patch_projection_bet_actions.py
      - .github/workflows/run-projection-bet-actions.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pytest
      - name: Apply projection bet action patch
        run: python scripts/patch_projection_bet_actions.py
      - name: Compile
        run: python -m compileall -q streamlit_app.py navigation.py pages engine automation tests
      - name: Test
        run: pytest -q
      - name: Commit projection bet actions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add streamlit_app.py engine/bet_tracker.py tests/test_bet_tracker.py tests/test_bet_add_buttons_contract.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Make Projection bet actions model-first"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort || true
            sleep $((attempt * 2))
          done
          exit 1
