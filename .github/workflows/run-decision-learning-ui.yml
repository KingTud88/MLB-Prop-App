name: Run decision learning UI patch

on:
  push:
    paths:
      - scripts/patch_decision_learning_ui.py
      - scripts/patch_decision_learning_contract.py
      - .github/workflows/run-decision-learning-ui.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pytest
      - name: Apply decision learning UI patch
        run: |
          python scripts/patch_decision_learning_ui.py
          python scripts/patch_decision_learning_contract.py
      - name: Compile
        run: python -m compileall -q streamlit_app.py navigation.py pages engine automation tests
      - name: Test
        run: pytest -q
      - name: Commit feature
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages/4_Projection_History.py pages/6_Top_Plays.py tests/test_decision_learning_ui.py tests/test_walk_forward_health_ui.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add decision learning evidence to Top Plays"
          git pull --rebase origin main
          git push origin HEAD:main
