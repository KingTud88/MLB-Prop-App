name: Apply Top Plays detail fix

on:
  push:
    branches: [main]
    paths:
      - scripts/fix_top_play_details.py
      - .github/workflows/apply-top-play-details-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply Top Plays detail fix
        run: python scripts/fix_top_play_details.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages/6_Top_Plays.py
          if git diff --cached --quiet; then
            echo "No changes needed."
          else
            git commit -m "Make Top Plays details reliable"
            for attempt in 1 2 3; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then exit 0; fi
              sleep $((attempt * 2))
            done
            exit 1
          fi
