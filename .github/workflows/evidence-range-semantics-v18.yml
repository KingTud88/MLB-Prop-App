name: Evidence Range Semantics V18

on:
  push:
    paths:
      - '.github/workflows/evidence-range-semantics-v18.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pytest
      - name: Apply evidence range semantics fix
        run: python .github/scripts/evidence_range_semantics_v18.py
      - name: Refresh intentional evidence UI contracts
        run: python .github/scripts/evidence_range_semantics_v18_contract_fix.py
      - name: Compile changed Python
        run: python -m compileall -q pages engine tests
      - name: Targeted evidence semantics tests
        run: pytest -q tests/test_sidebar_metric_explainability_v2.py tests/test_hits_allowed_ui_contract.py tests/test_projection_history_learning_dashboard.py
      - name: Full regression suite
        run: pytest -q
      - name: Commit verified semantics fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages/4_Projection_History.py engine/explainability_ui.py tests/test_sidebar_metric_explainability_v2.py tests/test_hits_allowed_ui_contract.py tests/test_projection_history_learning_dashboard.py
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No product changes to commit."
            exit 0
          fi
          git commit -m "Clarify evidence range coverage versus bet grading"
          git restore .
          git clean -fd
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
