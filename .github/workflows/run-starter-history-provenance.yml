name: Run starter history provenance patch

on:
  push:
    paths:
      - scripts/patch_starter_history_provenance.py
      - .github/workflows/run-starter-history-provenance.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pytest
      - name: Apply starter history provenance patch
        run: python scripts/patch_starter_history_provenance.py
      - name: Compile
        run: python -m compileall -q streamlit_app.py pages engine automation tests
      - name: Test
        run: pytest -q
      - name: Commit feature
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add automation/daily_projection_runner.py pages/5_Daily_Projection_Run.py pages/4_Projection_History.py tests/test_starter_observations.py tests/test_daily_history_ui.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Track starter history provenance"
          git pull --rebase origin main
          git push origin HEAD:main
