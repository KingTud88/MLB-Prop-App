name: Upgrade engine 3.1

on:
  push:
    paths:
      - .upgrade_engine_3_1
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upgrade:
    if: ${{ hashFiles('.upgrade_engine_3_1') != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply engine integration
        run: python scripts/upgrade_engine_3_1.py
      - name: Validate syntax
        run: python -m py_compile streamlit_app.py engine/projection_engine.py engine/calibration.py
      - name: Commit upgrade
        run: |
          rm -f .upgrade_engine_3_1
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add streamlit_app.py
          git add engine/projection_engine.py engine/calibration.py
          git add .upgrade_engine_3_1
          git commit -m 'Integrate independent simulation math and calibration' || exit 0
          git push
