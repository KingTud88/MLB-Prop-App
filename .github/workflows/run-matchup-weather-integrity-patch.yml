name: Run matchup weather integrity patch

on:
  push:
    paths:
      - scripts/patch_matchup_weather_integrity.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pytest
      - run: python scripts/patch_matchup_weather_integrity.py
      - run: python -m compileall -q streamlit_app.py engine automation tests
      - run: pytest -q
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add streamlit_app.py engine/projection_engine.py automation/daily_projection_runner.py tests/test_matchup_weather_integrity.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Preserve explicit batter matchup and refresh weather risk"
          git pull --rebase origin main
          git push origin HEAD:main
