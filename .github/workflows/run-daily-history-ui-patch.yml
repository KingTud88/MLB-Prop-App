name: Run Daily history UI patch

on:
  push:
    paths:
      - scripts/patch_daily_history_ui.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pytest
      - run: python scripts/patch_daily_history_ui.py
      - run: python -m compileall -q pages tests
      - run: pytest -q
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages/5_Daily_Projection_Run.py tests/test_daily_history_ui.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Separate history-only starters from Daily errors"
          git pull --rebase origin main
          git push origin HEAD:main
