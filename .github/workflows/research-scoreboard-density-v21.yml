name: Research Scoreboard Density V21

on:
  push:
    branches: [main]
    paths:
      - ".github/scripts/research_scoreboard_density_patch.py"
      - ".github/workflows/research-scoreboard-density-v21.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: research-scoreboard-density-v21
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Apply density polish
        run: python .github/scripts/research_scoreboard_density_patch.py

      - name: Compile
        run: python -m compileall -q engine/research_promotion_scoreboard.py pages/4_Projection_History.py tests/test_research_promotion_scoreboard_ui_contract.py

      - name: Targeted scoreboard contracts
        run: PYTHONPATH=. pytest -q tests/test_research_promotion_scoreboard.py tests/test_research_promotion_scoreboard_ui_contract.py

      - name: Full regression suite
        run: PYTHONPATH=. pytest -q

      - name: Commit verified product files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add engine/research_promotion_scoreboard.py tests/test_research_promotion_scoreboard_ui_contract.py
          if git diff --cached --quiet; then
            echo "No scoreboard density changes to commit."
            exit 0
          fi
          git commit -m "Tighten research promotion scoreboard cards"
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main; then
              if git push origin HEAD:main; then
                exit 0
              fi
            else
              git rebase --abort || true
              echo "Rebase conflict while publishing scoreboard density polish."
              exit 1
            fi
            sleep $((attempt * 2))
          done
          echo "Scoreboard density push failed after 3 attempts."
          exit 1
