name: Historical Backtest

on:
  workflow_dispatch:
    inputs:
      start:
        description: "Historical start date (YYYY-MM-DD)"
        required: true
        default: "2025-04-01"
      end:
        description: "Historical end date (YYYY-MM-DD)"
        required: true
        default: "2025-05-31"
      min_train:
        description: "Minimum resolved snapshots before first test fold"
        required: true
        default: "100"

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scikit-learn requests pyarrow

      - name: Build historical snapshots
        run: |
          python -m training.build_historical_dataset \
            --start "${{ inputs.start }}" \
            --end "${{ inputs.end }}" \
            --output data/historical_snapshots.csv

      - name: Run walk-forward backtest
        run: |
          python -m training.run_backtest \
            data/historical_snapshots.csv \
            --min-train "${{ inputs.min_train }}" \
            --test-size 50 \
            --output artifacts/backtest.csv

      - name: Upload dataset and metrics
        uses: actions/upload-artifact@v4
        with:
          name: historical-backtest-${{ inputs.start }}-${{ inputs.end }}
          path: |
            data/historical_snapshots.csv
            artifacts/backtest.csv
            artifacts/backtest.json
          if-no-files-found: error
