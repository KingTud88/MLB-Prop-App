name: rebuild-projection-emblems-main-once

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: pip install pillow

      - name: Build clean high-res emblem branch
        run: |
          git switch -C ui/highres-projection-emblems-v14 origin/main
          python - <<'PY'
          from pathlib import Path
          import base64
          import io
          from PIL import Image

          assets = Path('assets')
          master_path = assets / 'projection_summary_emblems_v2.webp'
          encoded = ''.join(master_path.read_text(encoding='utf-8').split())
          decoded = base64.b64decode(encoded, validate=True)
          master = Image.open(io.BytesIO(decoded)).convert('RGBA')
          assert master.size == (768, 128), f'Unexpected master size: {master.size}'

          names = [
              'projection_k.webp',
              'projection_k_plus.webp',
              'projection_outs.webp',
              'projection_outs_plus.webp',
              'projection_hits.webp',
              'projection_hits_plus.webp',
          ]
          for idx, name in enumerate(names):
              tile = master.crop((idx * 128, 0, (idx + 1) * 128, 128))
              out = assets / name
              tile.save(out, format='WEBP', lossless=True, quality=100, method=6)
              with Image.open(out) as verify:
                  assert verify.size == (128, 128), (name, verify.size)
              print(name, out.stat().st_size)

          app = Path('streamlit_app.py')
          text = app.read_text(encoding='utf-8')
          text = text.replace(
              'PROJECTION_EMBLEM_RECOVERY_V13 · reliable individual approved assets, larger footprint',
              'PROJECTION_EMBLEM_HIGHRES_V14 · true 128px individual approved assets',
          )
          for stem in names:
              text = text.replace(f'{stem}?v=13', f'{stem}?v=14')
          text = text.replace('padding-right:142px!important', 'padding-right:146px!important')
          text = text.replace(
              'width:120px!important;\n    height:120px!important;\n    min-width:120px!important;\n    flex:0 0 120px!important;\n    background-size:116px 116px!important',
              'width:124px!important;\n    height:124px!important;\n    min-width:124px!important;\n    flex:0 0 124px!important;\n    background-size:120px 120px!important',
          )
          app.write_text(text, encoding='utf-8')

          test_path = Path('tests/test_info_emblem_polish.py')
          test_text = test_path.read_text(encoding='utf-8')
          test_text = test_text.replace('PROJECTION_EMBLEM_RECOVERY_V13', 'PROJECTION_EMBLEM_HIGHRES_V14')
          test_text = test_text.replace('width:120px!important', 'width:124px!important')
          test_text = test_text.replace('height:120px!important', 'height:124px!important')
          test_text = test_text.replace('background-size:116px 116px!important', 'background-size:120px 120px!important')
          test_text = test_text.replace('?v=13', '?v=14')
          if 'test_projection_emblem_assets_are_true_128px' not in test_text:
              test_text += '''\n\ndef test_projection_emblem_assets_are_true_128px():\n    from PIL import Image\n\n    for name in (\n        "projection_k.webp",\n        "projection_k_plus.webp",\n        "projection_outs.webp",\n        "projection_outs_plus.webp",\n        "projection_hits.webp",\n        "projection_hits_plus.webp",\n    ):\n        with Image.open(Path("assets") / name) as img:\n            assert img.size == (128, 128), f"{name} was {img.size}"\n'''
          test_path.write_text(test_text, encoding='utf-8')
          PY

          rm .github/workflows/rebuild_projection_emblems_main_once.yml
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          for name in (
              'projection_k.webp','projection_k_plus.webp','projection_outs.webp',
              'projection_outs_plus.webp','projection_hits.webp','projection_hits_plus.webp'
          ):
              with Image.open(Path('assets') / name) as img:
                  assert img.size == (128, 128), (name, img.size)
          source = Path('streamlit_app.py').read_text(encoding='utf-8')
          assert 'PROJECTION_EMBLEM_HIGHRES_V14' in source
          assert 'background-size:120px 120px!important' in source
          assert '?v=14' in source
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/projection_k.webp assets/projection_k_plus.webp assets/projection_outs.webp assets/projection_outs_plus.webp assets/projection_hits.webp assets/projection_hits_plus.webp streamlit_app.py tests/test_info_emblem_polish.py .github/workflows/rebuild_projection_emblems_main_once.yml
          git commit -m "Rebuild Projection emblems from 128px master"
          git push --force origin HEAD:ui/highres-projection-emblems-v14
