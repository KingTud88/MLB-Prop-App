name: Environment Effect Audit

on:
  workflow_dispatch:
  push:
    branches:
      - environment-coverage-audit
    paths:
      - training/environment_effect_audit.py
      - .github/workflows/environment-effect-audit.yml

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt pytest
      - name: Existing quality suite
        run: pytest -q
      - name: Report-only environment effect audit
        run: python -m training.environment_effect_audit
      - name: Commit evidence to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/environment_effect_summary.csv
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refresh environment effect evidence"
          git push origin HEAD:environment-coverage-audit
