name: Starter Role Candidate Validation

on:
  workflow_dispatch:
  push:
    paths:
      - training/starter_role_candidate.py
      - tests/test_starter_role_candidate.py
      - .github/workflows/starter-role-candidate-validation.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pytest
      - name: Leakage and role candidate contracts
        run: pytest -q tests/test_starter_role_candidate.py tests/test_starter_role.py tests/test_workload_context.py tests/test_starter_history.py
      - name: Three-season chronological role candidate replay
        run: python -m training.starter_role_candidate --seasons 2024 2025 2026
      - name: Commit candidate report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/starter_role_candidate_summary.csv
          if git diff --cached --quiet; then
            echo "No starter-role candidate report changes"
            exit 0
          fi
          git commit -m "Refresh starter role candidate validation"
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
