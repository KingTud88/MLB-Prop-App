name: Apply Bet Tracker route

on:
  push:
    branches: [main]
    paths:
      - scripts/route_bet_tracker.py
      - .github/workflows/apply-bet-tracker-route.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Route Bet Tracker
        run: python scripts/route_bet_tracker.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add streamlit_app.py
          if git diff --cached --quiet; then
            echo "No changes needed."
          else
            git commit -m "Route main Bet Tracker to ledger page"
            for attempt in 1 2 3; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then exit 0; fi
              sleep $((attempt * 2))
            done
            exit 1
          fi
