name: Run verified project audit fixes

on:
  push:
    paths:
      - ".github/workflows/run-project-audit-fixes.yml"

permissions:
  contents: write

jobs:
  apply-verify-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
      - name: Reuse audit patcher with repaired assertion
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/project-audit-cleanup.yml').read_text(encoding='utf-8').splitlines()
          start = next(i for i, line in enumerate(workflow) if "python - <<'PY'" in line) + 1
          end = next(i for i in range(start, len(workflow)) if workflow[i].strip() == 'PY')
          script_lines = []
          for line in workflow[start:end]:
              script_lines.append(line[10:] if line.startswith('          ') else line)

          for index, line in enumerate(script_lines):
              if 'tradable=side in' in line and 'assert' in line:
                  prefix = line.split('assert', 1)[0]
                  script_lines[index] = prefix + '''assert 'tradable=side in {"OVER","UNDER"} and not no_line' in source'''
                  break
          else:
              raise SystemExit('Audit assertion repair target not found')

          script = '\n'.join(script_lines) + '\n'
          exec(compile(script, 'project-audit-cleanup-extracted.py', 'exec'), {'__name__': '__main__'})
          PY
      - name: Restore workflow directory for connector-managed cleanup
        run: git checkout HEAD -- .github/workflows
      - name: Compile
        run: python -m compileall -q streamlit_app.py navigation.py engine automation tests
      - name: Test
        run: pytest -q
      - name: Commit verified non-workflow fixes
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Restore project guardrails and clean stale patch assets"
          git push
