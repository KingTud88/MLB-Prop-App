name: Apply parlay and Top Plays fallback

on:
  push:
    branches: [main]
    paths:
      - scripts/add_parlay_and_top_candidates.py
      - .github/workflows/apply-parlay-top-candidates.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply parlay and Top Plays fallback
        run: python scripts/add_parlay_and_top_candidates.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages/6_Top_Plays.py pages/2_Bet_Tracker.py
          if git diff --cached --quiet; then
            echo "No changes needed."
          else
            git commit -m "Add parlay builder and Top Plays fallback board"
            for attempt in 1 2 3; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then exit 0; fi
              sleep $((attempt * 2))
            done
            exit 1
          fi
