name: Opponent Weak Reduce Neutral Shadow Report

on:
  push:
    branches: [agent/opponent-weak-reduce-neutral-shadow]

permissions:
  contents: write

jobs:
  report:
    if: github.event.head_commit.message != 'Run weak-reduce neutralization shadow report'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Generate report-only weak-reduce neutralization shadow
        run: PYTHONPATH=. python -m training.opponent_matchup_weak_reduce_neutral_shadow
      - name: Commit report outputs to isolated branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/opponent_matchup_weak_reduce_neutral_shadow_detail.csv data/opponent_matchup_weak_reduce_neutral_shadow_summary.csv
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Run weak-reduce neutralization shadow report"
          git push origin HEAD:agent/opponent-weak-reduce-neutral-shadow
