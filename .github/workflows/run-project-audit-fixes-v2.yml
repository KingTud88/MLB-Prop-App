name: Run audit fixes v2

on:
  push:
    paths:
      - ".github/workflows/run-project-audit-fixes-v2.yml"

permissions:
  contents: write

jobs:
  apply-verify-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
      - name: Reuse original audit patcher
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/project-audit-cleanup.yml').read_text(encoding='utf-8').splitlines()
          start = next(i for i, line in enumerate(workflow) if "python - <<'PY'" in line) + 1
          end = next(i for i in range(start, len(workflow)) if workflow[i].strip() == 'PY')
          script_lines = [line[10:] if line.startswith('          ') else line for line in workflow[start:end]]
          script = '\n'.join(script_lines) + '\n'
          exec(compile(script, 'project-audit-cleanup-extracted.py', 'exec'), {'__name__': '__main__'})
          PY
      - name: Repair generated test assertion
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/test_bet_add_buttons_contract.py')
          lines = path.read_text(encoding='utf-8').splitlines()
          changed = False
          for index, line in enumerate(lines):
              if 'tradable=side in' in line and 'assert' in line:
                  indent = line[:len(line) - len(line.lstrip())]
                  lines[index] = indent + '''assert 'tradable=side in {"OVER","UNDER"} and not no_line' in source'''
                  changed = True
                  break
          if not changed:
              raise SystemExit('Generated test assertion target not found')
          path.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
      - name: Restore workflow directory for connector-managed cleanup
        run: git checkout HEAD -- .github/workflows
      - name: Compile
        run: python -m compileall -q streamlit_app.py navigation.py engine automation tests
      - name: Test
        run: pytest -q
      - name: Commit verified non-workflow fixes
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Restore project guardrails and clean stale patch assets"
          git push
