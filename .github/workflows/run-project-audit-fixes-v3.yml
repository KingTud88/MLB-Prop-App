name: Run audit fixes v3

on:
  push:
    paths:
      - ".github/workflows/run-project-audit-fixes-v3.yml"

permissions:
  contents: write

jobs:
  apply-verify-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
      - name: Apply original audit patcher
        run: |
          python - <<'PY'
          from pathlib import Path
          workflow = Path('.github/workflows/project-audit-cleanup.yml').read_text(encoding='utf-8').splitlines()
          start = next(i for i, line in enumerate(workflow) if "python - <<'PY'" in line) + 1
          end = next(i for i in range(start, len(workflow)) if workflow[i].strip() == 'PY')
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in workflow[start:end]) + '\n'
          exec(compile(script, 'project-audit-cleanup-extracted.py', 'exec'), {'__name__': '__main__'})
          PY
      - name: Repair syntax and intentional contracts
        run: |
          python - <<'PY'
          from pathlib import Path

          def rep(path, old, new):
              p=Path(path); text=p.read_text(encoding='utf-8')
              if old not in text: raise SystemExit(f'target missing: {path}')
              p.write_text(text.replace(old,new,1),encoding='utf-8')

          p=Path('tests/test_bet_add_buttons_contract.py'); lines=p.read_text(encoding='utf-8').splitlines()
          for i,line in enumerate(lines):
              if 'tradable=side in' in line and 'assert' in line:
                  indent=line[:len(line)-len(line.lstrip())]
                  lines[i]=indent+'''assert 'tradable=side in {"OVER","UNDER"} and not no_line' in source'''
                  break
          else: raise SystemExit('generated assertion missing')
          p.write_text('\n'.join(lines)+'\n',encoding='utf-8')

          rep('pages/5_Daily_Projection_Run.py',
              "st.markdown('<div class=\"daily-section-head\">📚 Persistent history-only starter tracker</div>',, unsafe_allow_html=True)",
              "st.markdown('<div class=\"daily-section-head\">📚 Persistent history-only starter tracker</div>', unsafe_allow_html=True)")

          rep('tests/test_app_contract.py',
              '''def test_projection_owns_odds_workflow():\n    source = APP.read_text(encoding="utf-8")\n    assert "get_event_props" in source\n    assert "extract_player_odds" in source\n    assert "THE_ODDS_API_KEY" in source\n    assert "pitcher_strikeouts_alternate" in source\n''',
              '''def test_daily_run_owns_paid_odds_workflow_and_projection_reuses_snapshot():\n    source = APP.read_text(encoding="utf-8")\n    daily = (ROOT / "pages" / "5_Daily_Projection_Run.py").read_text(encoding="utf-8")\n    assert "get_event_props" not in source\n    assert "extract_player_odds" not in source\n    assert "load_pitcher_strikeout_odds" in source\n    assert "refresh_strikeout_snapshot" in daily\n    assert "resolve_api_key" in daily\n    assert "pitcher_strikeouts_alternate" in source\n''')

          rep('tests/test_batter_hand_and_odds_secret.py',
              '''def test_odds_errors_never_render_raw_exception_url_or_key():\n    app = Path("streamlit_app.py").read_text(encoding="utf-8")\n    assert 'safe_odds_error' in app\n    assert 'f"Odds API unavailable: {e}"' not in app\n    assert 'authentication failed (401)' in app\n''',
              '''def test_projection_has_no_direct_paid_odds_error_path():\n    app = Path("streamlit_app.py").read_text(encoding="utf-8")\n    odds = Path("engine/odds_snapshot.py").read_text(encoding="utf-8")\n    assert 'get_event_props' not in app\n    assert 'load_pitcher_strikeout_odds' in app\n    assert 'type(exc).__name__' in odds\n''')

          rep('tests/test_bet_add_buttons_contract.py',
              '    assert "Sportsbook lines/odds are execution info only and never rank the board or feed the forecast" in source',
              '    assert "Sportsbook lines and odds are execution information only" in source')

          Path('tests/test_manual_market_controls.py').write_text('''from pathlib import Path\n\n\ndef test_projection_uses_daily_lines_without_local_manual_market_editor():\n    source = Path("streamlit_app.py").read_text(encoding="utf-8")\n    assert "MANUAL LINE / ODDS" not in source\n    assert "Use manual market" not in source\n    assert "manual_market_recommendation" not in source\n    assert "overlay_manual_market_lines" in source\n    assert "apply_active_line_to_recommendation" in source\n    assert "NO ACTIVE LINE" in source\n    assert "PROJECTION ONLY" in source\n\n\ndef test_daily_run_is_single_persistent_manual_line_source_for_all_three_markets():\n    projection = Path("streamlit_app.py").read_text(encoding="utf-8")\n    daily = Path("pages/5_Daily_Projection_Run.py").read_text(encoding="utf-8")\n    assert "manual_k_line" in projection\n    assert "manual_outs_line" in projection\n    assert "manual_hits_line" in projection\n    assert "daily_manual_k_" in daily\n    assert "daily_manual_outs_" in daily\n    assert "daily_manual_hits_" in daily\n    assert "APPLY LINES + ADD TO PROJECTION ARCHIVE" in daily\n\n\ndef test_manual_lines_do_not_enter_projection_feature_builder():\n    source = Path("streamlit_app.py").read_text(encoding="utf-8")\n    feature_block = source[source.index('def build_engine_features'):source.index('def calculate_projection')]\n    assert 'manual_' not in feature_block\n    assert 'odds' not in feature_block.lower()\n''',encoding='utf-8')

          rep('tests/test_projection_weather_batter_contract.py',
              '    assert "Weather risk is informational and does not currently modify the projection" in text',
              '    assert "Weather does not modify the projection" in text\n    assert "ROOF PROTECTED" in text\n    assert "get_venue_roof_type" in text')
          PY
      - name: Restore workflow directory for connector cleanup
        run: git checkout HEAD -- .github/workflows
      - name: Compile
        run: python -m compileall -q streamlit_app.py navigation.py engine automation tests
      - name: Test
        run: pytest -q
      - name: Commit verified non-workflow fixes
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Restore project guardrails and clean stale patch assets"
          git push
