name: Add calibration dashboard

on:
  push:
    paths:
      - .add_calibration_dashboard
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pytest
      - run: python scripts/add_calibration_dashboard.py
      - run: python -m compileall -q streamlit_app.py navigation.py engine automation tests
      - run: pytest -q
      - name: Commit integration
        run: |
          rm -f .add_calibration_dashboard
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add streamlit_app.py .add_calibration_dashboard
          git commit -m 'Add milestone calibration dashboard' || exit 0
          git push
