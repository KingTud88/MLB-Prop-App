name: Surgical Mascot Crash Fix

on:
  workflow_dispatch:
  push:
    branches:
      - fix-mascot-render-surgical
    paths:
      - .github/workflows/fix-mascot-render-surgical.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-mascot-render-surgical
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pytest
      - name: Remove crashing mascot decode path only
        run: |
          python - <<'PY'
          from pathlib import Path

          ui = Path('engine/ui_command_center.py')
          s = ui.read_text(encoding='utf-8')
          s = s.replace('COMMAND_CENTER_UI_VERSION = "cle-command-center-v4"', 'COMMAND_CENTER_UI_VERSION = "cle-command-center-v5"')

          old = '''        with mascot_col:\n            if MASCOT_PATH.exists():\n                st.image(str(MASCOT_PATH), width=205)\n            else:\n                st.markdown('<div class="cc-team-mark" aria-label="StrikeOut King 9000">SK9K</div>', unsafe_allow_html=True)\n'''
          new = '''        with mascot_col:\n            st.markdown(\n                '<div class="cc-hero-fallback" aria-label="StrikeOut King 9000">SK9K<span>STRIKEOUT KING</span></div>',\n                unsafe_allow_html=True,\n            )\n'''
          if old not in s:
              raise SystemExit('mascot render anchor not found')
          s = s.replace(old, new)

          css_anchor = '''        .st-key-cc_hero_shell [data-testid="stImage"] img {\n            display:block;\n            max-height:218px;\n            object-fit:contain;\n            filter:drop-shadow(0 14px 18px rgba(0,0,0,.42)) drop-shadow(0 0 18px rgba(236,22,56,.12));\n        }\n'''
          css_new = css_anchor + '''        .cc-hero-fallback {\n            width:180px;\n            height:180px;\n            margin:auto;\n            display:flex;\n            flex-direction:column;\n            align-items:center;\n            justify-content:center;\n            border-radius:50%;\n            border:3px solid rgba(236,22,56,.78);\n            background:radial-gradient(circle at 35% 30%,#173e69,#07182b 68%);\n            box-shadow:inset 0 0 0 6px rgba(255,255,255,.025),0 14px 28px rgba(0,0,0,.38),0 0 20px rgba(236,22,56,.15);\n            color:#fff;\n            font-family:Impact,"Arial Narrow",Haettenschweiler,sans-serif;\n            font-size:2.55rem;\n            line-height:.9;\n            letter-spacing:.035em;\n            text-align:center;\n        }\n        .cc-hero-fallback span {\n            margin-top:.35rem;\n            color:var(--cc-red);\n            font-family:Inter,"Segoe UI",Roboto,Arial,sans-serif;\n            font-size:.68rem;\n            font-weight:900;\n            letter-spacing:.12em;\n        }\n'''
          if css_anchor not in s:
              raise SystemExit('mascot css anchor not found')
          s = s.replace(css_anchor, css_new)
          s = s.replace('.st-key-cc_hero_shell [data-testid="stImage"] img { width:150px; }', '.cc-hero-fallback { width:140px;height:140px;font-size:2rem; }')
          ui.write_text(s, encoding='utf-8')

          p = Path('tests/test_command_center_readability.py')
          t = p.read_text(encoding='utf-8')
          t = t.replace('COMMAND_CENTER_UI_VERSION = "cle-command-center-v4"', 'COMMAND_CENTER_UI_VERSION = "cle-command-center-v5"')
          t = t.replace('assert "st.image(str(MASCOT_PATH), width=205)" in source', 'assert "cc-hero-fallback" in source\n    assert "st.image(str(MASCOT_PATH)" not in source')
          p.write_text(t, encoding='utf-8')

          p = Path('tests/test_ui_command_center_contract.py')
          t = p.read_text(encoding='utf-8')
          t = t.replace('test_command_center_v4_exposes_reusable_hero_and_matchup_components', 'test_command_center_v5_exposes_reusable_hero_and_matchup_components')
          t = t.replace('COMMAND_CENTER_UI_VERSION = "cle-command-center-v4"', 'COMMAND_CENTER_UI_VERSION = "cle-command-center-v5"')
          t = t.replace('assert "st.image(str(MASCOT_PATH), width=205)" in source', 'assert "cc-hero-fallback" in source\n    assert "st.image(str(MASCOT_PATH)" not in source')
          t = t.replace('test_main_projection_uses_v4_components_without_removing_model_flow', 'test_main_projection_uses_v5_components_without_removing_model_flow')
          p.write_text(t, encoding='utf-8')
          PY
      - name: Full quality gate
        run: |
          python -m compileall -q streamlit_app.py navigation.py engine automation tests
          pytest -q
      - name: Commit surgical fix and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add engine/ui_command_center.py tests/test_command_center_readability.py tests/test_ui_command_center_contract.py
          git rm .github/workflows/fix-mascot-render-surgical.yml
          git commit -m "Prevent mascot asset from crashing Projection"
          git push origin HEAD:fix-mascot-render-surgical
