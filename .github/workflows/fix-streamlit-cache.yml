name: Clean Top Plays Readability

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-streamlit-cache.yml

permissions:
  contents: write

jobs:
  clean-top-plays:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Reorder Top Plays board and enlarge action cards
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('pages/6_Top_Plays.py')
          s=p.read_text(encoding='utf-8')
          old='view = plays[["Rank", "Status", "Model Health", "Decision Evidence", "Decision Sample", "Signal Evidence", "Signal Sample", "Tier Hit Rate", "Pitcher", "Weather Icon", "Weather Risk", "Market", "Side", "Line", "Projection", "Model Probability", "Data Quality", "Starter History", "Book", "Odds"]].copy()'
          new='view = plays[["Rank", "Pitcher", "Weather Icon", "Market", "Side", "Line", "Projection", "Model Probability", "Status", "Weather Risk", "Data Quality", "Book", "Odds"]].copy()'
          if old in s:
              s=s.replace(old,new,1)
          elif new not in s:
              raise SystemExit('Top Plays table anchor not found')
          s=s.replace('view["Tier Hit Rate"] = view["Tier Hit Rate"].map(lambda x: "—" if x is None or pd.isna(x) else f"{float(x):.1%}")\n','',1)
          old_cards='''        st.caption(f"#{rank} {play_row['Pitcher']} {weather_icon} · {play_row['Side']} {float(play_row['Line']):g}".replace("  ·", " ·"))
        st.caption(f"Decision evidence: {play_row.get('Decision Evidence', 'LEARNING')} · n={int(play_row.get('Decision Sample', 0) or 0)}")
        st.caption(f"Signal evidence: {play_row.get('Signal Evidence', 'LEARNING')} · {play_row.get('Signal Detail', 'No mature paired signal evidence yet.')}")'''
          new_cards='''        st.markdown(f"### #{rank} · {play_row['Pitcher']} {weather_icon}".strip())
        st.markdown(f"**{play_row['Market']} · {play_row['Side']} {float(play_row['Line']):g}**")
        st.markdown(f"Projection **{float(play_row['Projection']):.2f}** · Model **{float(play_row['Model Probability']):.1%}**")
        st.caption(f"{play_row.get('Status', 'MODEL PLAY')} · {play_row.get('Model Health', 'LEARNING')} health · evidence in View details")'''
          if old_cards in s:
              s=s.replace(old_cards,new_cards,1)
          elif new_cards not in s:
              raise SystemExit('Top Plays card anchor not found')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate Top Plays page
        run: |
          pip install -r requirements.txt pytest
          python -m compileall -q pages/6_Top_Plays.py engine tests
          pytest -q tests/test_app_contract.py
          grep -q 'view = plays\[\["Rank", "Pitcher"' pages/6_Top_Plays.py
          grep -q 'Projection \*\*' pages/6_Top_Plays.py
      - name: Commit readability cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages/6_Top_Plays.py
          git diff --cached --quiet && exit 0
          git commit -m "Clean up Top Plays readability"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
