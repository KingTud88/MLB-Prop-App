name: Run weather snapshot UI patch

on:
  push:
    paths:
      - scripts/patch_weather_snapshot_ui.py
      - .github/weather-snapshot-trigger
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pytest
      - run: python scripts/patch_weather_snapshot_ui.py
      - run: python -m compileall -q automation pages engine tests
      - run: pytest -q
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add automation/daily_projection_runner.py pages/5_Daily_Projection_Run.py pages/6_Top_Plays.py engine/model_top_plays.py tests/test_weather_snapshot_ui.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Carry weather delay risk into Daily and Top Plays"
          git pull --rebase origin main
          git push origin HEAD:main
