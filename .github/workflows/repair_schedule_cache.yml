name: Repair schedule cache

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Repair get_schedule caching
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          app = Path("streamlit_app.py")
          text = app.read_text(encoding="utf-8")
          old = '@st.cache_data(ttl=120,show_spinner=False)\ndef get_schedule'
          new = '@st.cache_resource(ttl=120,show_spinner=False)\ndef get_schedule'
          if old not in text:
              raise SystemExit("Expected get_schedule cache decorator was not found")
          app.write_text(text.replace(old, new, 1), encoding="utf-8")
          Path(".github/workflows/repair_schedule_cache.yml").unlink()
          PY

      - name: Commit repair and remove one-time workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add streamlit_app.py .github/workflows/repair_schedule_cache.yml
          git diff --cached --quiet && exit 0
          git commit -m "Fix schedule cache serialization error"
          git push
