name: Sidebar + Metric Parity V16

on:
  push:
    paths:
      - '.github/workflows/sidebar-metric-parity-v16.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pytest
      - name: Apply presentation-only parity patch
        run: python .github/scripts/sidebar_metric_parity_v16.py
      - name: Refresh intentional UI contracts
        run: python .github/scripts/sidebar_metric_parity_v16_contract_fix.py
      - name: Compile changed Python
        run: python -m compileall -q streamlit_app.py navigation.py engine pages tests
      - name: Run full regression suite
        run: pytest -q
      - name: Commit verified app changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add navigation.py streamlit_app.py engine/explainability_ui.py pages/4_Projection_History.py tests/test_sidebar_metric_explainability_v2.py tests/test_ui_theme_contract.py
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No product changes to commit."
            exit 0
          fi
          git commit -m "Match Projection sidebar and deepen metric explainers"
          git restore .
          git clean -fd
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
