name: Starter Role Runtime State

on:
  workflow_dispatch:
  push:
    paths:
      - engine/role_workload_gate.py
      - training/starter_role_runtime_state.py
      - tests/test_role_workload_gate.py
      - data/projection_log.csv
      - .github/workflows/starter-role-runtime-state.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pytest
      - name: Shadow gate contracts
        run: pytest -q tests/test_role_workload_gate.py tests/test_starter_role.py tests/test_starter_role_candidate.py tests/test_starter_role_promotion_gate.py
      - name: Export validated runtime role state
        run: python -m training.starter_role_runtime_state --seasons 2024 2025 2026
      - name: Commit runtime state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/starter_role_runtime_state.csv
          if git diff --cached --quiet; then
            echo "No starter role runtime state changes"
            exit 0
          fi
          git commit -m "Refresh starter role runtime state"
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
