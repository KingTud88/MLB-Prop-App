name: targeted research metadata cleanup

on:
  push:
    branches:
      - cleanup/remove-eight-card-metadata
  pull_request:

permissions:
  contents: read

jobs:
  targeted:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
      - run: >-
          pytest -q tests/test_research_evidence_command_center.py
          -k 'summary_is_operational_only_not_a_composite_research_score or command_center_contract_is_report_only_without_presentation_lock'
