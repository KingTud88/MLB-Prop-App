name: Projection Cosmetic Cleanup

on:
  workflow_dispatch:
  push:
    paths:
      - scripts/apply_projection_cosmetics.py
      - .github/workflows/projection-cosmetic-cleanup.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pytest
      - name: Apply projection cosmetics
        run: python scripts/apply_projection_cosmetics.py
      - name: Compile projection page
        run: python -m py_compile streamlit_app.py
      - name: Run projection contracts
        run: pytest -q tests/test_app_contract.py tests/test_odds_credit_saver.py tests/test_batter_hand_and_odds_secret.py
      - name: Commit cleanup and retire migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/projection-cosmetic-cleanup.yml scripts/apply_projection_cosmetics.py
          git add streamlit_app.py
          git commit -m "Polish projection lean colors and pitcher selector"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
