name: Slate Capture Integrity Audit

on:
  workflow_dispatch:
  push:
    branches:
      - slate-capture-integrity-audit
    paths:
      - training/slate_capture_integrity.py
      - .github/workflows/slate-capture-integrity.yml

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt pytest
      - name: Full quality suite
        run: pytest -q
      - name: Audit announced starter capture coverage
        run: python -m training.slate_capture_integrity
      - name: Commit audit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/slate_capture_integrity.csv
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refresh slate capture integrity audit"
          git push origin HEAD:slate-capture-integrity-audit
