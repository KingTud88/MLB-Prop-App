name: Run persistent history-only tracker patch

on:
  push:
    paths:
      - scripts/patch_history_only_tracker.py
      - .github/workflows/run-history-only-tracker.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pytest
      - name: Apply persistent history-only tracker patch
        run: python scripts/patch_history_only_tracker.py
      - name: Compile
        run: python -m compileall -q streamlit_app.py pages engine automation tests
      - name: Test
        run: pytest -q
      - name: Commit feature
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages/5_Daily_Projection_Run.py tests/test_daily_history_ui.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add persistent history-only starter tracker"
          git pull --rebase origin main
          git push origin HEAD:main
