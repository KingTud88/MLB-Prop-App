name: Workload Promotion Report

on:
  push:
    branches:
      - research/workload-final-promotion-report

permissions:
  contents: write

jobs:
  report:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run same-frame workload promotion replay
        run: python -m training.workload_promotion_report
      - name: Commit report outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/workload_promotion_evidence.csv data/workload_promotion_decisions.csv
          if git diff --cached --quiet; then
            echo "No report changes to commit"
          else
            git commit -m "Refresh final workload promotion report"
            git push
          fi
