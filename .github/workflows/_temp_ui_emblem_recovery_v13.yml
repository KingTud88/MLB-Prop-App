name: temp-ui-emblem-recovery-v13
on:
  push:
    branches: [ui/info-emblem-recovery-v13]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/info-emblem-recovery-v13
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply UI patch
        run: python automation/_temp_ui_emblem_recovery_v13.py
      - name: Compile changed Python
        run: python -m compileall -q streamlit_app.py engine/card_explainability.py tests/test_info_emblem_polish.py
      - name: Remove temporary runner
        run: rm automation/_temp_ui_emblem_recovery_v13.py .github/workflows/_temp_ui_emblem_recovery_v13.yml
      - name: Commit applied patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add streamlit_app.py engine/card_explainability.py tests/test_info_emblem_polish.py automation/_temp_ui_emblem_recovery_v13.py .github/workflows/_temp_ui_emblem_recovery_v13.yml
          git commit -m "Recover Projection emblems and center info icon"
          git push origin HEAD:ui/info-emblem-recovery-v13
