name: Top Plays Postmortem Report

on:
  push:
    branches:
      - research/top-plays-postmortem

permissions:
  contents: write

jobs:
  report:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
      - name: Verify postmortem contracts
        run: python -m pytest -q tests/test_top_plays_postmortem.py tests/test_top_plays_postmortem_nulls.py
      - name: Run real-line chronological postmortem
        run: python -m training.top_plays_postmortem
      - name: Commit report outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/top_plays_postmortem_detail.csv data/top_plays_postmortem_summary.csv data/top_plays_postmortem_daily.csv data/top_plays_postmortem_coverage.csv
          if git diff --cached --quiet; then
            echo "No postmortem changes to commit"
          else
            git commit -m "Refresh real-line Top Plays postmortem"
            git push
          fi
