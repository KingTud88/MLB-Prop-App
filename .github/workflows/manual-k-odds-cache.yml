name: Manual K Odds Cache Integration

on:
  workflow_dispatch:
  push:
    branches:
      - manual-k-odds-cache
    paths:
      - engine/odds_snapshot.py
      - tests/test_odds_snapshot.py
      - tests/test_odds_credit_saver.py
      - scripts/apply_manual_k_odds_cache.py
      - .github/workflows/manual-k-odds-cache.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt pytest
      - name: Apply page wiring
        run: python scripts/apply_manual_k_odds_cache.py
      - name: Contract and quality tests
        run: pytest -q
      - name: Commit integrated page changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add streamlit_app.py pages/5_Daily_Projection_Run.py pages/6_Top_Plays.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Wire manual strikeout odds snapshot into projection pages"
          git push origin HEAD:manual-k-odds-cache
