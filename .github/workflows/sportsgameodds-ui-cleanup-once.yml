name: One-shot SportsGameOdds UI cleanup

on:
  push:
    branches:
      - agent/sportsgameodds-ui-cleanup
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout cleanup branch
        uses: actions/checkout@v6
        with:
          ref: agent/sportsgameodds-ui-cleanup
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Apply cleanup
        run: python automation/sportsgameodds_ui_cleanup_once.py

      - name: Compile changed app surfaces
        run: |
          python -m compileall -q streamlit_app.py pages/4_Projection_History.py pages/5_Daily_Projection_Run.py pages/6_Top_Plays.py engine/explainability_ui.py

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run cleanup regression test
        run: pytest -q tests/test_sportsgameodds_ui_cleanup.py

      - name: Commit cleanup result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No cleanup changes to commit.'
            exit 1
          fi
          git commit -m 'Clean obsolete sportsbook UI after SportsGameOdds automation'
          git push origin HEAD:agent/sportsgameodds-ui-cleanup
