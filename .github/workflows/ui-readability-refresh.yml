name: UI Readability Refresh

on:
  push:
    paths:
      - engine/ui_theme.py
      - scripts/apply_ui_readability.py
      - .github/workflows/ui-readability-refresh.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply shared theme imports
        run: python scripts/apply_ui_readability.py
      - name: Compile touched pages
        run: python -m compileall -q streamlit_app.py pages engine/ui_theme.py
      - name: Run UI and contract tests
        run: pytest -q tests/test_app_contract.py tests/test_daily_projection_page_contract.py tests/test_daily_readability.py tests/test_daily_table_order.py tests/test_daily_history_ui.py tests/test_projection_history_learning_dashboard.py tests/test_bet_tracker_page_contract.py tests/test_top_play_details_contract.py tests/test_odds_credit_saver.py tests/test_batter_hand_and_odds_secret.py
      - name: Commit page cleanup and retire one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/ui-readability-refresh.yml
          git add streamlit_app.py pages/2_Bet_Tracker.py pages/4_Projection_History.py pages/5_Daily_Projection_Run.py pages/6_Top_Plays.py
          git commit -m "Standardize app page readability and visual hierarchy"
          git pull --rebase origin main
          git push origin HEAD:main
