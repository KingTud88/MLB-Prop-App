name: governance-v2-branch-patch

on:
  push:
    branches:
      - research/governance-v2-hardening

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Bootstrap governance v2 integration patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: research/governance-v2-hardening
          fetch-depth: 0
      - name: Apply governance v2 integration
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"expected patch anchor missing in {path}: {old[:80]!r}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          # Promotion command center: apply Governance v2 after source-owned adapters.
          replace_once(
              "training/research_promotion_command_center.py",
              "from training.research_evidence_command_center import COLUMNS, build_command_center\n",
              "from training.research_evidence_command_center import COLUMNS, build_command_center\nfrom training.research_governance_v2 import apply_promotion_governance\n",
          )
          replace_once(
              "training/research_promotion_command_center.py",
              'VERSION = "research-promotion-command-center-v3-all-lanes"',
              'VERSION = "research-promotion-command-center-v4-governance-v2"',
          )
          replace_once(
              "training/research_promotion_command_center.py",
              '    rows = base.to_dict("records") + extra.to_dict("records")\n    return pd.DataFrame(rows, columns=COLUMNS)\n',
              '    rows = base.to_dict("records") + extra.to_dict("records")\n    center = pd.DataFrame(rows, columns=COLUMNS)\n    return apply_promotion_governance(center, root)\n',
          )

          # Calibration replay: carry immutable pregame identities so breadth can be audited.
          replace_once(
              "training/calibration_shadow_replay.py",
              '        "game_date", "captured_at_utc", "Milestone", "Actual_Hit",\n',
              '        "game_date", "captured_at_utc", "game_pk", "pitcher_id", "player", "opponent",\n        "Milestone", "Actual_Hit",\n',
          )
          replace_once(
              "training/calibration_shadow_replay.py",
              '                "game_date": str(current.get("game_date", "")),\n                "captured_at_utc": str(current.get("captured_at_utc", "")),\n                "Milestone": int(milestone),\n',
              '                "game_date": str(current.get("game_date", "")),\n                "captured_at_utc": str(current.get("captured_at_utc", "")),\n                "game_pk": current.get("game_pk"),\n                "pitcher_id": current.get("pitcher_id"),\n                "player": current.get("player"),\n                "opponent": current.get("opponent"),\n                "Milestone": int(milestone),\n',
          )

          # Manual review packet: alert on categorical evidence polarity reversals only.
          packet = Path("training/research_manual_review_packet.py")
          text = packet.read_text(encoding="utf-8")
          anchor = '''def _number(value: object) -> float | None:\n    parsed = pd.to_numeric(pd.Series([value]), errors="coerce").iloc[0]\n    return None if pd.isna(parsed) else float(parsed)\n\n\n'''
          helpers = '''POSITIVE_DIRECTION_TOKENS = (\n    "STRONG EVIDENCE", "SUPPORTED", "SUPPORTIVE", "HELPING", "LEAN_CONSISTENT", "PROMOTE", "PASS",\n)\nNEGATIVE_DIRECTION_TOKENS = (\n    "UNDERPERFORMING", "CONTRADICTORY", "HURTING", "REJECT", "FAIL",\n)\n\n\ndef _direction_polarity(value: object) -> str:\n    text = _clean(value).upper()\n    positive = any(token in text for token in POSITIVE_DIRECTION_TOKENS)\n    negative = any(token in text for token in NEGATIVE_DIRECTION_TOKENS)\n    if positive == negative:\n        return ""\n    return "POSITIVE" if positive else "NEGATIVE"\n\n\ndef _material_direction_flip(current: pd.Series, previous: pd.Series) -> bool:\n    if not _truthy(current.get("Evidence_Direction_Changed")) or previous is None or previous.empty:\n        return False\n    current_polarity = _direction_polarity(current.get("Evidence_Direction"))\n    previous_polarity = _direction_polarity(previous.get("Evidence_Direction"))\n    return bool(current_polarity and previous_polarity and current_polarity != previous_polarity)\n\n\n'''
          if anchor not in text:
              raise SystemExit("manual packet helper anchor missing")
          text = text.replace(anchor, anchor + helpers, 1)
          old_trigger = '''    action = _truthy(row.get("Action_Changed"))\n    milestone = _primary_milestone_crossed(row, previous)\n    if status and readiness:\n        return "STATUS_AND_READINESS_TRANSITION"\n    if status:\n        return "STATUS_TRANSITION"\n    if readiness:\n        return "READINESS_TRANSITION"\n    if action:\n        return "ACTION_TRANSITION"\n'''
          new_trigger = '''    action = _truthy(row.get("Action_Changed"))\n    direction_flip = _material_direction_flip(row, previous)\n    milestone = _primary_milestone_crossed(row, previous)\n    if status and readiness:\n        return "STATUS_AND_READINESS_TRANSITION"\n    if status:\n        return "STATUS_TRANSITION"\n    if readiness:\n        return "READINESS_TRANSITION"\n    if direction_flip:\n        return "EVIDENCE_DIRECTION_FLIP"\n    if action:\n        return "ACTION_TRANSITION"\n'''
          if old_trigger not in text:
              raise SystemExit("manual packet trigger anchor missing")
          packet.write_text(text.replace(old_trigger, new_trigger, 1), encoding="utf-8")

          # Shared research refresh: test, generate, and persist Governance v2 artifacts.
          runner = Path("automation/research_context_readiness.sh")
          text = runner.read_text(encoding="utf-8")
          old_tests = '''  tests/test_research_promotion_command_center.py \\\n  tests/test_research_promotion_scoreboard.py \\\n'''
          new_tests = '''  tests/test_research_promotion_command_center.py \\\n  tests/test_research_governance_v2.py \\\n  tests/test_research_direction_flip_review.py \\\n  tests/test_calibration_shadow_governance_metadata.py \\\n  tests/test_research_promotion_governance_integration.py \\\n  tests/test_research_governance_pipeline_contract.py \\\n  tests/test_research_promotion_scoreboard.py \\\n'''
          if old_tests not in text:
              raise SystemExit("runner test anchor missing")
          text = text.replace(old_tests, new_tests, 1)
          old_run = '''PYTHONPATH=. python -m training.research_promotion_command_center\nPYTHONPATH=. python -m training.research_milestone_watch \\\n'''
          new_run = '''PYTHONPATH=. python -m training.research_promotion_command_center\nPYTHONPATH=. python -m training.research_governance_v2\nPYTHONPATH=. python -m training.research_milestone_watch \\\n'''
          if old_run not in text:
              raise SystemExit("runner execution anchor missing")
          text = text.replace(old_run, new_run, 1)
          old_add = '''  data/research_promotion_command_center.csv \\\n  data/research_promotion_command_center_summary.csv \\\n  data/research_milestone_watch.csv \\\n'''
          new_add = '''  data/research_promotion_command_center.csv \\\n  data/research_promotion_command_center_summary.csv \\\n  data/research_hypothesis_manifest.csv \\\n  data/research_uncertainty_v2.csv \\\n  data/research_governance_v2_summary.csv \\\n  data/research_milestone_watch.csv \\\n'''
          if old_add not in text:
              raise SystemExit("runner persistence anchor missing")
          runner.write_text(text.replace(old_add, new_add, 1), encoding="utf-8")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            training/research_promotion_command_center.py \
            training/calibration_shadow_replay.py \
            training/research_manual_review_packet.py \
            automation/research_context_readiness.sh
          git commit -m "Apply research governance v2 integration"
          git push origin HEAD:research/governance-v2-hardening
