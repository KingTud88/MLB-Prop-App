name: Pitch Mix Whiff Forward Diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pytest
      - name: Validate and build preregistered forward evaluation
        run: |
          PYTHONPATH=. pytest -q tests/test_pitch_mix_whiff_forward_evaluation.py
          PYTHONPATH=. python -m training.pitch_mix_whiff_forward_evaluation
          echo '--- gate ---'
          cat data/pitch_mix_whiff_forward_gate.csv
          echo '--- summary ---'
          cat data/pitch_mix_whiff_forward_summary.csv
          echo '--- detail rows ---'
          wc -l data/pitch_mix_whiff_forward_detail.csv
