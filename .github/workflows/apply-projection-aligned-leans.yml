name: Apply projection-aligned bet leans

on:
  push:
    branches: [main]
    paths:
      - scripts/fix_projection_aligned_leans.py
      - .github/workflows/apply-projection-aligned-leans.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply lean fixes
        run: python scripts/fix_projection_aligned_leans.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add engine/projection_engine.py streamlit_app.py pages/6_Top_Plays.py
          if git diff --cached --quiet; then
            echo "No changes needed."
          else
            git commit -m "Align bet leans with point projections"
            for attempt in 1 2 3; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then exit 0; fi
              sleep $((attempt * 2))
            done
            exit 1
          fi
